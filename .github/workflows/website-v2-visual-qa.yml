name: Website V2 Visual QA

on:
  pull_request:
    branches: [master]
    paths:
      - 'apps/website/**'
      - '.github/workflows/website-v2-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-v2-visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rendered-visual-qa:
    name: Rendered EN/TR desktop-tablet-mobile QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact V2 source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install website and pinned Chromium QA runtime
        run: |
          npm ci --prefix apps/website --ignore-scripts --audit=false --fund=false
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Build production website
        working-directory: apps/website
        run: npm run build

      - name: Start local production server
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/website && NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3100 npm run start -- -H 127.0.0.1 -p 3100) > /tmp/ilaios-v2-next.log 2>&1 &
          echo $! > /tmp/ilaios-v2-next.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ilaios-v2-next.log
          exit 1

      - name: Run rendered visual QA and capture evidence
        env:
          ILAIOS_V2_BASE_URL: http://127.0.0.1:3100
          ILAIOS_V2_VISUAL_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/website-v2-visual-qa
        run: python apps/website/scripts/website-v2-visual-qa.py

      - name: Upload rendered visual QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-v2-visual-qa-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: artifacts/website-v2-visual-qa
          if-no-files-found: error
          retention-days: 30

      - name: Stop local production server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/ilaios-v2-next.pid ]; then
            kill "$(cat /tmp/ilaios-v2-next.pid)" || true
          fi
