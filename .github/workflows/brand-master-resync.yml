name: Brand Master Resync

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/brand-master-resync.yml'

permissions:
  contents: write

jobs:
  resync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'brand/canonical-neutral-palette-20260902'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout brand branch
        uses: actions/checkout@v4
        with:
          ref: brand/canonical-neutral-palette-20260902
          fetch-depth: 0

      - name: Merge current master with bounded conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master

          set +e
          git merge --no-ff --no-commit origin/master
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'conflicts: %s\n' "${conflicts[*]:-none}"
            for path in "${conflicts[@]}"; do
              case "$path" in
                apps/web_app_runtime/login_server.py|tests/test_app_ilaios_login_surface.py) ;;
                *) echo "unexpected conflict: $path" >&2; exit 31 ;;
              esac
            done
            git checkout --theirs -- apps/web_app_runtime/login_server.py tests/test_app_ilaios_login_surface.py
            git add apps/web_app_runtime/login_server.py tests/test_app_ilaios_login_surface.py
          fi

          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web_app_runtime/login_server.py')
          text = p.read_text(encoding='utf-8')
          old = '_BRAND_DARK = (_BRAND_DIR / "02-ilaios-primary-horizontal-dark.jpg").read_bytes()'
          new = '_BRAND_DARK = (_BRAND_DIR / "05-ilaios-app-icon.jpg").read_bytes()'
          if old in text:
              text = text.replace(old, new, 1)
          if new not in text:
              raise SystemExit('canonical 05 dark owner missing after merge')
          if '<h1 id="login-title">Welcome back</h1>' not in text:
              raise SystemExit('current master login heading not preserved')
          p.write_text(text, encoding='utf-8')
          PY

          grep -Fq 'assert "Welcome back" in document' tests/test_app_ilaios_login_surface.py
          grep -Fq 'assert "Sign in to ILAIOS" not in document' tests/test_app_ilaios_login_surface.py
          git add apps/web_app_runtime/login_server.py tests/test_app_ilaios_login_surface.py

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'unresolved merge conflicts remain' >&2
            git diff --name-only --diff-filter=U
            exit 32
          fi

          git diff --cached --check
          git commit -m 'merge(master): resync brand migration with current master'
          git push origin HEAD:brand/canonical-neutral-palette-20260902
