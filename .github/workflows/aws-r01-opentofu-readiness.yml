name: AWS R01 OpenTofu readiness

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aws-r01-opentofu-readiness.yml'
      - 'infra/aws/r01-canary/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.10.6
      - name: OpenTofu format
        working-directory: infra/aws/r01-canary
        run: tofu fmt -check -recursive
      - name: OpenTofu init without backend
        working-directory: infra/aws/r01-canary
        run: tofu init -backend=false -input=false
      - name: OpenTofu validate
        working-directory: infra/aws/r01-canary
        run: tofu validate
