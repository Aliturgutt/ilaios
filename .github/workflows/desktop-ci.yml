name: ILAIOS Desktop CI

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: apps/desktop
        run: flutter pub get --enforce-lockfile
      - name: Flutter analyze
        working-directory: apps/desktop
        run: flutter analyze
      - name: Flutter test
        working-directory: apps/desktop
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee flutter-test.log
      - name: Upload Flutter test failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-flutter-test-failure-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: apps/desktop/flutter-test.log
          if-no-files-found: error
          retention-days: 7

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Flutter pub get
        working-directory: apps/desktop
        run: flutter pub get --enforce-lockfile
      - name: Build Windows release
        working-directory: apps/desktop
        run: flutter build windows --release
