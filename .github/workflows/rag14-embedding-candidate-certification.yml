name: RAG14 Embedding Candidate Certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag14-embedding-candidate-certification
  cancel-in-progress: false

jobs:
  certify-candidate:
    name: Pinned multilingual embedding host certification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/rag14-embedding-certification.txt

      - name: Install exact candidate certification runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r .github/requirements/rag14-embedding-certification.txt
          python -m pip check

      - name: Run pinned model integrity, memory, latency and multilingual retrieval benchmark
        shell: bash
        run: |
          set -euo pipefail
          python -m services.rag14_embedding_benchmark \
            --manifest infra/rag/multilingual-e5-small-qint8.candidate.json \
            --work-dir .cache/rag14-embedding-candidate \
            --output artifacts/rag14-embedding-candidate/benchmark.json

      - name: Publish measured evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "# RAG.14 Embedding Candidate Certification"
            echo
            echo "Exact source SHA: \`${GITHUB_SHA}\`"
            echo
            if [[ -f artifacts/rag14-embedding-candidate/benchmark.json ]]; then
              echo '```json'
              cat artifacts/rag14-embedding-candidate/benchmark.json
              echo '```'
            else
              echo "Measured benchmark evidence was not produced; candidate remains **NOT CERTIFIED**."
            fi
            echo
            echo "> A passing host benchmark certifies only a pinned candidate. It never grants RAG.14 production promotion."
          } >> "$GITHUB_STEP_SUMMARY"
