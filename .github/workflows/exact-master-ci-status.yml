name: Exact Master CI Status

on:
  workflow_run:
    workflows: ["Required CI Gate"]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: exact-master-ci-status-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact-master CI status
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish Required CI result for exact master SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          case "$CONCLUSION" in
            success)
              state="success"
              description="Required CI Gate PASS on exact master"
              ;;
            failure|timed_out|cancelled|action_required)
              state="failure"
              description="Required CI Gate ${CONCLUSION} on exact master"
              ;;
            *)
              state="error"
              description="Required CI Gate ${CONCLUSION:-unknown} on exact master"
              ;;
          esac

          payload="$({
            STATE="$state" DESCRIPTION="$description" python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "ILAIOS Exact Master CI",
              "description": os.environ["DESCRIPTION"][:140],
              "target_url": os.environ["RUN_URL"],
          }))
          PY
          })"

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --data "$payload"
