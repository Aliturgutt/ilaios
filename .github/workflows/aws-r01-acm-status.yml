name: AWS R01 ACM status

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aws-r01-acm-status.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1
      - name: Verify ACM status
        run: |
          set -euo pipefail
          ARN='arn:aws:acm:eu-central-1:101180464425:certificate/95994b5b-ff08-4af2-913d-9952e95f8aa1'
          aws acm describe-certificate --certificate-arn "$ARN" --region eu-central-1 --query 'Certificate.{Status:Status,DomainName:DomainName}'
