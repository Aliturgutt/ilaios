name: ILAIOS Desktop Signed MSIX Release

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Partner Center/package Identity Name'
        required: true
        type: string
      publisher:
        description: 'Certificate/Partner Center Publisher subject'
        required: true
        type: string
      version:
        description: 'Four-part MSIX version, e.g. 1.0.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-msix:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: desktop-release-signing
    env:
      ILAIOS_PACKAGE_IDENTITY: ${{ inputs.identity_name }}
      ILAIOS_PACKAGE_PUBLISHER: ${{ inputs.publisher }}
      ILAIOS_PACKAGE_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require signing secrets
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.ILAIOS_WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.ILAIOS_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) { throw 'ILAIOS_WINDOWS_SIGNING_PFX_BASE64 is not provisioned.' }
          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) { throw 'ILAIOS_WINDOWS_SIGNING_PFX_PASSWORD is not provisioned.' }
          if ([string]::IsNullOrWhiteSpace($env:ILAIOS_PACKAGE_IDENTITY)) { throw 'Package identity is required.' }
          if ([string]::IsNullOrWhiteSpace($env:ILAIOS_PACKAGE_PUBLISHER)) { throw 'Package publisher is required.' }
          if ($env:ILAIOS_PACKAGE_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Package version must have four numeric components.' }
          Write-Host 'ILAIOS_DESKTOP_SIGNING_INPUTS=READY'

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        working-directory: apps/desktop
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        working-directory: apps/desktop
        run: flutter analyze

      - name: Test
        working-directory: apps/desktop
        run: flutter test

      - name: Build Windows release
        working-directory: apps/desktop
        run: flutter build windows --release

      - name: Build bundled control plane
        working-directory: apps/desktop
        shell: pwsh
        run: ./tool/build_control_plane_sidecar.ps1

      - name: Build publisher-bound MSIX
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $output = "build\msix\ILAIOS-Desktop-$($env:ILAIOS_PACKAGE_VERSION)-x64.msix"
          ./tool/build_msix.ps1 -IdentityName $env:ILAIOS_PACKAGE_IDENTITY -Publisher $env:ILAIOS_PACKAGE_PUBLISHER -Version $env:ILAIOS_PACKAGE_VERSION -OutputPath $output
          "ILAIOS_SIGNED_MSIX_PATH=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Materialize signing certificate
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.ILAIOS_WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_B64)
          $path = Join-Path $env:RUNNER_TEMP 'ilaios-signing.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          "ILAIOS_PFX_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign and verify MSIX
        working-directory: apps/desktop
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.ILAIOS_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          ./tool/sign_msix.ps1 -MsixPath $env:ILAIOS_SIGNED_MSIX_PATH -PfxPath $env:ILAIOS_PFX_PATH -PfxPassword $env:PFX_PASSWORD -ExpectedPublisher $env:ILAIOS_PACKAGE_PUBLISHER

      - name: Remove certificate material
        if: always()
        shell: pwsh
        run: |
          if ($env:ILAIOS_PFX_PATH -and (Test-Path $env:ILAIOS_PFX_PATH)) {
            Remove-Item $env:ILAIOS_PFX_PATH -Force
          }

      - name: Upload signed release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ilaios-desktop-${{ inputs.version }}-x64-signed
          path: apps/desktop/build/msix/ILAIOS-Desktop-${{ inputs.version }}-x64.msix
          if-no-files-found: error
          retention-days: 30
