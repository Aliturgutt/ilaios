name: AWS R03 guarded PRODUCTION apply

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: release-r03-production-state
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      AWS_REGION: eu-central-1
      AWS_ACCOUNT_ID: '101180464425'
      RUNTIME_NAME: ilaios-r01-canary
      SIGNING_PROFILE: ILAIOS_R01_ECR
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate exact R03 human approval and bounded production scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import ipaddress, json
          from pathlib import Path
          data = json.loads(Path('.github/r03-production-promotion-approval.json').read_text())
          assert data.get('approval') == 'RELEASE.R03 PRODUCTION PROMOTION APPROVED'
          assert data.get('package_id') == 'RELEASE.R03.v1'
          assert data.get('external_spend_approval') is True
          assert data.get('production_desired_count') == 2
          network = ipaddress.ip_network(data.get('retain_ipv4_cidr', ''), strict=True)
          assert network.version == 4 and network.prefixlen == 32
          assert data.get('retain_tenant_id') == 'ilaios-r01-canary'
          print('R03_EXACT_APPROVAL_PASS')
          PY

      - name: Verify canonical R02 dependency evidence
        run: |
          set -euo pipefail
          E='dev/openclaw/evidence/RELEASE.R02/decision.yaml'
          grep -Fxq 'milestone_id: RELEASE.R02' "$E"
          grep -Fxq 'package_id: RELEASE.R02.v1' "$E"
          grep -Fxq 'status: PASS' "$E"
          grep -Fxq 'readiness: COMPLETE' "$E"
          grep -Fxq 'release_state: LIMITED_DEPLOYED_HEALTHY' "$E"
          grep -Fxq 'deployment_performed: true' "$E"
          grep -Fxq 'limited_desired_count: 2' "$E"
          grep -Fxq 'limited_running_count: 2' "$E"
          grep -Fxq 'limited_pending_count: 0' "$E"
          grep -Fxq 'network_exposure_broadened: false' "$E"
          echo 'R02_DEPENDENCY_EVIDENCE_PASS'

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1

      - name: Verify live R02 baseline
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          read -r STATUS DESIRED RUNNING PENDING TASKDEF < <(aws ecs describe-services --region "$AWS_REGION" --cluster "$RUNTIME_NAME" --services "$RUNTIME_NAME" --query 'services[0].[status,to_string(desiredCount),to_string(runningCount),to_string(pendingCount),taskDefinition]' --output text)
          test "$STATUS" = ACTIVE
          test "$DESIRED" = 2
          test "$RUNNING" = 2
          test "$PENDING" = 0
          TASK_JSON="$(aws ecs describe-task-definition --region "$AWS_REGION" --task-definition "$TASKDEF" --output json)"
          RELEASE_STATE="$(printf '%s' "$TASK_JSON" | jq -r '.taskDefinition.containerDefinitions[] | select(.name=="runtime") | .environment[]? | select(.name=="ILAIOS_RELEASE_STATE") | .value')"
          test "$RELEASE_STATE" = LIMITED
          IMAGE="$(printf '%s' "$TASK_JSON" | jq -r '.taskDefinition.containerDefinitions[] | select(.name=="runtime") | .image')"
          IMAGE_DIGEST="${IMAGE##*@}"
          test "${IMAGE_DIGEST#sha256:}" != "$IMAGE_DIGEST"
          read -r SCAN_STATUS CRITICAL HIGH < <(aws ecr describe-image-scan-findings --region "$AWS_REGION" --repository-name "$RUNTIME_NAME" --image-id imageDigest="$IMAGE_DIGEST" --query '[imageScanStatus.status,to_string(imageScanFindings.findingSeverityCounts.CRITICAL || `0`),to_string(imageScanFindings.findingSeverityCounts.HIGH || `0`)]' --output text)
          test "$SCAN_STATUS" = COMPLETE
          test "$CRITICAL" = 0
          test "$HIGH" = 0
          PROFILE_ARN="$(aws signer get-signing-profile --region "$AWS_REGION" --profile-name "$SIGNING_PROFILE" --query arn --output text)"
          test "$(aws ecr describe-image-signing-status --region "$AWS_REGION" --repository-name "$RUNTIME_NAME" --image-id imageDigest="$IMAGE_DIGEST" --query "signingStatuses[?signingProfileArn=='${PROFILE_ARN}'].status | [0]" --output text)" = COMPLETE
          LB_ARN="$(aws elbv2 describe-load-balancers --region "$AWS_REGION" --names "$RUNTIME_NAME" --query 'LoadBalancers[0].LoadBalancerArn' --output text)"
          LISTENER_ARN="$(aws elbv2 describe-listeners --region "$AWS_REGION" --load-balancer-arn "$LB_ARN" --query 'Listeners[?Port==`443`].ListenerArn | [0]' --output text)"
          CERT_ARN="$(aws elbv2 describe-listener-certificates --region "$AWS_REGION" --listener-arn "$LISTENER_ARN" --query 'Certificates[?IsDefault==`true`].CertificateArn | [0]' --output text)"
          test "$(aws acm describe-certificate --region "$AWS_REGION" --certificate-arn "$CERT_ARN" --query Certificate.Status --output text)" = ISSUED
          SECRET_ARN="$(printf '%s' "$TASK_JSON" | jq -r '.taskDefinition.containerDefinitions[] | select(.name=="runtime") | .secrets[]? | select(.name=="ILAIOS_CONTROL_PLANE_TOKEN") | .valueFrom')"
          aws secretsmanager describe-secret --region "$AWS_REGION" --secret-id "$SECRET_ARN" >/dev/null
          APPROVED_CIDR="$(python -c "import json;print(json.load(open('.github/r03-production-promotion-approval.json'))['retain_ipv4_cidr'])")"
          ALB_SG="$(aws elbv2 describe-load-balancers --region "$AWS_REGION" --load-balancer-arns "$LB_ARN" --query 'LoadBalancers[0].SecurityGroups[0]' --output text)"
          mapfile -t CIDRS < <(aws ec2 describe-security-groups --region "$AWS_REGION" --group-ids "$ALB_SG" --query 'SecurityGroups[0].IpPermissions[?FromPort==`443` && ToPort==`443`].IpRanges[].CidrIp' --output text | tr '\t' '\n' | sed '/^$/d')
          test "${#CIDRS[@]}" -eq 1
          test "${CIDRS[0]}" = "$APPROVED_CIDR"
          TG_ARN="$(aws elbv2 describe-target-groups --region "$AWS_REGION" --names "$RUNTIME_NAME" --query 'TargetGroups[0].TargetGroupArn' --output text)"
          test "$(aws elbv2 describe-target-health --region "$AWS_REGION" --target-group-arn "$TG_ARN" --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' --output text)" -ge 2
          {
            echo "PRIOR_TASKDEF=$TASKDEF"
            echo "PRIOR_DESIRED=$DESIRED"
            echo "IMAGE_DIGEST=$IMAGE_DIGEST"
            echo "CERT_ARN=$CERT_ARN"
            echo "SECRET_ARN=$SECRET_ARN"
            echo "APPROVED_CIDR=$APPROVED_CIDR"
          } >> "$GITHUB_ENV"
          echo 'R03_LIVE_R02_BASELINE_PASS'

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.10.6

      - name: Locate latest serialized release state
        id: prior_state
        run: |
          set -euo pipefail
          DATA="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")"
          RUN_ID="$(printf '%s' "$DATA" | jq -r '[.artifacts[] | select(.expired == false and (.name == "r03-tofu-state" or .name == "r02-tofu-state"))] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')"
          NAME="$(printf '%s' "$DATA" | jq -r '[.artifacts[] | select(.expired == false and (.name == "r03-tofu-state" or .name == "r02-tofu-state"))] | sort_by(.created_at) | reverse | .[0].name // empty')"
          test -n "$RUN_ID"; test -n "$NAME"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.prior_state.outputs.name }}
          path: infra/aws/r01-canary
          github-token: ${{ github.token }}
          run-id: ${{ steps.prior_state.outputs.run_id }}

      - name: Validate and plan exact R03 PRODUCTION mutation
        working-directory: infra/aws/r01-canary
        env:
          TF_VAR_enable_canary: 'true'
          TF_VAR_release_state: PRODUCTION
          TF_VAR_desired_count: '2'
        run: |
          set -euo pipefail
          export TF_VAR_image_digest="$IMAGE_DIGEST"
          export TF_VAR_certificate_arn="$CERT_ARN"
          export TF_VAR_control_plane_secret_arn="$SECRET_ARN"
          export TF_VAR_canary_ipv4_cidrs="[\"$APPROVED_CIDR\"]"
          tofu init -backend=false -input=false
          tofu fmt -check -recursive
          tofu validate
          tofu plan -input=false -out=r03.tfplan
          tofu show -json r03.tfplan > r03-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('r03-plan.json').read_text())
          allowed={'aws_ecs_cluster.canary[0]','aws_ecs_task_definition.runtime[0]','aws_ecs_service.runtime[0]'}
          changed=[]
          for rc in plan.get('resource_changes',[]):
              actions=rc.get('change',{}).get('actions',[])
              if actions==['no-op']: continue
              addr=rc.get('address'); changed.append((addr,actions))
              if addr not in allowed: raise SystemExit(f'Unexpected R03 resource mutation: {addr} {actions}')
              if 'delete' in actions and addr!='aws_ecs_task_definition.runtime[0]': raise SystemExit(f'Destructive R03 mutation rejected: {addr} {actions}')
          if not changed: raise SystemExit('R03 plan contains no production promotion mutation.')
          print('R03_PLAN_BOUNDED_PASS')
          for item in changed: print(item)
          PY

      - name: Apply exact approved R03 PRODUCTION plan
        working-directory: infra/aws/r01-canary
        env:
          TF_VAR_enable_canary: 'true'
          TF_VAR_release_state: PRODUCTION
          TF_VAR_desired_count: '2'
        run: |
          set -euo pipefail
          export TF_VAR_image_digest="$IMAGE_DIGEST"
          export TF_VAR_certificate_arn="$CERT_ARN"
          export TF_VAR_control_plane_secret_arn="$SECRET_ARN"
          export TF_VAR_canary_ipv4_cidrs="[\"$APPROVED_CIDR\"]"
          tofu apply -input=false -auto-approve r03.tfplan

      - name: Verify R03 PRODUCTION health and boundaries
        run: |
          set -euo pipefail
          aws ecs wait services-stable --region "$AWS_REGION" --cluster "$RUNTIME_NAME" --services "$RUNTIME_NAME"
          read -r STATUS DESIRED RUNNING PENDING TASKDEF < <(aws ecs describe-services --region "$AWS_REGION" --cluster "$RUNTIME_NAME" --services "$RUNTIME_NAME" --query 'services[0].[status,to_string(desiredCount),to_string(runningCount),to_string(pendingCount),taskDefinition]' --output text)
          test "$STATUS" = ACTIVE; test "$DESIRED" = 2; test "$RUNNING" = 2; test "$PENDING" = 0
          TASK_JSON="$(aws ecs describe-task-definition --region "$AWS_REGION" --task-definition "$TASKDEF" --output json)"
          test "$(printf '%s' "$TASK_JSON" | jq -r '.taskDefinition.containerDefinitions[] | select(.name=="runtime") | .environment[]? | select(.name=="ILAIOS_RELEASE_STATE") | .value')" = PRODUCTION
          TG_ARN="$(aws elbv2 describe-target-groups --region "$AWS_REGION" --names "$RUNTIME_NAME" --query 'TargetGroups[0].TargetGroupArn' --output text)"
          HEALTHY="$(aws elbv2 describe-target-health --region "$AWS_REGION" --target-group-arn "$TG_ARN" --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' --output text)"
          test "$HEALTHY" -ge 2
          LB_ARN="$(aws elbv2 describe-load-balancers --region "$AWS_REGION" --names "$RUNTIME_NAME" --query 'LoadBalancers[0].LoadBalancerArn' --output text)"
          ALB_SG="$(aws elbv2 describe-load-balancers --region "$AWS_REGION" --load-balancer-arns "$LB_ARN" --query 'LoadBalancers[0].SecurityGroups[0]' --output text)"
          mapfile -t CIDRS < <(aws ec2 describe-security-groups --region "$AWS_REGION" --group-ids "$ALB_SG" --query 'SecurityGroups[0].IpPermissions[?FromPort==`443` && ToPort==`443`].IpRanges[].CidrIp' --output text | tr '\t' '\n' | sed '/^$/d')
          test "${#CIDRS[@]}" -eq 1; test "${CIDRS[0]}" = "$APPROVED_CIDR"
          {
            echo 'milestone_id: RELEASE.R03'
            echo 'package_id: RELEASE.R03.v1'
            echo 'status: PASS'
            echo 'readiness: COMPLETE'
            echo 'release_state: PRODUCTION_DEPLOYED_HEALTHY'
            echo 'deployment_performed: true'
            echo "aws_account: \"$AWS_ACCOUNT_ID\""
            echo "aws_region: $AWS_REGION"
            echo "production_ipv4_cidr: $APPROVED_CIDR"
            echo 'production_desired_count: 2'
            echo 'production_running_count: 2'
            echo 'production_pending_count: 0'
            echo "immutable_image_digest: $IMAGE_DIGEST"
            echo "ecs_task_definition: $TASKDEF"
            echo "healthy_targets: $HEALTHY"
            echo 'network_exposure_broadened: false'
            echo "rollback_task_definition: $PRIOR_TASKDEF"
            echo "rollback_desired_count: $PRIOR_DESIRED"
            echo 'rollback_available: true'
            echo 'rollback_executed: false'
          } | tee /tmp/r03-decision.yaml
          echo 'R03_PRODUCTION_DEPLOYMENT_PASS'

      - name: Roll back to R02 on failed R03 apply or verification
        if: failure() && env.PRIOR_TASKDEF != ''
        run: |
          set -euo pipefail
          aws ecs update-service --region "$AWS_REGION" --cluster "$RUNTIME_NAME" --service "$RUNTIME_NAME" --task-definition "$PRIOR_TASKDEF" --desired-count "$PRIOR_DESIRED" >/dev/null
          aws ecs wait services-stable --region "$AWS_REGION" --cluster "$RUNTIME_NAME" --services "$RUNTIME_NAME"
          read -r D R P T < <(aws ecs describe-services --region "$AWS_REGION" --cluster "$RUNTIME_NAME" --services "$RUNTIME_NAME" --query 'services[0].[to_string(desiredCount),to_string(runningCount),to_string(pendingCount),taskDefinition]' --output text)
          test "$D" = "$PRIOR_DESIRED"; test "$R" = "$PRIOR_DESIRED"; test "$P" = 0; test "$T" = "$PRIOR_TASKDEF"
          echo 'R03_ROLLBACK_TO_R02_PASS'

      - name: Preserve serialized R03 OpenTofu state
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r03-tofu-state
          path: infra/aws/r01-canary/terraform.tfstate
          if-no-files-found: error
          retention-days: 30

      - name: Preserve R03 deployment evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r03-deployment-evidence
          path: /tmp/r03-decision.yaml
          if-no-files-found: error
          retention-days: 30
