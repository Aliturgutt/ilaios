name: Website CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Diff hygiene
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/master; then
            git diff --check "$(git merge-base origin/master HEAD)" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install website dependencies
        working-directory: apps/website
        run: npm ci --ignore-scripts --audit=false --fund=false

      - name: Install locked native design test runner
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/website-ci.txt
          python -m pip check

      - name: Site policy, metadata, density and competitor design benchmark
        working-directory: apps/website
        run: npm run test:quality

      - name: Lint
        working-directory: apps/website
        run: npm run lint

      - name: Typecheck
        working-directory: apps/website
        run: npm run typecheck

      - name: Production build
        working-directory: apps/website
        run: npm run build

      - name: Native design quality and Web Factory acceptance
        run: python -m pytest -q tests/test_design_quality.py tests/test_web_factory.py
