name: Website CI

on:
  workflow_call:
  push:
    branches: [master]
    paths:
      - "apps/website/**"
      - "tools/design-intelligence/**"
      - "services/design_quality.py"
      - "services/integrations/web_factory.py"
      - "tests/test_design_quality.py"
      - "tests/test_web_factory.py"
      - ".github/workflows/website-ci.yml"
      - ".github/workflows/required-ci-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff hygiene
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/master; then
            git diff --check "$(git merge-base origin/master HEAD)" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install website dependencies
        working-directory: apps/website
        run: npm ci --ignore-scripts --audit=false --fund=false

      - name: Install native design test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Site policy and metadata checks
        working-directory: apps/website
        run: npm run test:site

      - name: Lint
        working-directory: apps/website
        run: npm run lint

      - name: Typecheck
        working-directory: apps/website
        run: npm run typecheck

      - name: Production build
        working-directory: apps/website
        run: npm run build

      - name: Native design quality and Web Factory acceptance
        run: python -m pytest -q tests/test_design_quality.py tests/test_web_factory.py
