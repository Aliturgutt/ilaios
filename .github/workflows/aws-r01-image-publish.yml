name: AWS R01 image publish

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aws-r01-image-publish.yml'
      - 'infra/aws/r01-canary/Dockerfile.runtime'
      - 'services/deployment/runtime.py'
      - 'services/control_plane/**'
      - 'services/**'
      - 'src/**'
      - 'packages/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-r01-image-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "101180464425"

      - name: Resolve and build minimal R01 runtime image
        id: build
        env:
          BASE_IMAGE: python:3.12.13-alpine3.22
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$BASE_IMAGE"
          BASE_RESOLVED="$(docker image inspect "$BASE_IMAGE" --format '{{index .RepoDigests 0}}')"
          test -n "$BASE_RESOLVED"
          echo "BASE_IMAGE_RESOLVED=$BASE_RESOLVED"
          echo "base_resolved=$BASE_RESOLVED" >> "$GITHUB_OUTPUT"
          docker build \
            --platform linux/amd64 \
            --pull \
            --file infra/aws/r01-canary/Dockerfile.runtime \
            --tag ilaios-r01-runtime:${GITHUB_SHA} \
            .

      - name: Smoke-test container runtime before publish
        run: |
          set -euo pipefail
          CID="$(docker run -d \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --tmpfs /var/lib/ilaios:rw,noexec,nosuid,size=128m \
            -e ILAIOS_CONTROL_PLANE_TOKEN=r01-ci-smoke-token \
            -e ILAIOS_STATE_ROOT=/var/lib/ilaios \
            -e ILAIOS_READY_FILE=/tmp/ready.json \
            -e ILAIOS_HOST=0.0.0.0 \
            -e ILAIOS_PORT=8080 \
            -p 127.0.0.1:18081:8080 \
            ilaios-r01-runtime:${GITHUB_SHA})"
          cleanup() {
            docker logs "$CID" || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if ! docker inspect "$CID" --format '{{.State.Running}}' | grep -Fxq true; then
              echo 'R01 container exited during smoke test.'
              exit 1
            fi
            if curl --fail --silent --show-error \
              -H 'Authorization: Bearer r01-ci-smoke-token' \
              http://127.0.0.1:18081/health/live >/tmp/live.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            -H 'Authorization: Bearer r01-ci-smoke-token' \
            http://127.0.0.1:18081/health/live | tee /tmp/live.json
          curl --fail --silent --show-error \
            -H 'Authorization: Bearer r01-ci-smoke-token' \
            http://127.0.0.1:18081/health/ready | tee /tmp/ready.json
          python - <<'PY'
          import json
          from pathlib import Path
          live = json.loads(Path('/tmp/live.json').read_text())
          ready = json.loads(Path('/tmp/ready.json').read_text())
          if live.get('status') != 'live':
              raise SystemExit(f'unexpected live response: {live}')
          if ready.get('status') != 'ready':
              raise SystemExit(f'unexpected ready response: {ready}')
          print('R01_CONTAINER_SMOKE_PASS')
          PY

      - name: Push immutable image to ECR
        id: push
        env:
          REGISTRY: 101180464425.dkr.ecr.eu-central-1.amazonaws.com
          REPOSITORY: ilaios-r01-canary
        run: |
          set -euo pipefail
          TAG="r01-${GITHUB_SHA}"
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag "ilaios-r01-runtime:${GITHUB_SHA}" "${REGISTRY}/${REPOSITORY}:${TAG}"
          docker push "${REGISTRY}/${REPOSITORY}:${TAG}"
          DIGEST="$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --region eu-central-1 \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test "${DIGEST#sha256:}" != "$DIGEST"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ECR_IMAGE=${REGISTRY}/${REPOSITORY}@${DIGEST}"
          echo "ECR_TAG=${TAG}"
          echo "ECR_DIGEST=${DIGEST}"

      - name: Wait for ECR scan and enforce zero critical/high gate
        env:
          REPOSITORY: ilaios-r01-canary
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            set +e
            SCAN_OUTPUT="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPOSITORY" \
              --image-id imageDigest="$DIGEST" \
              --region eu-central-1 \
              --query '{status:imageScanStatus.status,description:imageScanStatus.description,severity:imageScanFindings.findingSeverityCounts}' \
              --output json 2>&1)"
            SCAN_RC=$?
            set -e
            if [ "$SCAN_RC" -ne 0 ]; then
              echo "ECR_SCAN_QUERY_RESULT=$SCAN_OUTPUT"
              if grep -q 'ScanNotFoundException' <<<"$SCAN_OUTPUT"; then
                sleep 10
                continue
              fi
              exit "$SCAN_RC"
            fi
            STATUS="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status") or "")' <<<"$SCAN_OUTPUT")"
            case "$STATUS" in
              COMPLETE)
                echo "$SCAN_OUTPUT"
                read -r CRITICAL HIGH < <(python -c 'import json,sys; d=json.load(sys.stdin); s=d.get("severity") or {}; print(int(s.get("CRITICAL",0)), int(s.get("HIGH",0)))' <<<"$SCAN_OUTPUT")
                echo "ECR_CRITICAL_FINDINGS=$CRITICAL"
                echo "ECR_HIGH_FINDINGS=$HIGH"
                if [ "$CRITICAL" -ne 0 ] || [ "$HIGH" -ne 0 ]; then
                  aws ecr describe-image-scan-findings \
                    --repository-name "$REPOSITORY" \
                    --image-id imageDigest="$DIGEST" \
                    --region eu-central-1 \
                    --max-results 100 \
                    --query 'imageScanFindings.findings[?severity==`CRITICAL` || severity==`HIGH`].[severity,name,description,uri,attributes]' \
                    --output json
                  echo 'ECR vulnerability gate failed: CRITICAL and HIGH findings must both be zero.'
                  exit 1
                fi
                echo 'R01_ECR_SECURITY_GATE_PASS'
                exit 0
                ;;
              FAILED|UNSUPPORTED_IMAGE)
                echo "$SCAN_OUTPUT"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo 'ECR scan did not complete within 10 minutes.'
          exit 1
