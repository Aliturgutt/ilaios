name: AWS R01 image publish

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aws-r01-image-publish.yml'
      - 'services/deployment/runtime.py'
      - 'services/deployment/oci.py'
      - 'services/control_plane/**'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "101180464425"

      - name: Build canonical OCI layout
        id: build
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from services.deployment import build_oci_layout
          result = build_oci_layout(Path.cwd(), Path('/tmp/ilaios-r01-oci'))
          with open('/tmp/oci-result.txt', 'w', encoding='utf-8') as f:
              f.write(f'index_sha256={result.index_digest}\n')
              f.write(f'manifest_sha256={result.manifest_digest}\n')
              f.write(f'config_sha256={result.config_digest}\n')
              f.write(f'layer_sha256={result.layer_digest}\n')
          print(Path('/tmp/oci-result.txt').read_text())
          PY

      - name: Install Skopeo
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Push immutable OCI image to ECR
        id: push
        env:
          REGISTRY: 101180464425.dkr.ecr.eu-central-1.amazonaws.com
          REPOSITORY: ilaios-r01-canary
        run: |
          set -euo pipefail
          TAG="r01-${GITHUB_SHA}"
          aws ecr get-login-password --region eu-central-1 | skopeo login --username AWS --password-stdin "$REGISTRY"
          skopeo copy --preserve-digests "oci:/tmp/ilaios-r01-oci:ilaios:recovery" "docker://${REGISTRY}/${REPOSITORY}:${TAG}"
          DIGEST="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" --region eu-central-1 --query 'imageDetails[0].imageDigest' --output text)"
          test "${DIGEST#sha256:}" != "$DIGEST"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ECR_IMAGE=${REGISTRY}/${REPOSITORY}@${DIGEST}"
          echo "ECR_TAG=${TAG}"
          echo "ECR_DIGEST=${DIGEST}"

      - name: Start and wait for ECR scan result
        env:
          REPOSITORY: ilaios-r01-canary
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          SCAN_ON_PUSH="$(aws ecr describe-repositories \
            --repository-names "$REPOSITORY" \
            --region eu-central-1 \
            --query 'repositories[0].imageScanningConfiguration.scanOnPush' \
            --output text)"
          echo "ECR_SCAN_ON_PUSH=$SCAN_ON_PUSH"

          set +e
          START_OUTPUT="$(aws ecr start-image-scan \
            --repository-name "$REPOSITORY" \
            --image-id imageDigest="$DIGEST" \
            --region eu-central-1 2>&1)"
          START_RC=$?
          set -e
          if [ "$START_RC" -ne 0 ]; then
            echo "ECR_START_SCAN_RESULT=$START_OUTPUT"
            if ! grep -q 'LimitExceededException' <<<"$START_OUTPUT"; then
              exit "$START_RC"
            fi
          fi

          for i in $(seq 1 60); do
            set +e
            SCAN_OUTPUT="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPOSITORY" \
              --image-id imageDigest="$DIGEST" \
              --region eu-central-1 \
              --query '{status:imageScanStatus.status,description:imageScanStatus.description,severity:imageScanFindings.findingSeverityCounts}' \
              --output json 2>&1)"
            SCAN_RC=$?
            set -e

            if [ "$SCAN_RC" -ne 0 ]; then
              echo "ECR_SCAN_QUERY_RESULT=$SCAN_OUTPUT"
              if grep -q 'ScanNotFoundException' <<<"$SCAN_OUTPUT"; then
                sleep 10
                continue
              fi
              exit "$SCAN_RC"
            fi

            STATUS="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status") or "")' <<<"$SCAN_OUTPUT")"
            case "$STATUS" in
              COMPLETE)
                echo "$SCAN_OUTPUT"
                read -r CRITICAL HIGH < <(python -c 'import json,sys; d=json.load(sys.stdin); s=d.get("severity") or {}; print(int(s.get("CRITICAL",0)), int(s.get("HIGH",0)))' <<<"$SCAN_OUTPUT")
                echo "ECR_CRITICAL_FINDINGS=$CRITICAL"
                echo "ECR_HIGH_FINDINGS=$HIGH"
                if [ "$CRITICAL" -ne 0 ] || [ "$HIGH" -ne 0 ]; then
                  aws ecr describe-image-scan-findings \
                    --repository-name "$REPOSITORY" \
                    --image-id imageDigest="$DIGEST" \
                    --region eu-central-1 \
                    --max-results 100 \
                    --output json > /tmp/ecr-findings.json
                  python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/ecr-findings.json').read_text())
          findings = data.get('imageScanFindings', {}).get('findings', [])
          for finding in findings:
              if finding.get('severity') not in {'CRITICAL', 'HIGH'}:
                  continue
              attrs = {
                  item.get('key'): item.get('value')
                  for item in finding.get('attributes', [])
              }
              print(
                  'ECR_FINDING '
                  f"severity={finding.get('severity')} "
                  f"name={finding.get('name')} "
                  f"package={attrs.get('package_name')} "
                  f"version={attrs.get('package_version')} "
                  f"fixed={attrs.get('package_version')} "
                  f"uri={finding.get('uri')}"
              )
          PY
                  echo 'ECR vulnerability gate failed: CRITICAL and HIGH findings must both be zero.'
                  exit 1
                fi
                exit 0
                ;;
              FAILED|UNSUPPORTED_IMAGE)
                echo "$SCAN_OUTPUT"
                exit 1
                ;;
            esac
            sleep 10
          done

          echo 'ECR scan did not complete within 10 minutes.'
          exit 1
