name: AWS R01 image publish

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit SHA to build and publish
        required: true
        type: string
      confirm_external_mutation:
        description: Confirm this run may write a new immutable image/signing state to AWS ECR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-r01-image-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm_external_mutation == true }}
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate exact source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source_sha must be an exact lowercase 40-character Git commit SHA.'
            exit 1
          }

      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "101180464425"

      - name: Ensure ECR managed signing configuration
        id: signing
        env:
          REPOSITORY: ilaios-r01-canary
          PROFILE: ILAIOS_R01_ECR
        run: |
          set -euo pipefail
          if ! aws signer get-signing-profile --profile-name "$PROFILE" --region eu-central-1 >/dev/null 2>&1; then
            aws signer put-signing-profile --profile-name "$PROFILE" --platform-id Notation-OCI-SHA384-ECDSA --region eu-central-1 >/dev/null
          fi
          PROFILE_ARN="$(aws signer get-signing-profile --profile-name "$PROFILE" --region eu-central-1 --query 'arn' --output text)"
          test -n "$PROFILE_ARN"
          cat > /tmp/signing.json <<JSON
          {
            "rules": [
              {
                "signingProfileArn": "$PROFILE_ARN",
                "repositoryFilters": [
                  {"filter": "$REPOSITORY", "filterType": "WILDCARD_MATCH"}
                ]
              }
            ]
          }
          JSON
          aws ecr put-signing-configuration --signing-configuration file:///tmp/signing.json --region eu-central-1 >/dev/null
          CONFIGURED_ARN="$(aws ecr get-signing-configuration --region eu-central-1 --query 'signingConfiguration.rules[0].signingProfileArn' --output text)"
          test "$CONFIGURED_ARN" = "$PROFILE_ARN"
          echo "profile_arn=$PROFILE_ARN" >> "$GITHUB_OUTPUT"
          echo "R01_MANAGED_SIGNING_CONFIGURATION_PASS"

      - name: Resolve and build minimal R01 runtime image
        id: build
        env:
          BASE_IMAGE: docker.io/library/python@sha256:a190708a2dec1bd18b1decb539f8e8f5407abaa9bf39cacda583f7f8c11db322
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$BASE_IMAGE"
          BASE_RESOLVED="$(docker image inspect "$BASE_IMAGE" --format '{{index .RepoDigests 0}}')"
          test -n "$BASE_RESOLVED"
          echo "BASE_IMAGE_RESOLVED=$BASE_RESOLVED"
          echo "base_resolved=$BASE_RESOLVED" >> "$GITHUB_OUTPUT"
          docker build \
            --platform linux/amd64 \
            --pull \
            --file infra/aws/r01-canary/Dockerfile.runtime \
            --tag ilaios-r01-runtime:${SOURCE_SHA} \
            .

      - name: Smoke-test container runtime before publish
        run: |
          set -euo pipefail
          CID="$(docker run -d \
            --user 1000:1000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,uid=1000,gid=1000,size=32m \
            --tmpfs /var/lib/ilaios:rw,noexec,nosuid,uid=1000,gid=1000,size=128m \
            -e ILAIOS_CONTROL_PLANE_TOKEN=r01-ci-smoke-token \
            -e ILAIOS_STATE_ROOT=/var/lib/ilaios \
            -e ILAIOS_READY_FILE=/tmp/ready.json \
            -e ILAIOS_HOST=0.0.0.0 \
            -e ILAIOS_PORT=8080 \
            -p 127.0.0.1:18081:8080 \
            ilaios-r01-runtime:${SOURCE_SHA})"
          cleanup() {
            docker logs "$CID" || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if ! docker inspect "$CID" --format '{{.State.Running}}' | grep -Fxq true; then
              echo 'R01 container exited during smoke test.'
              exit 1
            fi
            if curl --fail --silent --show-error \
              -H 'Authorization: Bearer r01-ci-smoke-token' \
              http://127.0.0.1:18081/health/live >/tmp/live.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            -H 'Authorization: Bearer r01-ci-smoke-token' \
            http://127.0.0.1:18081/health/live | tee /tmp/live.json
          curl --fail --silent --show-error \
            -H 'Authorization: Bearer r01-ci-smoke-token' \
            http://127.0.0.1:18081/health/ready | tee /tmp/ready.json
          python - <<'PY'
          import json
          from pathlib import Path
          live = json.loads(Path('/tmp/live.json').read_text())
          ready = json.loads(Path('/tmp/ready.json').read_text())
          if live.get('status') != 'live':
              raise SystemExit(f'unexpected live response: {live}')
          if ready.get('status') != 'ready':
              raise SystemExit(f'unexpected ready response: {ready}')
          print('R01_CONTAINER_SMOKE_PASS')
          PY

      - name: Push immutable image to ECR
        id: push
        env:
          REGISTRY: 101180464425.dkr.ecr.eu-central-1.amazonaws.com
          REPOSITORY: ilaios-r01-canary
        run: |
          set -euo pipefail
          TAG="r01-${SOURCE_SHA}"
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag "ilaios-r01-runtime:${SOURCE_SHA}" "${REGISTRY}/${REPOSITORY}:${TAG}"
          docker push "${REGISTRY}/${REPOSITORY}:${TAG}"
          DIGEST="$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --region eu-central-1 \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test "${DIGEST#sha256:}" != "$DIGEST"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ECR_IMAGE=${REGISTRY}/${REPOSITORY}@${DIGEST}"
          echo "ECR_TAG=${TAG}"
          echo "ECR_DIGEST=${DIGEST}"

      - name: Wait for ECR scan and enforce zero critical/high gate
        env:
          REPOSITORY: ilaios-r01-canary
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            set +e
            SCAN_OUTPUT="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPOSITORY" \
              --image-id imageDigest="$DIGEST" \
              --region eu-central-1 \
              --query '{status:imageScanStatus.status,description:imageScanStatus.description,severity:imageScanFindings.findingSeverityCounts}' \
              --output json 2>&1)"
            SCAN_RC=$?
            set -e
            if [ "$SCAN_RC" -ne 0 ]; then
              echo "ECR_SCAN_QUERY_RESULT=$SCAN_OUTPUT"
              if grep -q 'ScanNotFoundException' <<<"$SCAN_OUTPUT"; then
                sleep 10
                continue
              fi
              exit "$SCAN_RC"
            fi
            STATUS="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status") or "")' <<<"$SCAN_OUTPUT")"
            case "$STATUS" in
              COMPLETE)
                echo "$SCAN_OUTPUT"
                read -r CRITICAL HIGH < <(python -c 'import json,sys; d=json.load(sys.stdin); s=d.get("severity") or {}; print(int(s.get("CRITICAL",0)), int(s.get("HIGH",0)))' <<<"$SCAN_OUTPUT")
                echo "ECR_CRITICAL_FINDINGS=$CRITICAL"
                echo "ECR_HIGH_FINDINGS=$HIGH"
                if [ "$CRITICAL" -ne 0 ] || [ "$HIGH" -ne 0 ]; then
                  aws ecr describe-image-scan-findings \
                    --repository-name "$REPOSITORY" \
                    --image-id imageDigest="$DIGEST" \
                    --region eu-central-1 \
                    --max-results 100 \
                    --query 'imageScanFindings.findings[?severity==`CRITICAL` || severity==`HIGH`].[severity,name,description,uri,attributes]' \
                    --output json
                  echo 'ECR vulnerability gate failed: CRITICAL and HIGH findings must both be zero.'
                  exit 1
                fi
                echo 'R01_ECR_SECURITY_GATE_PASS'
                break
                ;;
              FAILED|UNSUPPORTED_IMAGE)
                echo "$SCAN_OUTPUT"
                exit 1
                ;;
            esac
            sleep 10
          done
          test "$STATUS" = COMPLETE

      - name: Verify ECR managed signature
        env:
          REPOSITORY: ilaios-r01-canary
          TAG: ${{ steps.push.outputs.tag }}
          PROFILE_ARN: ${{ steps.signing.outputs.profile_arn }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            aws ecr describe-image-signing-status \
              --repository-name "$REPOSITORY" \
              --image-id imageTag="$TAG" \
              --region eu-central-1 \
              --output json > /tmp/signing-status.json
            read -r STATUS FAILURE_CODE < <(python - "$PROFILE_ARN" <<'PY'
          import json
          import sys
          from pathlib import Path
          profile = sys.argv[1]
          payload = json.loads(Path('/tmp/signing-status.json').read_text())
          matches = [s for s in payload.get('signingStatuses', []) if s.get('signingProfileArn') == profile]
          if not matches:
              print('PENDING -')
          else:
              item = matches[0]
              print(item.get('status', 'PENDING'), item.get('failureCode', '-'))
          PY
            )
            echo "IMAGE_SIGNING_STATUS=$STATUS"
            case "$STATUS" in
              COMPLETE)
                echo 'R01_ECR_MANAGED_SIGNING_PASS'
                exit 0
                ;;
              FAILED)
                python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/signing-status.json').read_text())
          for item in payload.get('signingStatuses', []):
              if item.get('status') == 'FAILED':
                  print('SIGNING_FAILURE_CODE=' + str(item.get('failureCode', 'unknown')))
                  print('SIGNING_FAILURE_REASON=' + str(item.get('failureReason', 'unknown')))
          PY
                exit 1
                ;;
              IN_PROGRESS|PENDING)
                ;;
              *)
                cat /tmp/signing-status.json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'Managed signing did not complete within bounded wait window.'
          cat /tmp/signing-status.json
          exit 1
