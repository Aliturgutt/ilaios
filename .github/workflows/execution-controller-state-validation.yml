name: ILAIOS Execution Controller State Validation

on:
  pull_request:
    paths:
      - ".github/automation/state-template.json"
      - ".github/automation/states/**"
      - ".github/automation/ILAIOS_EXECUTION_CONTROLLER_PROTOCOL.md"
      - "scripts/validate_execution_controller_state.py"
      - ".github/workflows/execution-controller-state-validation.yml"
  push:
    branches:
      - master
    paths:
      - ".github/automation/state-template.json"
      - ".github/automation/states/**"
      - "scripts/validate_execution_controller_state.py"
      - ".github/workflows/execution-controller-state-validation.yml"

permissions:
  contents: read

jobs:
  validate-controller-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate canonical template
        run: python scripts/validate_execution_controller_state.py .github/automation/state-template.json
      - name: Validate task state files
        shell: bash
        run: |
          shopt -s nullglob
          files=(.github/automation/states/*.json)
          if (( ${#files[@]} )); then
            python scripts/validate_execution_controller_state.py "${files[@]}"
          else
            echo "No task-specific execution-controller state files yet."
          fi
