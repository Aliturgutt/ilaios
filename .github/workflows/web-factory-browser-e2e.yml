name: Web Factory Browser E2E

on:
  pull_request:
    branches: [master]
    paths:
      - 'services/execution_adapters.py'
      - 'services/execution_coordinator.py'
      - 'services/design_quality.py'
      - 'services/web_factory_skills.py'
      - 'services/web_3d_integration.py'
      - 'services/web_3d_runtime.py'
      - 'tools/web-factory/skills/**'
      - 'tests/test_web_factory_native_skills.py'
      - 'tests/test_design_quality.py'
      - 'tests/test_web_motion_runtime.py'
      - 'tests/test_web_3d_factory_wiring.py'
      - 'tests/test_web_3d_integration.py'
      - 'tests/test_web_3d_runtime.py'
      - 'services/integrations/web_factory.py'
      - 'services/integrations/web_product_runtime.py'
      - 'services/integrations/web_product_runtime_recovery.py'
      - 'services/integrations/web_project.py'
      - 'services/integrations/web_assurance.py'
      - 'services/integrations/web_delivery.py'
      - 'services/integrations/web_vercel_delivery.py'
      - 'tests/test_web_assurance_delivery.py'
      - 'tests/test_web_vercel_delivery.py'
      - 'apps/desktop/e2e/web_finished_product_browser_e2e.py'
      - 'apps/desktop/e2e/web_3d_generated_site_browser_e2e.py'
      - '.github/workflows/web-factory-browser-e2e.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-factory-browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Coordinator Web certified Next.js + Chromium runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked platform runtime and pinned browser
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m pip check
          python -m playwright install --with-deps chromium

      - name: Run Web assurance, delivery and rollback unit/integration closure
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_web_factory_native_skills.py \
            tests/test_design_quality.py \
            tests/test_web_motion_runtime.py \
            tests/test_web_3d_factory_wiring.py \
            tests/test_web_3d_integration.py \
            tests/test_web_3d_runtime.py \
            tests/test_web_assurance_delivery.py \
            tests/test_web_vercel_delivery.py

      - name: Run Web finished-product E2E through Coordinator, Next.js and Chromium
        env:
          PYTHONPATH: ${{ github.workspace }}
          ILAIOS_WEB_E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/web-local-finished-product
        run: python apps/desktop/e2e/web_finished_product_browser_e2e.py

      - name: Run generated-site 3D runtime E2E in Chromium
        env:
          PYTHONPATH: ${{ github.workspace }}
          ILAIOS_WEB_3D_E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/web-local-3d-generated-site
        run: python apps/desktop/e2e/web_3d_generated_site_browser_e2e.py

      - name: Upload exact Web finished-product browser evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-local-finished-product-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: artifacts/web-local-finished-product
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact generated-site 3D browser evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-local-3d-generated-site-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: artifacts/web-local-3d-generated-site
          if-no-files-found: error
          retention-days: 30
