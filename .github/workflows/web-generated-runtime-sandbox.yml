name: Web Generated Runtime Sandbox Gate

on:
  pull_request:
    branches:
      - master
    paths:
      - 'services/runtime/generated_app_docker_boundary.py'
      - 'tests/test_generated_app_docker_boundary.py'
      - '.github/workflows/web-generated-runtime-sandbox.yml'
  push:
    branches:
      - master
    paths:
      - 'services/runtime/generated_app_docker_boundary.py'
      - 'tests/test_generated_app_docker_boundary.py'
      - '.github/workflows/web-generated-runtime-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-generated-runtime-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-boundary:
    name: generated runtime isolation contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "WEB_GENERATED_SANDBOX_EXACT_HEAD=$SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Run generated sandbox regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_generated_app_docker_boundary.py

      - name: Run Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            services/runtime/generated_app_docker_boundary.py \
            tests/test_generated_app_docker_boundary.py

      - name: Run strict Mypy
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy --strict \
            services/runtime/generated_app_docker_boundary.py \
            tests/test_generated_app_docker_boundary.py

      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '## ILAIOS Generated Runtime Sandbox Gate' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact head: \`${SOURCE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Canonical boundary: `SecureCommandBoundary` implementation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Direct network: denied' >> "$GITHUB_STEP_SUMMARY"
          echo '- Secret inheritance: denied' >> "$GITHUB_STEP_SUMMARY"
          echo '- Host shell / Docker socket: not mounted' >> "$GITHUB_STEP_SUMMARY"
          echo '- Container root: read-only; capabilities dropped; no-new-privileges' >> "$GITHUB_STEP_SUMMARY"
          echo '- Resource/time limits: bounded' >> "$GITHUB_STEP_SUMMARY"
          echo '- Truth: source/test evidence only; production runtime execution remains separately required.' >> "$GITHUB_STEP_SUMMARY"
