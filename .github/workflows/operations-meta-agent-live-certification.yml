name: ILAIOS Operations Meta Agent Live Certification
# Exact-master recertification trigger; no runtime, governance, verifier, or provider authority change.
# Re-certify on exact master through evidence-visible trusted-master lineage.
# Co-certify Operations/Meta and Desktop package evidence on one exact master revision.
# Co-certify exact-master closure on the eventual Desktop evidence merge SHA.
# Unified Web + Operations/Meta + Desktop exact-master closure co-certification trigger.
# Final same-SHA Agent and Desktop recertification trigger; no behavior change.
# Exact-current d2d9eb32 Operations/Meta recertification trigger; no behavior change.

on:
  push:
    branches:
      - master
    paths:
      - 'services/operations_meta_agent_execution.py'
      - 'services/operations_meta_agent_live_certification.py'
      - 'tests/test_operations_meta_agent_live_certification.py'
      - '.github/workflows/operations-meta-agent-live-certification.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: operations-meta-agent-live-certification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  certify:
    name: Trusted master Operations 6 + Meta 2 bounded certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    env:
      SOURCE_SHA: ${{ github.sha }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout exact trusted master SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert trusted master source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git switch -c ilaios-operations-meta-cert-ci
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Run Operations Meta certification regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_operations_meta_agent_execution.py \
            tests/test_operations_meta_provider_boundary.py \
            tests/test_operations_meta_agent_live_certification.py

      - name: Run Operations Meta certification static quality
        run: |
          python -m ruff check \
            services/operations_meta_agent_execution.py \
            services/operations_meta_agent_live_certification.py \
            tests/test_operations_meta_agent_live_certification.py
          python -m mypy --strict \
            services/operations_meta_agent_execution.py \
            services/operations_meta_agent_live_certification.py \
            tests/test_operations_meta_agent_live_certification.py

      - name: Execute seven governed zero-cost proposal agents and IndependentVerifier checks
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
          OPERATIONS_META_AGENT_PROOF_DIR: ${{ github.workspace }}/artifacts/operations-meta-agent-live-proof
        run: python -m services.operations_meta_agent_live_certification

      - name: Validate immutable bounded receipt
        env:
          RECEIPT: ${{ github.workspace }}/artifacts/operations-meta-agent-live-proof/operations-meta-agent-live-receipt.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["RECEIPT"]).read_text(encoding="utf-8"))
          if receipt.get("revision_sha") != os.environ["SOURCE_SHA"]:
              raise SystemExit("Operations/Meta receipt SHA drifted")
          if receipt.get("status") != "PARTIAL":
              raise SystemExit("Operations/Meta receipt must remain PARTIAL until human-owner verification")
          if receipt.get("target_agent_count") != 8 or receipt.get("verified_agent_count") != 7:
              raise SystemExit("Operations/Meta automated proof population drifted")
          if receipt.get("governed_ai_agent_count") != 7:
              raise SystemExit("Operations/Meta governed-AI count drifted")
          if receipt.get("governed_ai_zero_cost_openrouter_only") is not True:
              raise SystemExit("Operations/Meta zero-cost provider proof failed")
          if receipt.get("independent_verifier_provider_backed") is not False:
              raise SystemExit("IndependentVerifier was mislabeled as provider-backed")
          if receipt.get("independent_verifier_verifier_id") != "human.owner":
              raise SystemExit("IndependentVerifier human-owner authority drifted")
          if receipt.get("human_owner_verification_required") is not True:
              raise SystemExit("IndependentVerifier human-owner blocker disappeared")
          if receipt.get("overall_8_of_8_verified") is not False:
              raise SystemExit("Operations/Meta receipt overclaimed 8/8 verification")
          agents = receipt.get("agents")
          if not isinstance(agents, list) or len(agents) != 7:
              raise SystemExit("Operations/Meta provider receipt population drifted")
          if any(item.get("actual_cost_usd") != "0" for item in agents):
              raise SystemExit("Operations/Meta provider receipt observed non-zero cost")
          print("ILAIOS_OPERATIONS_META_AGENT_LIVE_CERTIFICATION=BOUNDED_PASS_7_OF_8")
          PY

      - name: Upload immutable Operations Meta certification evidence
        id: upload_live_artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ilaios-operations-meta-agent-live-proof-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/operations-meta-agent-live-proof
          if-no-files-found: error
          retention-days: 90

      - name: Publish Operations Meta exact-master status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && format('run {0} bounded PASS 7/8', github.run_id) || format('run {0} certification failed', github.run_id) }}
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "ilaios/operations-meta-agent-live-certification",
              "description": os.environ["DESCRIPTION"],
              "target_url": f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$CURRENT_SHA" \
            -d "$payload" >/dev/null

      - name: Publish Operations Meta evidence checkpoint to issue 557
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload_live_artifact.outputs.artifact-id }}
          ARTIFACT_NAME: ilaios-operations-meta-agent-live-proof-${{ github.sha }}-${{ github.run_id }}
          RECEIPT: ${{ github.workspace }}/artifacts/operations-meta-agent-live-proof/operations-meta-agent-live-receipt.json
        run: |
          set -euo pipefail
          body=$(python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          lines = [
              "Operations/Meta exact-master certification checkpoint",
              "",
              f"- source SHA: `{os.environ['CURRENT_SHA']}`",
              f"- workflow run: `{os.environ['RUN_ID']}` ({os.environ['RUN_URL']})",
              f"- job status: `{os.environ['JOB_STATUS']}`",
          ]
          if os.environ["JOB_STATUS"] == "success":
              artifact_id = os.environ.get("ARTIFACT_ID", "")
              if not artifact_id:
                  raise SystemExit("successful Operations/Meta upload did not expose artifact ID")
              receipt_path = Path(os.environ["RECEIPT"])
              receipt_bytes = receipt_path.read_bytes()
              receipt = json.loads(receipt_bytes)
              lines += [
                  f"- artifact ID: `{artifact_id}`",
                  f"- artifact name: `{os.environ['ARTIFACT_NAME']}`",
                  f"- receipt SHA256: `{hashlib.sha256(receipt_bytes).hexdigest()}`",
                  f"- automated verified agents: `{receipt['verified_agent_count']}/{receipt['target_agent_count']}`",
                  f"- status: `{receipt['status']}`",
                  f"- IndependentVerifier verifier: `{receipt['independent_verifier_verifier_id']}`",
                  f"- human owner verification required: `{str(receipt['human_owner_verification_required']).lower()}`",
                  "- automated Operations/Meta evidence: VERIFIED 7/8; 8/8 is not claimed",
              ]
          else:
              lines.append("- artifact: not accepted; inspect exact workflow failure before any retry")
          print("\n".join(lines))
          PY
          )
          payload=$(python -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' <<<"$body")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/issues/557/comments" \
            -d "$payload" >/dev/null
