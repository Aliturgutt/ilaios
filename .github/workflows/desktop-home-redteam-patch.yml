name: Desktop Home Red-Team Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-home-truth:
    if: github.head_ref == 'desktop/home-motion-truth-86b7c195'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop/home-motion-truth-86b7c195
          fetch-depth: 0

      - name: Apply exact fail-closed telemetry patches
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/desktop/lib/features/dashboard/reference_home_dashboard_v3.dart')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "if (value < 0 || value > 100) return null;",
                  "if (!value.isFinite || value < 0 || value > 100) return null;",
              ),
              (
                  """    final progress = rawProgress == null
        ? null
        : ((rawProgress <= 1 ? rawProgress : rawProgress / 100).clamp(0.0, 1.0));
""",
                  """    final progress = rawProgress == null || !rawProgress.isFinite
        ? null
        : rawProgress >= 0 && rawProgress <= 1
            ? rawProgress
            : rawProgress > 1 && rawProgress <= 100
                ? rawProgress / 100
                : null;
""",
              ),
              (
                  """    final value = source[key];
    if (value is num) return value.toDouble();
    if (value is String) {
      final parsed = double.tryParse(value.trim());
      if (parsed != null) return parsed;
    }
""",
                  """    final value = source[key];
    if (value is num) {
      final parsed = value.toDouble();
      if (parsed.isFinite) return parsed;
    }
    if (value is String) {
      final parsed = double.tryParse(value.trim());
      if (parsed != null && parsed.isFinite) return parsed;
    }
""",
              ),
              (
                  """  for (final source in sources) {
    final value = _text(source, keys);
    if (value != null) return value;
  }
  return null;
}

double? _firstNumber(
""",
                  """  for (final source in sources) {
    for (final key in keys) {
      final raw = source[key];
      if (raw is num) {
        final parsed = raw.toDouble();
        if (parsed.isFinite) return '$raw';
      }
      if (raw is String) {
        final text = raw.trim();
        final parsed = double.tryParse(text);
        if (text.isNotEmpty && parsed != null && parsed.isFinite) return text;
      }
    }
  }
  return null;
}

double? _firstNumber(
""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Commit exact bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/lib/features/dashboard/reference_home_dashboard_v3.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "desktop: fail closed on malformed Home telemetry"
          git push origin HEAD:desktop/home-motion-truth-86b7c195
