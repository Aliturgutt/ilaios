name: AWS R01 image attestation

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aws-r01-image-attest.yml'

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      REGISTRY: 101180464425.dkr.ecr.eu-central-1.amazonaws.com
      IMAGE_NAME: ilaios-r01-canary
      IMAGE_DIGEST: sha256:fcd67b650585897e35a6428fb318cbb21fda92420a4363dfee4fac740d4a6904
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1
      - name: Verify image and authenticate registry
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "101180464425"
          FOUND="$(aws ecr describe-images --repository-name "$IMAGE_NAME" --image-ids imageDigest="$IMAGE_DIGEST" --region eu-central-1 --query 'imageDetails[0].imageDigest' --output text)"
          test "$FOUND" = "$IMAGE_DIGEST"
          aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Generate signed build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
