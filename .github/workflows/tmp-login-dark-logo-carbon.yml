name: Temporary Login Dark Logo Finalizer

on:
  push:
    branches:
      - fix/login-dark-logo-carbon-canvas

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-dark-logo-carbon-canvas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.1
      - name: Apply bounded runtime reference and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('apps/web_app_runtime/login_server.py')
          text = runtime.read_text(encoding='utf-8')
          replacements = (
              ('"02-ilaios-primary-horizontal-dark.jpg"', '"02-ilaios-primary-horizontal-dark-carbon.png"', 1),
              ('src="/login/brand-dark.jpg"', 'src="/login/brand-dark.png"', 1),
              ('if split.path == "/login/brand-dark.jpg":', 'if split.path == "/login/brand-dark.png":', 1),
              ('return self._asset_response(_BRAND_DARK, "image/jpeg")', 'return self._asset_response(_BRAND_DARK, "image/png")', 1),
          )
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'unexpected match count for {old!r}: {actual}')
              text = text.replace(old, new, expected)
          runtime.write_text(text, encoding='utf-8')

          test = Path('tests/test_app_ilaios_dark_logo_asset.py')
          test.write_text('''from __future__ import annotations\n\nimport struct\nimport zlib\nfrom pathlib import Path\n\n_REPO_ROOT = Path(__file__).resolve().parents[1]\n_DARK_ASSET = _REPO_ROOT / "brand" / "assets" / "02-ilaios-primary-horizontal-dark-carbon.png"\n_RUNTIME = _REPO_ROOT / "apps" / "web_app_runtime" / "login_server.py"\n\n\ndef _png_top_left_rgb(data: bytes) -> tuple[tuple[int, int], tuple[int, int, int]]:\n    assert data.startswith(b"\\x89PNG\\r\\n\\x1a\\n")\n    offset = 8\n    width = height = bit_depth = color_type = None\n    idat = bytearray()\n    while offset < len(data):\n        length = struct.unpack(">I", data[offset : offset + 4])[0]\n        chunk_type = data[offset + 4 : offset + 8]\n        payload = data[offset + 8 : offset + 8 + length]\n        offset += 12 + length\n        if chunk_type == b"IHDR":\n            width, height, bit_depth, color_type, compression, filtering, interlace = struct.unpack(\n                ">IIBBBBB", payload\n            )\n            assert (compression, filtering, interlace) == (0, 0, 0)\n        elif chunk_type == b"IDAT":\n            idat.extend(payload)\n        elif chunk_type == b"IEND":\n            break\n\n    assert (width, height, bit_depth, color_type) == (2400, 800, 8, 2)\n    scanlines = zlib.decompress(bytes(idat))\n    assert scanlines[0] in {0, 1, 2, 3, 4}\n    return (width, height), tuple(scanlines[1:4])\n\n\ndef test_dark_logo_asset_canvas_starts_at_canonical_carbon() -> None:\n    size, top_left = _png_top_left_rgb(_DARK_ASSET.read_bytes())\n    assert size == (2400, 800)\n    assert top_left == (10, 10, 10)\n\n\ndef test_login_runtime_uses_lossless_dark_asset_without_touching_light_asset() -> None:\n    source = _RUNTIME.read_text(encoding="utf-8")\n    assert '"13-ilaios-primary-horizontal-light.jpg"' in source\n    assert '"02-ilaios-primary-horizontal-dark-carbon.png"' in source\n    assert 'src="/login/brand-light.jpg"' in source\n    assert 'src="/login/brand-dark.png"' in source\n    assert 'if split.path == "/login/brand-dark.png":' in source\n    assert 'return self._asset_response(_BRAND_DARK, "image/png")' in source\n''', encoding='utf-8')
          PY
      - name: Run deterministic dark-logo asset regression
        run: python -m pytest -q tests/test_app_ilaios_dark_logo_asset.py
      - name: Commit final bounded patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web_app_runtime/login_server.py tests/test_app_ilaios_dark_logo_asset.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(login): serve Carbon-compatible dark logo asset'
          git push origin HEAD:fix/login-dark-logo-carbon-canvas
