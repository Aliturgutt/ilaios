name: Video Public Stock Live E2E

on:
  pull_request:
    paths:
      - "scripts/video_public_stock_live_e2e.py"
      - "src/video_automation/internet_archive_stock_transport.py"
      - "src/video_automation/wikimedia_stock_transport.py"
      - ".github/workflows/video-public-stock-live-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-stock-live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked Python validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Run focused transport regressions
        run: >-
          python -m pytest -q
          tests/test_internet_archive_stock_transport.py
          tests/test_wikimedia_stock_transport.py

      - name: Run real public-provider E2E
        run: python scripts/video_public_stock_live_e2e.py

      - name: Upload provider receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: video-stock-public-live-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/video-stock-public-live-e2e/receipt.json
          if-no-files-found: error
          retention-days: 14
