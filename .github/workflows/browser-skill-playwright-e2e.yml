name: Browser Skill Playwright E2E

on:
  pull_request:
    branches: [master]
    paths:
      - 'services/runtime/browser_tool_adapter.py'
      - 'services/runtime/browser_egress_docker.py'
      - 'services/runtime/browser_egress_playwright.py'
      - 'services/browser_runtime_composition.py'
      - 'services/web_agent_browser_certification.py'
      - 'services/web_agent_live_certification.py'
      - 'services/independent_verifier_execution.py'
      - 'services/github_workflow_security_audit.py'
      - 'tests/test_web_factory_browser_skills.py'
      - 'tests/test_browser_cli_url_attestation.py'
      - 'tests/test_browser_egress_docker.py'
      - 'tests/test_browser_egress_playwright.py'
      - 'tests/test_web_agent_browser_certification.py'
      - 'tests/test_independent_verifier*.py'
      - 'tests/test_github_workflow_security_audit.py'
      - 'tests/test_browser_playwright_status_workflow.py'
      - 'tests/test_web_agent_execution.py'
      - 'tests/test_web_agent_runtime.py'
      - 'tools/web-factory/browser-skills/runtime/**'
      - '.github/workflows/browser-skill-playwright-e2e.yml'
      - '.github/workflows/agent-web-live-certification.yml'
  push:
    branches: [master]
    paths:
      - 'services/runtime/browser_tool_adapter.py'
      - 'services/runtime/browser_egress_docker.py'
      - 'services/runtime/browser_egress_playwright.py'
      - 'services/browser_runtime_composition.py'
      - 'services/web_agent_browser_certification.py'
      - 'services/web_agent_live_certification.py'
      - 'services/independent_verifier_execution.py'
      - 'services/github_workflow_security_audit.py'
      - 'tests/test_web_factory_browser_skills.py'
      - 'tests/test_browser_cli_url_attestation.py'
      - 'tests/test_browser_egress_docker.py'
      - 'tests/test_browser_egress_playwright.py'
      - 'tests/test_web_agent_browser_certification.py'
      - 'tests/test_independent_verifier*.py'
      - 'tests/test_github_workflow_security_audit.py'
      - 'tests/test_browser_playwright_status_workflow.py'
      - 'tests/test_web_agent_execution.py'
      - 'tests/test_web_agent_runtime.py'
      - 'tools/web-factory/browser-skills/runtime/**'
      - '.github/workflows/browser-skill-playwright-e2e.yml'
      - '.github/workflows/agent-web-live-certification.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: browser-skill-playwright-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-playwright-cli:
    name: Governed BrowserQA + Docker-isolated real Playwright CLI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BROWSER_IMAGE: ilaios-browser-e2e:${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Establish local BrowserQA branch identity at exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git switch -c ilaios-browser-e2e-ci
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git branch --show-current)" = 'ilaios-browser-e2e-ci'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Run BrowserQA boundary regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_web_factory_browser_skills.py \
            tests/test_browser_cli_url_attestation.py \
            tests/test_browser_egress_docker.py \
            tests/test_browser_egress_playwright.py

      - name: Run BrowserQA certification validator regressions
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_web_agent_browser_certification.py

      - name: Run IndependentVerifier governed-tool regressions
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_independent_verifier_tool_evidence.py

      - name: Run workflow-security regressions
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_github_workflow_security_audit.py \
            tests/test_browser_playwright_status_workflow.py

      - name: Run Web Agent runtime regressions
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_web_agent_execution.py \
            tests/test_web_agent_runtime.py

      - name: Validate BrowserQA Python quality
        run: |
          python -m ruff check \
            services/runtime/browser_tool_adapter.py \
            services/runtime/browser_egress_docker.py \
            services/runtime/browser_egress_playwright.py \
            tools/web-factory/browser-skills/runtime/allowlist_proxy.py \
            tools/web-factory/browser-skills/runtime/playwright_cli_e2e.py \
            services/web_agent_browser_certification.py \
            services/web_agent_live_certification.py \
            services/independent_verifier_execution.py \
            tests/test_web_factory_browser_skills.py \
            tests/test_browser_cli_url_attestation.py \
            tests/test_browser_egress_docker.py \
            tests/test_browser_egress_playwright.py \
            tests/test_web_agent_browser_certification.py \
            tests/test_independent_verifier_tool_evidence.py \
            tests/test_browser_playwright_status_workflow.py
          python -m mypy --strict \
            services/runtime/browser_tool_adapter.py \
            services/runtime/browser_egress_docker.py \
            services/runtime/browser_egress_playwright.py \
            tools/web-factory/browser-skills/runtime/allowlist_proxy.py \
            tools/web-factory/browser-skills/runtime/playwright_cli_e2e.py \
            services/web_agent_browser_certification.py \
            services/web_agent_live_certification.py \
            services/independent_verifier_execution.py \
            tests/test_web_factory_browser_skills.py \
            tests/test_browser_cli_url_attestation.py \
            tests/test_browser_egress_docker.py \
            tests/test_browser_egress_playwright.py \
            tests/test_web_agent_browser_certification.py \
            tests/test_independent_verifier_tool_evidence.py \
            tests/test_browser_playwright_status_workflow.py

      - name: Provision pinned Playwright seccomp profile
        env:
          SECCOMP_PATH: ${{ runner.temp }}/playwright-seccomp_profile.json
        run: |
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import urllib.request

          source_commit = "5f8e7eac83052e2602faec430adf54dd55d63611"
          expected_blob = "fddc05fb520affb145404e6f6f647ca96af8087d"
          url = (
              "https://raw.githubusercontent.com/microsoft/playwright/"
              f"{source_commit}/utils/docker/seccomp_profile.json"
          )
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = response.read()
          header = f"blob {len(payload)}\0".encode("ascii")
          actual_blob = hashlib.sha1(
              header + payload,
              usedforsecurity=False,
          ).hexdigest()
          if actual_blob != expected_blob:
              raise SystemExit(
                  f"Playwright seccomp provenance mismatch: {actual_blob}"
              )
          destination = pathlib.Path(os.environ["SECCOMP_PATH"])
          destination.write_bytes(payload)
          destination.chmod(0o600)
          print(f"verified Playwright seccomp blob {actual_blob}")
          PY

      - name: Build pinned BrowserQA runtime image
        run: |
          docker build --pull \
            --tag "$BROWSER_IMAGE" \
            --file tools/web-factory/browser-skills/runtime/Dockerfile \
            tools/web-factory/browser-skills/runtime
          docker image inspect "$BROWSER_IMAGE" --format '{{.Id}}'
          docker run --rm "$BROWSER_IMAGE" playwright-cli --help >/dev/null
          docker run --rm "$BROWSER_IMAGE" python3 --version

      - name: Run governed real Playwright CLI through ToolGateway and enforced egress boundary
        env:
          PYTHONPATH: ${{ github.workspace }}
          ILAIOS_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          ILAIOS_BROWSER_E2E_IMAGE: ${{ env.BROWSER_IMAGE }}
          ILAIOS_BROWSER_SECCOMP_PROFILE: ${{ runner.temp }}/playwright-seccomp_profile.json
          ILAIOS_BROWSER_E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/browser-skill-playwright-e2e
        run: python tools/web-factory/browser-skills/runtime/playwright_cli_e2e.py

      - name: Assert exact-head governed BrowserQA evidence exists
        run: |
          set -euo pipefail
          test -s artifacts/browser-skill-playwright-e2e/playwright-cli-e2e-summary.json
          grep -F '"source_sha": "'"$SOURCE_SHA"'"' \
            artifacts/browser-skill-playwright-e2e/playwright-cli-e2e-summary.json
          grep -F '"schema_version": 2' \
            artifacts/browser-skill-playwright-e2e/playwright-cli-e2e-summary.json
          grep -F '"agent_id": "ilaios.agent.web.browser-qa.v1"' \
            artifacts/browser-skill-playwright-e2e/playwright-cli-e2e-summary.json
          grep -F '"skill_id": "ilaios-web-e2e"' \
            artifacts/browser-skill-playwright-e2e/playwright-cli-e2e-summary.json
          grep -F '"canonical_tool_gateway": "browser.playwright-cli"' \
            artifacts/browser-skill-playwright-e2e/playwright-cli-e2e-summary.json
          grep -F '"governed_work_persisted": true' \
            artifacts/browser-skill-playwright-e2e/playwright-cli-e2e-summary.json
          grep -F '"canonical_admission_proven": true' \
            artifacts/browser-skill-playwright-e2e/playwright-cli-e2e-summary.json
          grep -F '"direct_public_ip_egress_blocked": true' \
            artifacts/browser-skill-playwright-e2e/playwright-cli-e2e-summary.json
          grep -F '"governed_high_risk_interaction_verified": true' \
            artifacts/browser-skill-playwright-e2e/playwright-cli-e2e-summary.json
          test "$(find artifacts/browser-skill-playwright-e2e/browser-egress-evidence -type f -name '*.json' | wc -l)" -ge 7

      - name: Clean transient BrowserQA Docker resources
        if: always()
        run: |
          docker ps -aq --filter label=ilaios.browser-egress=true | xargs -r docker rm -f
          docker network ls -q --filter label=ilaios.browser-egress=true | xargs -r docker network rm || true

      - name: Upload exact governed BrowserQA E2E evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-skill-playwright-e2e-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: artifacts/browser-skill-playwright-e2e
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact-source BrowserQA status
        if: ${{ always() }}
        env:
          STATUS_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          sha = os.environ["SOURCE_SHA"].strip().lower()
          if len(sha) != 40 or any(ch not in "0123456789abcdef" for ch in sha):
              raise SystemExit("BrowserQA source SHA is malformed")
          accepted = os.environ.get("JOB_STATUS") == "success"
          document = json.dumps({
              "state": "success" if accepted else "failure",
              "context": "ilaios/browser-playwright-e2e",
              "description": (
                  "Governed BrowserQA real Playwright E2E PASS"
                  if accepted
                  else "Governed BrowserQA real Playwright E2E failed closed"
              ),
              "target_url": os.environ["TARGET_URL"],
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{sha}",
              data=document,
              headers={
                  "Authorization": f"Bearer {os.environ['STATUS_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              assert response.status == 201
          print(
              f"BROWSER_PLAYWRIGHT_E2E_STATUS={'SUCCESS' if accepted else 'FAILURE'} sha={sha}"
          )
          PY
