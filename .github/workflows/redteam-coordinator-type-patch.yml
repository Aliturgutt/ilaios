name: Redteam Coordinator Type One-Shot Patch

on:
  push:
    branches:
      - redteam/execution-coordinator-final-current-master

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: redteam/execution-coordinator-final-current-master
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact typing repairs and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('services/execution_coordinator.py')
          text = path.read_text(encoding='utf-8')

          cancel_old = 'return state.value\n        if state is ExecutionState.ACCEPTED:'
          cancel_new = 'return str(state.value)\n        if state is ExecutionState.ACCEPTED:'
          if text.count(cancel_old) != 2:
              raise SystemExit(f'expected exactly two cancel typing anchors, got {text.count(cancel_old)}')
          text = text.replace(cancel_old, cancel_new, 2)

          budget_old = 'int(budget_value["max_attempts"]),\n                int(budget_value["max_runtime_seconds"]),\n                int(budget_value["max_external_spend_minor"]),'
          budget_new = 'int(str(budget_value["max_attempts"])),\n                int(str(budget_value["max_runtime_seconds"])),\n                int(str(budget_value["max_external_spend_minor"])),'
          if text.count(budget_old) != 1:
              raise SystemExit(f'expected exactly one budget typing anchor, got {text.count(budget_old)}')
          text = text.replace(budget_old, budget_new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile services/execution_coordinator.py
          rm .github/workflows/redteam-coordinator-type-patch.yml
          git config user.name 'ILAIOS Redteam Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add services/execution_coordinator.py .github/workflows/redteam-coordinator-type-patch.yml
          git diff --cached --check
          git commit -m 'fix: make coordinator multi typing explicit [redteam-type-patch]'
          git push origin HEAD:redteam/execution-coordinator-final-current-master
