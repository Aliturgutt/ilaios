name: Book EPUBCheck Once

on:
  push:
    branches:
      - creative/book-production-a-fixes-20260909

permissions:
  contents: read

jobs:
  epubcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked Python validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Generate exact-source EPUB fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from services.book_renderers import render_book_package
          from tests.test_book_production_a_blockers import _approved_book
          package = render_book_package(_approved_book())
          Path('book-a.epub').write_bytes(package.epub)
          print('generated', len(package.epub), 'bytes')
          PY

      - name: Run EPUBCheck 5.3.0
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.3.0/epubcheck.jar book-a.epub
