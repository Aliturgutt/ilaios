name: Agent Skills Production Certification

on:
  push:
    branches:
      - master
    paths:
      - 'services/agent_skills_compat.py'
      - 'services/agent_skills_runtime.py'
      - 'services/agent_skills_live_certification.py'
      - 'services/runtime/**'
      - 'services/openrouter_agent_catalog.py'
      - '.github/workflows/agent-skills-production-certification.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: agent-skills-production-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-skill-live-certification:
    name: Real provider governed external skill evidence
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AGENT_SKILLS_LIVE_PROOF_DIR: artifacts/agent-skills-live-proof

    steps:
      - name: Checkout exact trusted source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Verify production secret and source boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          test "$GITHUB_REF" = "refs/heads/master" || test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git remote get-url origin)" = "https://github.com/Aliturgutt/ilaios.git"
          echo 'OPENROUTER_API_KEY_PRESENT=TRUE'
          echo 'EXACT_SOURCE_IDENTITY=PASS'
          echo 'Credential material is not printed or persisted.'

      - name: Run focused governed runtime regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_agent_skills_compat.py \
            tests/test_agent_skills_production_runtime.py \
            tests/test_runtime_external_adapter_integration.py

      - name: Run real-provider external skill certification
        shell: bash
        run: |
          set -euo pipefail
          python -m services.agent_skills_live_certification

      - name: Verify accepted certification receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def is_sha256(value: object) -> bool:
              return (
                  isinstance(value, str)
                  and len(value) == 64
                  and all(character in '0123456789abcdef' for character in value)
              )

          path = Path(os.environ['AGENT_SKILLS_LIVE_PROOF_DIR']) / 'agent-skills-live-receipt.json'
          receipt = json.loads(path.read_text(encoding='utf-8'))
          assert receipt['status'] == 'VERIFIED'
          assert receipt['scope'] == 'external-agent-skill-production-runtime'
          assert receipt['revision_sha'] == os.environ['GITHUB_SHA']
          assert receipt['tenant_id'] == 'ilaios-agent-skills-live-certification'
          assert receipt['capability'] == 'workflow.plan'
          assert receipt['provider_id'] == 'openrouter'
          assert receipt['actual_cost_usd'] == '0'
          assert receipt['admission_proven'] is True
          assert receipt['approval_required_for_live_request'] is False
          assert receipt['high_risk_blocked_without_approval'] is True
          assert receipt['tool_gateway_proven'] is True
          assert receipt['evidence_chain_integrity'] is True
          assert receipt['script_execution_authorized'] is False
          assert is_sha256(receipt['package_sha256'])
          assert is_sha256(receipt['instruction_sha256'])
          assert is_sha256(receipt['evidence_chain_hash'])
          assert isinstance(receipt['provider_response_id'], str) and receipt['provider_response_id']
          print('AGENT_SKILLS_LIVE_RECEIPT=PASS')
          PY

      - name: Publish certification summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo '## ILAIOS Agent Skills Production Certification' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$AGENT_SKILLS_LIVE_PROOF_DIR/agent-skills-live-receipt.json" ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (Path(os.environ['AGENT_SKILLS_LIVE_PROOF_DIR']) / 'agent-skills-live-receipt.json').read_text(encoding='utf-8')
          )
          print(f"- Status: `{receipt.get('status')}`")
          print(f"- Revision: `{receipt.get('revision_sha')}`")
          print(f"- Provider: `{receipt.get('provider_id')}`")
          print(f"- Model: `{receipt.get('model_id')}`")
          print(f"- Provider response ID present: `{bool(receipt.get('provider_response_id'))}`")
          print(f"- High-risk approval bypass blocked: `{receipt.get('high_risk_blocked_without_approval')}`")
          print(f"- Evidence chain integrity: `{receipt.get('evidence_chain_integrity')}`")
          print(f"- Actual cost USD: `{receipt.get('actual_cost_usd')}`")
          PY
          else
            echo '- Status: `NO_ACCEPTED_RECEIPT`' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable external skill evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-skills-live-proof-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/agent-skills-live-proof
          if-no-files-found: warn
          retention-days: 30

      - name: Publish sanitized production certification status
        if: ${{ always() }}
        shell: bash
        env:
          CERT_JOB_STATUS: ${{ job.status }}
          CERT_STATUS_TOKEN: ${{ github.token }}
          CERT_STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          accepted = False
          receipt_path = Path(os.environ['AGENT_SKILLS_LIVE_PROOF_DIR']) / 'agent-skills-live-receipt.json'
          if os.environ.get('CERT_JOB_STATUS') == 'success' and receipt_path.is_file():
              try:
                  receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
                  accepted = (
                      receipt.get('status') == 'VERIFIED'
                      and receipt.get('scope') == 'external-agent-skill-production-runtime'
                      and receipt.get('revision_sha') == os.environ['GITHUB_SHA']
                      and receipt.get('provider_id') == 'openrouter'
                      and receipt.get('actual_cost_usd') == '0'
                      and receipt.get('admission_proven') is True
                      and receipt.get('high_risk_blocked_without_approval') is True
                      and receipt.get('tool_gateway_proven') is True
                      and receipt.get('evidence_chain_integrity') is True
                      and receipt.get('script_execution_authorized') is False
                  )
              except (OSError, ValueError, TypeError):
                  accepted = False

          state = 'success' if accepted else 'failure'
          description = (
              'External Agent Skill live runtime receipt accepted'
              if accepted
              else 'External Agent Skill production certification failed closed'
          )
          document = json.dumps(
              {
                  'state': state,
                  'target_url': os.environ['CERT_STATUS_TARGET_URL'],
                  'description': description,
                  'context': 'ILAIOS Agent Skills Production Certification',
              },
              separators=(',', ':'),
          ).encode('utf-8')
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=document,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['CERT_STATUS_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in {200, 201}:
                  raise RuntimeError(f'commit status publish failed: HTTP {response.status}')
          print(f'AGENT_SKILLS_PRODUCTION_STATUS={state}')
          PY
