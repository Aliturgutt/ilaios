name: Temporary Video Mypy Repair

on:
  push:
    branches:
      - fix/video-factory-provider-runtime

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'Aliturgutt'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/video-factory-provider-runtime
          fetch-depth: 0

      - name: Apply exact strict-mypy repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/video_automation/openrouter_video_provider.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from .models import ProviderRequest, ProviderResult'
          new_import = 'from .models import MetadataValue, ProviderRequest, ProviderResult'
          if text.count(old_import) != 1:
              raise SystemExit('expected exactly one ProviderResult import target')
          text = text.replace(old_import, new_import, 1)

          marker = '''        metadata = {
              "backend": "openrouter",
              "cost_policy": "free_only",
              "model_id": model_id,'''
          replacement = '''        metadata: dict[str, MetadataValue] = {
              "backend": "openrouter",
              "cost_policy": "free_only",
              "model_id": model_id,'''
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one provider metadata target')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/video_automation/openrouter_video_provider.py
          git config user.name 'Ali Turgut'
          git config user.email '98952443+Aliturgutt@users.noreply.github.com'
          git add src/video_automation/openrouter_video_provider.py
          git commit -m 'fix(video): type provider preflight metadata'
          git push origin HEAD:fix/video-factory-provider-runtime
