name: Video Remotion Render E2E

on:
  pull_request:
    paths:
      - "src/video_automation/remotion_render_executor.py"
      - "tools/video_remotion_runtime/**"
      - "tests/test_video_remotion_render_executor.py"
      - ".github/workflows/video-remotion-render-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixel-render-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests python-dotenv

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install pinned Remotion runtime
        working-directory: tools/video_remotion_runtime
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run unit regression
        run: python -m pytest -q tests/test_video_remotion_render_executor.py -k "not real_remotion"

      - name: Run real pixel-level Remotion E2E
        env:
          ILAIOS_RUN_REMOTION_E2E: "1"
        run: python -m pytest -q tests/test_video_remotion_render_executor.py -k "real_remotion"
