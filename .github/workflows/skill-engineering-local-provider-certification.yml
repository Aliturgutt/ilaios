name: Skill Engineering Local Provider Certification

on:
  push:
    branches:
      - master
    paths:
      - 'services/p0_ai_provider_config.py'
      - 'services/p0_runtime_composition.py'
      - 'services/skill_engineering_live_certification.py'
      - 'services/skill_engineering_runtime.py'
      - 'tools/skill-engineering/skills/**'
      - '.github/workflows/skill-engineering-local-provider-certification.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  llama-cpp:
    name: llama.cpp real localhost E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_SHA: ${{ github.sha }}
      SKILL_ENGINEERING_CERT_PROVIDER_MODE: configured
      SKILL_ENGINEERING_PROOF_DIR: artifacts/skill-engineering-llama-cpp-proof
      ILAIOS_LOCAL_PROVIDER_KEY: local-e2e-no-secret
      LLAMA_CPP_COMMIT: 60addddf3c567c43ec3caf70fc953fba3572d96f
      GGUF_SHA256: ed5fa30c487b282ec156c29062f1222e5c20875a944ac98289dbd242e947f747
    steps:
      - name: Checkout exact ILAIOS source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install ILAIOS validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Build pinned llama.cpp server
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential cmake curl git
          git init /tmp/llama.cpp
          git -C /tmp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama.cpp fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C /tmp/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_COMMIT"
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama.cpp/build --config Release -j 2 --target llama-server
          /tmp/llama.cpp/build/bin/llama-server --version | tee /tmp/llama-version.txt

      - name: Download and verify tiny GGUF fixture
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf?download=true' \
            --output /tmp/smollm2.gguf
          echo "$GGUF_SHA256  /tmp/smollm2.gguf" | sha256sum --check --strict

      - name: Start real llama.cpp OpenAI-compatible endpoint
        run: |
          set -euo pipefail
          /tmp/llama.cpp/build/bin/llama-server \
            -m /tmp/smollm2.gguf \
            --alias ilaios-local \
            --host 127.0.0.1 \
            --port 8080 \
            -c 8192 \
            > /tmp/llama-server.log 2>&1 &
          echo $! > /tmp/llama-server.pid
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/v1/models >/tmp/llama-models.json; then
              cat /tmp/llama-models.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/llama-server.log
          exit 1

      - name: Configure governed local provider
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          config = {
              'providers': [{
                  'provider_id': 'llama-cpp',
                  'base_url': 'http://127.0.0.1:8080/v1',
                  'api_key_env': 'ILAIOS_LOCAL_PROVIDER_KEY',
                  'timeout_seconds': 45,
                  'max_retries': 0,
              }],
              'models': [{
                  'model_id': 'ilaios-local',
                  'provider_id': 'llama-cpp',
                  'capabilities': ['architecture.propose', 'code.review', 'test.execute'],
                  'context_window': 8192,
                  'max_output_tokens': 1024,
                  'input_cost_per_million_usd': '0',
                  'output_cost_per_million_usd': '0',
              }],
              'routing': {
                  'allowed_models': ['ilaios-local'],
                  'denied_models': [],
                  'allowed_providers': ['llama-cpp'],
                  'denied_providers': [],
                  'fallback_order': ['ilaios-local'],
              },
              'limits': [{
                  'scope_kind': 'tenant',
                  'scope_id': 'ilaios-skill-engineering-live-certification',
                  'max_input_tokens': 32768,
                  'max_output_tokens': 4096,
                  'max_requests_daily': 20,
                  'max_concurrency': 1,
                  'daily_cost_usd': '0',
                  'monthly_cost_usd': '0',
                  'gpu_seconds_daily': '0',
                  'runtime_seconds_daily': '1800',
                  'warning_fraction': '0.8',
                  'max_retries': 0,
                  'max_retry_cost_usd': '0',
              }],
          }
          print('ILAIOS_AGENT_AI_CONFIG_JSON=' + json.dumps(config, separators=(',', ':')))
          PY

      - name: Execute five Skill Engineering skills through real llama.cpp
        run: |
          set -euo pipefail
          python -m services.skill_engineering_live_certification

      - name: Verify llama.cpp receipt and immutable engine evidence
        run: |
          set -euo pipefail
          mkdir -p "$SKILL_ENGINEERING_PROOF_DIR"
          cp /tmp/llama-version.txt "$SKILL_ENGINEERING_PROOF_DIR/llama-version.txt"
          cp /tmp/llama-models.json "$SKILL_ENGINEERING_PROOF_DIR/llama-models.json"
          cp /tmp/llama-server.log "$SKILL_ENGINEERING_PROOF_DIR/llama-server.log"
          printf '%s\n' "$LLAMA_CPP_COMMIT" > "$SKILL_ENGINEERING_PROOF_DIR/llama-cpp-commit.txt"
          printf '%s\n' "$GGUF_SHA256" > "$SKILL_ENGINEERING_PROOF_DIR/model-sha256.txt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['SKILL_ENGINEERING_PROOF_DIR']) / 'skill-engineering-live-receipt.json').read_text())
          assert receipt['status'] == 'VERIFIED'
          assert receipt['revision_sha'] == os.environ['GITHUB_SHA']
          assert receipt['verified_skill_count'] == 5
          assert receipt['target_skill_count'] == 5
          assert receipt['zero_cost_only'] is True
          assert receipt['zero_cost_openrouter_only'] is False
          assert receipt['provider_ids'] == ['llama-cpp']
          assert all(item['provider_id'] == 'llama-cpp' for item in receipt['skills'])
          print('LLAMA_CPP_SKILL_ENGINEERING_E2E=PASS verified=5/5')
          PY

      - name: Upload llama.cpp evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-engineering-llama-cpp-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/skill-engineering-llama-cpp-proof
          if-no-files-found: warn
          retention-days: 30

      - name: Publish llama.cpp commit status
        if: ${{ always() }}
        env:
          E2E_JOB_STATUS: ${{ job.status }}
          STATUS_TOKEN: ${{ github.token }}
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          accepted = os.environ.get('E2E_JOB_STATUS') == 'success'
          document = json.dumps({
              'state': 'success' if accepted else 'failure',
              'context': 'ilaios/skill-engineering-llama-cpp-e2e',
              'description': 'llama.cpp real localhost 5/5 E2E PASS' if accepted else 'llama.cpp Skill Engineering E2E failed closed',
              'target_url': os.environ['STATUS_TARGET_URL'],
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=document,
              headers={'Authorization': f"Bearer {os.environ['STATUS_TOKEN']}", 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              assert response.status == 201
          PY

  vllm:
    name: vLLM real localhost E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_SHA: ${{ github.sha }}
      SKILL_ENGINEERING_CERT_PROVIDER_MODE: configured
      SKILL_ENGINEERING_PROOF_DIR: artifacts/skill-engineering-vllm-proof
      ILAIOS_LOCAL_PROVIDER_KEY: local-e2e-no-secret
      VLLM_IMAGE: vllm/vllm-openai-cpu:v0.26.0-x86_64
    steps:
      - name: Checkout exact ILAIOS source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install ILAIOS validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Start official vLLM CPU OpenAI endpoint
        run: |
          set -euo pipefail
          docker pull "$VLLM_IMAGE"
          docker image inspect "$VLLM_IMAGE" --format '{{json .RepoDigests}}' | tee /tmp/vllm-image-digests.json
          docker run --detach --name ilaios-vllm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_NICE \
            --shm-size=2g \
            -p 8000:8000 \
            -e VLLM_CPU_KVCACHE_SPACE=2 \
            "$VLLM_IMAGE" \
            HuggingFaceTB/SmolLM2-135M-Instruct \
            --served-model-name ilaios-local \
            --dtype float32 \
            --max-model-len 8192
          for attempt in $(seq 1 300); do
            if curl --fail --silent http://127.0.0.1:8000/v1/models >/tmp/vllm-models.json; then
              cat /tmp/vllm-models.json
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' ilaios-vllm | grep -q true; then
              docker logs ilaios-vllm
              exit 1
            fi
            sleep 2
          done
          docker logs ilaios-vllm
          exit 1

      - name: Configure governed vLLM provider
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          config = {
              'providers': [{
                  'provider_id': 'vllm',
                  'base_url': 'http://127.0.0.1:8000/v1',
                  'api_key_env': 'ILAIOS_LOCAL_PROVIDER_KEY',
                  'timeout_seconds': 60,
                  'max_retries': 0,
              }],
              'models': [{
                  'model_id': 'ilaios-local',
                  'provider_id': 'vllm',
                  'capabilities': ['architecture.propose', 'code.review', 'test.execute'],
                  'context_window': 8192,
                  'max_output_tokens': 1024,
                  'input_cost_per_million_usd': '0',
                  'output_cost_per_million_usd': '0',
              }],
              'routing': {
                  'allowed_models': ['ilaios-local'],
                  'denied_models': [],
                  'allowed_providers': ['vllm'],
                  'denied_providers': [],
                  'fallback_order': ['ilaios-local'],
              },
              'limits': [{
                  'scope_kind': 'tenant',
                  'scope_id': 'ilaios-skill-engineering-live-certification',
                  'max_input_tokens': 32768,
                  'max_output_tokens': 4096,
                  'max_requests_daily': 20,
                  'max_concurrency': 1,
                  'daily_cost_usd': '0',
                  'monthly_cost_usd': '0',
                  'gpu_seconds_daily': '0',
                  'runtime_seconds_daily': '2100',
                  'warning_fraction': '0.8',
                  'max_retries': 0,
                  'max_retry_cost_usd': '0',
              }],
          }
          print('ILAIOS_AGENT_AI_CONFIG_JSON=' + json.dumps(config, separators=(',', ':')))
          PY

      - name: Execute five Skill Engineering skills through real vLLM
        run: |
          set -euo pipefail
          python -m services.skill_engineering_live_certification

      - name: Verify vLLM receipt and engine evidence
        run: |
          set -euo pipefail
          mkdir -p "$SKILL_ENGINEERING_PROOF_DIR"
          cp /tmp/vllm-image-digests.json "$SKILL_ENGINEERING_PROOF_DIR/vllm-image-digests.json"
          cp /tmp/vllm-models.json "$SKILL_ENGINEERING_PROOF_DIR/vllm-models.json"
          docker logs ilaios-vllm > "$SKILL_ENGINEERING_PROOF_DIR/vllm-server.log" 2>&1
          printf '%s\n' "$VLLM_IMAGE" > "$SKILL_ENGINEERING_PROOF_DIR/vllm-image.txt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['SKILL_ENGINEERING_PROOF_DIR']) / 'skill-engineering-live-receipt.json').read_text())
          assert receipt['status'] == 'VERIFIED'
          assert receipt['revision_sha'] == os.environ['GITHUB_SHA']
          assert receipt['verified_skill_count'] == 5
          assert receipt['target_skill_count'] == 5
          assert receipt['zero_cost_only'] is True
          assert receipt['zero_cost_openrouter_only'] is False
          assert receipt['provider_ids'] == ['vllm']
          assert all(item['provider_id'] == 'vllm' for item in receipt['skills'])
          print('VLLM_SKILL_ENGINEERING_E2E=PASS verified=5/5')
          PY

      - name: Upload vLLM evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-engineering-vllm-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/skill-engineering-vllm-proof
          if-no-files-found: warn
          retention-days: 30

      - name: Publish vLLM commit status
        if: ${{ always() }}
        env:
          E2E_JOB_STATUS: ${{ job.status }}
          STATUS_TOKEN: ${{ github.token }}
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          accepted = os.environ.get('E2E_JOB_STATUS') == 'success'
          document = json.dumps({
              'state': 'success' if accepted else 'failure',
              'context': 'ilaios/skill-engineering-vllm-e2e',
              'description': 'vLLM real localhost 5/5 E2E PASS' if accepted else 'vLLM Skill Engineering E2E failed closed',
              'target_url': os.environ['STATUS_TARGET_URL'],
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=document,
              headers={'Authorization': f"Bearer {os.environ['STATUS_TOKEN']}", 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              assert response.status == 201
          PY
