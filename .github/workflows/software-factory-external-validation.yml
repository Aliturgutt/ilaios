name: Software Factory External Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - services/software_factory_external_validation.py
      - tests/test_software_factory_external_validation.py
      - .github/workflows/software-factory-external-validation.yml

permissions:
  contents: read

jobs:
  external-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run real read-only external repository/provider/commercial validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m services.software_factory_external_validation \
            --repository psf/requests \
            --output /tmp/software-factory-external-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/software-factory-external-validation.json').read_text())
          assert payload['repository']['repository'] == 'psf/requests'
          assert len(payload['repository']['head_sha']) == 40
          assert payload['repository']['read_only'] is True
          assert payload['provider_route']['provider_id'] == 'github.readonly'
          assert payload['commercial_readiness']['technical_gate_passed'] is True
          assert payload['commercial_readiness']['legal_clearance_claimed'] is False
          assert payload['mutation_performed'] is False
          PY

      - name: Upload external validation evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: software-factory-external-validation
          path: /tmp/software-factory-external-validation.json
          if-no-files-found: error
