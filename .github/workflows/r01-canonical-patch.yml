name: R01 canonical maintenance patch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/r01-canonical-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Patch canonical R01 apply digest exactly once
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/aws-r01-canary-apply.yml')
          text = path.read_text(encoding='utf-8')
          old = 'sha256:fcd67b650585897e35a6428fb318cbb21fda92420a4363dfee4fac740d4a6904'
          new = 'sha256:4534f8af614aa4fd890785e19f27e2ede7ce59435def93069884156261b86931'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one canonical old digest reference, found {count}')
          text = text.replace(old, new)
          if old in text or text.count(new) < 1:
              raise SystemExit('canonical digest replacement verification failed')
          path.write_text(text, encoding='utf-8')
          print('R01_CANONICAL_DIGEST_PATCHED')
          PY
          git diff --check
          git diff -- .github/workflows/aws-r01-canary-apply.yml
      - name: Commit canonical patch
        run: |
          set -euo pipefail
          git config user.name 'ILAIOS Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/aws-r01-canary-apply.yml
          git diff --cached --quiet && { echo 'No canonical patch required.'; exit 0; }
          git commit -m 'fix(r01): pin canonical apply to healthy clean image'
          git push origin HEAD:master
