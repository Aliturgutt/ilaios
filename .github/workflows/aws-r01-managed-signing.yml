name: AWS R01 managed image signing

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aws-r01-managed-signing.yml'

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: ilaios-r01-canary
      DIGEST: sha256:4534f8af614aa4fd890785e19f27e2ede7ce59435def93069884156261b86931
      PROFILE: ILAIOS_R01_ECR
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1
      - name: Verify clean image
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "101180464425"
          FOUND="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageDigest="$DIGEST" --region eu-central-1 --query 'imageDetails[0].imageDigest' --output text)"
          test "$FOUND" = "$DIGEST"
          read -r STATUS CRITICAL HIGH < <(aws ecr describe-image-scan-findings --repository-name "$REPOSITORY" --image-id imageDigest="$DIGEST" --region eu-central-1 --query '[imageScanStatus.status, to_string(imageScanFindings.findingSeverityCounts.CRITICAL || `0`), to_string(imageScanFindings.findingSeverityCounts.HIGH || `0`)]' --output text)
          test "$STATUS" = COMPLETE
          test "$CRITICAL" = 0
          test "$HIGH" = 0
      - name: Configure AWS Signer and ECR managed signing
        run: |
          set -euo pipefail
          if ! aws signer get-signing-profile --profile-name "$PROFILE" --region eu-central-1 >/dev/null 2>&1; then
            aws signer put-signing-profile --profile-name "$PROFILE" --platform-id Notation-OCI-SHA384-ECDSA --region eu-central-1 >/dev/null
          fi
          PROFILE_ARN="$(aws signer get-signing-profile --profile-name "$PROFILE" --region eu-central-1 --query 'arn' --output text)"
          test -n "$PROFILE_ARN"
          cat > /tmp/signing.json <<JSON
          {
            "rules": [
              {
                "signingProfileArn": "$PROFILE_ARN",
                "repositoryFilters": [
                  {"filter": "$REPOSITORY", "filterType": "WILDCARD_MATCH"}
                ]
              }
            ]
          }
          JSON
          aws ecr put-signing-configuration --signing-configuration file:///tmp/signing.json --region eu-central-1 >/dev/null
          echo "SIGNING_PROFILE_ARN=$PROFILE_ARN"
      - name: Re-register immutable manifest to trigger managed signing
        id: trigger
        run: |
          set -euo pipefail
          aws ecr batch-get-image \
            --repository-name "$REPOSITORY" \
            --image-ids imageDigest="$DIGEST" \
            --accepted-media-types application/vnd.oci.image.manifest.v1+json \
            --region eu-central-1 \
            --output json > /tmp/ecr-image.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/ecr-image.json').read_text())
          images = payload.get('images', [])
          if len(images) != 1:
              raise SystemExit('Expected exactly one immutable image manifest.')
          manifest = images[0].get('imageManifest')
          if not isinstance(manifest, str):
              raise SystemExit('ECR image manifest missing.')
          json.loads(manifest)
          Path('/tmp/manifest.json').write_text(manifest, encoding='utf-8')
          PY
          TAG="signed-${GITHUB_SHA}"
          aws ecr put-image \
            --repository-name "$REPOSITORY" \
            --image-manifest file:///tmp/manifest.json \
            --image-tag "$TAG" \
            --region eu-central-1 >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Verify managed signing status
        env:
          TAG: ${{ steps.trigger.outputs.tag }}
        run: |
          set -euo pipefail
          PROFILE_ARN="$(aws signer get-signing-profile --profile-name "$PROFILE" --region eu-central-1 --query 'arn' --output text)"
          for i in $(seq 1 60); do
            aws ecr describe-image-signing-status \
              --repository-name "$REPOSITORY" \
              --image-id imageTag="$TAG" \
              --region eu-central-1 \
              --output json > /tmp/signing-status.json
            read -r STATUS FAILURE_CODE < <(python - "$PROFILE_ARN" <<'PY'
          import json
          import sys
          from pathlib import Path
          profile = sys.argv[1]
          payload = json.loads(Path('/tmp/signing-status.json').read_text())
          matches = [s for s in payload.get('signingStatuses', []) if s.get('signingProfileArn') == profile]
          if not matches:
              print('PENDING -')
          else:
              item = matches[0]
              print(item.get('status', 'PENDING'), item.get('failureCode', '-'))
          PY
            )
            echo "IMAGE_SIGNING_STATUS=$STATUS"
            case "$STATUS" in
              COMPLETE)
                exit 0
                ;;
              FAILED)
                python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/signing-status.json').read_text())
          for item in payload.get('signingStatuses', []):
              if item.get('status') == 'FAILED':
                  print('SIGNING_FAILURE_CODE=' + str(item.get('failureCode', 'unknown')))
                  print('SIGNING_FAILURE_REASON=' + str(item.get('failureReason', 'unknown')))
          PY
                exit 1
                ;;
              IN_PROGRESS|PENDING)
                ;;
              *)
                echo "Unexpected signing status: $STATUS"
                cat /tmp/signing-status.json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo 'Managed signing did not complete within bounded wait window.'
          cat /tmp/signing-status.json
          exit 1
