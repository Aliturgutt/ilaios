name: Web App Factory Exact-Master Status

on:
  workflow_run:
    workflows:
      - Web App Factory Continuation Gate
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish exact-master Web App Factory result
        env:
          STATUS_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          sha = os.environ['HEAD_SHA'].strip().lower()
          if len(sha) != 40 or any(ch not in '0123456789abcdef' for ch in sha):
              raise SystemExit('workflow_run head SHA is malformed')
          conclusion = os.environ.get('RUN_CONCLUSION', '')
          state = 'success' if conclusion == 'success' else 'failure'
          description = (
              'Web App Factory Continuation Gate PASS on exact master SHA'
              if state == 'success'
              else f'Web App Factory Continuation Gate did not pass on exact master SHA: {conclusion}'
          )
          document = json.dumps({
              'state': state,
              'context': 'ilaios/web-app-factory-exact-master',
              'description': description[:140],
              'target_url': os.environ['TARGET_URL'],
          }).encode('utf-8')
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{sha}",
              data=document,
              headers={
                  'Authorization': f"Bearer {os.environ['STATUS_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              assert response.status == 201
          print(f'EXACT_MASTER_WEB_APP_FACTORY_STATUS={state.upper()} sha={sha}')
          PY
