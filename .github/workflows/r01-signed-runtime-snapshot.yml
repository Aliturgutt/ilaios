name: R01 signed runtime snapshot

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/r01-signed-runtime-snapshot.yml'

permissions:
  contents: read
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1
      - name: Snapshot signed canary
        run: |
          set -euo pipefail
          echo '=== SERVICE ==='
          aws ecs describe-services --cluster ilaios-r01-canary --services ilaios-r01-canary --region eu-central-1 --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,taskDefinition:taskDefinition,deployments:deployments[*].{status:status,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,taskDefinition:taskDefinition,desired:desiredCount,running:runningCount,pending:pendingCount,failed:failedTasks},events:events[0:10].message}' --output json
          echo '=== RUNNING TASKS ==='
          TASKS="$(aws ecs list-tasks --cluster ilaios-r01-canary --service-name ilaios-r01-canary --desired-status RUNNING --region eu-central-1 --query 'taskArns' --output text)"
          if [ -n "$TASKS" ]; then
            aws ecs describe-tasks --cluster ilaios-r01-canary --tasks $TASKS --region eu-central-1 --query 'tasks[*].{task:taskArn,taskDefinition:taskDefinitionArn,lastStatus:lastStatus,health:healthStatus,containers:containers[*].{name:name,status:lastStatus,health:healthStatus,exit:exitCode,reason:reason}}' --output json
          fi
          echo '=== TARGET HEALTH ==='
          TG="$(aws elbv2 describe-target-groups --names ilaios-r01-canary --region eu-central-1 --query 'TargetGroups[0].TargetGroupArn' --output text)"
          aws elbv2 describe-target-health --target-group-arn "$TG" --region eu-central-1 --output json
          echo '=== TASK DEFINITION IMAGE ==='
          TD="$(aws ecs describe-services --cluster ilaios-r01-canary --services ilaios-r01-canary --region eu-central-1 --query 'services[0].taskDefinition' --output text)"
          aws ecs describe-task-definition --task-definition "$TD" --region eu-central-1 --query 'taskDefinition.containerDefinitions[?name==`runtime`].{image:image,ready:environment[?name==`ILAIOS_READY_FILE`].value|[0],health:healthCheck.command}' --output json
          echo '=== RECENT LOGS ==='
          aws logs tail '/ilaios/r01/canary/runtime' --since 10m --region eu-central-1 || true
          echo R01_SIGNED_SNAPSHOT_COMPLETE
