name: Redteam Coordinator One-Shot Patch

on:
  push:
    branches:
      - redteam/execution-coordinator-final-current-master

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[redteam-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: redteam/execution-coordinator-final-current-master
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact lint repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('services/execution_coordinator.py')
          text = path.read_text(encoding='utf-8')
          old = '''from services.integrations.product_runtime import (\n    DurableVideoProductRuntime,\n    ProductFinalizationPending,\n    ProductRuntimeError,\n)'''
          new = '''from services.integrations.product_runtime import (\n    DurableVideoProductRuntime,\n    ProductFinalizationPending,\n)'''
          if old not in text:
              raise SystemExit('expected ProductRuntimeError import block not found')
          updated = text.replace(old, new, 1)
          if updated.count('ProductRuntimeError') != 0:
              raise SystemExit('unexpected ProductRuntimeError reference remains')
          path.write_text(updated, encoding='utf-8')
          PY
          rm .github/workflows/redteam-coordinator-self-patch.yml
          git config user.name 'ILAIOS Redteam Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add services/execution_coordinator.py .github/workflows/redteam-coordinator-self-patch.yml
          git diff --cached --check
          git commit -m 'fix: remove stale coordinator runtime error import [redteam-patch]'
          git push origin HEAD:redteam/execution-coordinator-final-current-master
