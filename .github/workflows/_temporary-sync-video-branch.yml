name: Temporary Sync Video Branch

on:
  push:
    branches:
      - fix/video-factory-provider-runtime

permissions:
  contents: write

jobs:
  sync:
    if: github.actor == 'Aliturgutt'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout video branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/video-factory-provider-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest master without fabricating resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ali Turgut'
          git config user.email '98952443+Aliturgutt@users.noreply.github.com'
          git fetch origin master
          if ! git merge --no-edit origin/master; then
            echo 'MERGE_CONFLICTS_BEGIN'
            git diff --name-only --diff-filter=U
            echo 'MERGE_CONFLICTS_END'
            exit 1
          fi
          git push origin HEAD:fix/video-factory-provider-runtime
