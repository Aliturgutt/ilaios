name: Desktop Combined Final Artifact

on:
  push:
    branches:
      - ux/desktop-typography-reference-final-20260819
    paths:
      - 'tools/desktop/apply_combined_typography_reference_patch.py'
      - '.github/workflows/desktop-combined-final-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-combined-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-verify-package:
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Flutter SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flutter = Join-Path $env:RUNNER_TEMP 'flutter'
          git init $flutter
          git -C $flutter remote add origin https://github.com/flutter/flutter.git
          git -C $flutter fetch --depth 1 origin refs/tags/3.44.9:refs/tags/3.44.9
          git -C $flutter checkout --detach 3.44.9
          $resolved = (git -C $flutter rev-parse HEAD).Trim()
          if ($resolved -ne '6b182d2c7585eba26d4edce0f97630effd256c33') {
            throw "Flutter 3.44.9 resolved to unexpected revision: $resolved"
          }
          (Join-Path $flutter 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Apply fail-closed Desktop combined patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/desktop/apply_combined_typography_reference_patch.py .
          if ($LASTEXITCODE -ne 0) { throw "Combined patch failed with exit $LASTEXITCODE" }

      - name: Format patched Dart files
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:RUNNER_TEMP 'reference_desktop_shell_v10.baseline.dart'
          git show HEAD:apps/desktop/lib/features/dashboard/reference_desktop_shell_v10.dart |
            Out-File -FilePath $baseline -Encoding utf8
          dart format `
            $baseline `
            lib/features/dashboard/reference_desktop_shell_v10.dart `
            lib/features/deliveries/deliveries_view.dart `
            lib/app/desktop_app.dart `
            lib/features/create/create_view.dart `
            lib/features/create/reference_asset_picker_core.dart `
            lib/identity/identity_client.dart `
            lib/reference_assets/reference_factory_target.dart `
            lib/reference_assets/reference_asset_ui_scope.dart `
            test/desktop_combined_typography_reference_ux_test.dart
          if ($LASTEXITCODE -ne 0) { throw "dart format failed with exit $LASTEXITCODE" }

      - name: Guard scope and protected shell geometry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

          $expected = @(
            'apps/desktop/lib/features/dashboard/reference_desktop_shell_v10.dart',
            'apps/desktop/lib/features/deliveries/deliveries_view.dart',
            'apps/desktop/lib/app/desktop_app.dart',
            'apps/desktop/lib/features/create/create_view.dart',
            'apps/desktop/lib/features/create/reference_asset_picker_core.dart',
            'apps/desktop/lib/identity/identity_client.dart',
            'apps/desktop/lib/reference_assets/reference_factory_target.dart',
            'apps/desktop/lib/reference_assets/reference_asset_ui_scope.dart',
            'apps/desktop/test/desktop_combined_typography_reference_ux_test.dart'
          )
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $expected })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected patched files: $($unexpected -join ', ')"
          }
          foreach ($path in $expected) {
            if ($path -notin $changed) { throw "Expected patched file missing: $path" }
          }

          python tools/desktop/check_protected_shell_geometry.py `
            (Join-Path $env:RUNNER_TEMP 'reference_desktop_shell_v10.baseline.dart') `
            apps/desktop/lib/features/dashboard/reference_desktop_shell_v10.dart
          if ($LASTEXITCODE -ne 0) { throw 'Protected shell geometry changed' }
          git diff --binary | Out-File -Encoding utf8 desktop-combined-ci.patch

      - name: Resolve locked dependencies
        working-directory: apps/desktop
        shell: pwsh
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        working-directory: apps/desktop
        shell: pwsh
        run: flutter analyze

      - name: Required typography and reference UX viewport tests
        working-directory: apps/desktop
        shell: pwsh
        run: flutter test test/desktop_combined_typography_reference_ux_test.dart

      - name: Full Desktop tests
        working-directory: apps/desktop
        shell: pwsh
        run: flutter test

      - name: Windows release build
        working-directory: apps/desktop
        shell: pwsh
        run: flutter build windows --release

      - name: Build bundled control plane sidecar
        working-directory: apps/desktop
        shell: pwsh
        run: ./tool/build_control_plane_sidecar.ps1

      - name: Verify release executable and sidecar
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path (Get-Location) 'build\windows\x64\runner\Release'
          $exe = Join-Path $release 'ilaios_desktop.exe'
          $sidecar = Join-Path $release 'ilaios_control_plane.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Release executable missing: $exe" }
          if (-not (Test-Path $sidecar -PathType Leaf)) { throw "Sidecar missing: $sidecar" }
          if ((Get-Item $exe).Length -le 0) { throw 'Release executable is empty' }
          if ((Get-Item $sidecar).Length -le 0) { throw 'Sidecar is empty' }
          $version = (Get-Item $exe).VersionInfo
          if ($version.ProductName -ne 'ILAIOS Desktop') { throw "Unexpected ProductName: $($version.ProductName)" }
          if ($version.CompanyName -ne 'ILAIOS') { throw "Unexpected CompanyName: $($version.CompanyName)" }
          Write-Host 'ILAIOS_DESKTOP_COMBINED_WINDOWS_BUILD=PASS'

      - name: Package CI-verified portable runtime and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\build\windows\x64\runner\Release'
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\desktop-combined-final'
          $runtime = Join-Path $artifactRoot 'runtime'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Copy-Item (Join-Path $release '*') $runtime -Recurse -Force

          $installer = @'
          [CmdletBinding()]
          param([switch]$NoLaunch)

          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Fail([string]$Message) {
            throw "ILAIOS_DESKTOP_CI_INSTALL_BLOCKED: $Message"
          }

          function New-Shortcut {
            param([string]$ShortcutPath,[string]$TargetPath,[string]$WorkingDirectory)
            $shell = New-Object -ComObject WScript.Shell
            $shortcut = $shell.CreateShortcut($ShortcutPath)
            $shortcut.TargetPath = $TargetPath
            $shortcut.WorkingDirectory = $WorkingDirectory
            $shortcut.Description = 'ILAIOS Desktop'
            $shortcut.IconLocation = "$TargetPath,0"
            $shortcut.Save()
          }

          $runtime = Join-Path $PSScriptRoot 'runtime'
          $sourceExe = Join-Path $runtime 'ilaios_desktop.exe'
          $sourceSidecar = Join-Path $runtime 'ilaios_control_plane.exe'
          if (-not (Test-Path $sourceExe -PathType Leaf)) { Fail "Runtime EXE missing: $sourceExe" }
          if (-not (Test-Path $sourceSidecar -PathType Leaf)) { Fail "Runtime sidecar missing: $sourceSidecar" }

          $installParent = Join-Path $env:LOCALAPPDATA 'Programs'
          $installRoot = Join-Path $installParent 'ILAIOS Desktop'
          $stage = Join-Path $installParent 'ILAIOS Desktop.__ci_verified_new'
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $backup = Join-Path $env:LOCALAPPDATA "ILAIOS\InstallBackups\desktop-ci-verified\$stamp\ILAIOS Desktop"

          Get-Process 'ilaios_desktop' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 700
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $runtime '*') $stage -Recurse -Force

          if (Test-Path $installRoot) {
            New-Item -ItemType Directory -Force -Path (Split-Path $backup -Parent) | Out-Null
            Move-Item $installRoot $backup
          }

          try {
            Move-Item $stage $installRoot
          } catch {
            if ((Test-Path $backup) -and -not (Test-Path $installRoot)) { Move-Item $backup $installRoot }
            throw
          }

          $installedExe = Join-Path $installRoot 'ilaios_desktop.exe'
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'ILAIOS Desktop.lnk'
          $startMenuDir = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\ILAIOS'
          New-Item -ItemType Directory -Force -Path $startMenuDir | Out-Null
          New-Shortcut -ShortcutPath $desktopShortcut -TargetPath $installedExe -WorkingDirectory $installRoot
          New-Shortcut -ShortcutPath (Join-Path $startMenuDir 'ILAIOS Desktop.lnk') -TargetPath $installedExe -WorkingDirectory $installRoot

          if (-not $NoLaunch) {
            try {
              $proc = Start-Process -FilePath $installedExe -WorkingDirectory $installRoot -PassThru
              Start-Sleep -Seconds 8
              $proc.Refresh()
              if ($proc.HasExited) { Fail "Installed Desktop exited during 8-second smoke. ExitCode=$($proc.ExitCode)" }
              Write-Host "RUNTIME_SMOKE=PROCESS_ALIVE_AFTER_8S"
            } catch {
              Get-Process 'ilaios_desktop' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
              if (Test-Path $backup) { Move-Item $backup $installRoot }
              throw
            }
          }

          Write-Host "INSTALL_ROOT=$installRoot"
          Write-Host 'ILAIOS_DESKTOP_CI_VERIFIED_LOCAL_INSTALL=PASS'
          '@
          $installer = $installer -replace '^          ', ''
          Set-Content -Path (Join-Path $artifactRoot 'INSTALL_ILAIOS_DESKTOP.ps1') -Value $installer -Encoding UTF8

          $sha = '${{ github.sha }}'
          $manifest = [ordered]@{
            status = 'CI_VERIFIED_WINDOWS_BUILD'
            source_sha = $sha
            run_id = '${{ github.run_id }}'
            flutter = '3.44.9 / 6b182d2c7585eba26d4edce0f97630effd256c33'
            viewport_tests = @('1366x768','1440x900','1920x1080')
            static_analysis = 'PASS'
            full_flutter_tests = 'PASS'
            windows_release_build = 'PASS'
            sidecar_build = 'PASS'
            local_runtime_smoke = 'PENDING_USER_MACHINE'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 (Join-Path $artifactRoot 'CI_EVIDENCE.json')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'desktop-combined-ci.patch') (Join-Path $artifactRoot 'desktop-combined-ci.patch')

          $hashes = Get-ChildItem $runtime -File -Recurse | Sort-Object FullName | ForEach-Object {

