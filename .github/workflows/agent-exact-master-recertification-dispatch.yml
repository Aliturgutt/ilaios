name: ILAIOS Agent Exact Master Recertification Dispatch

on:
  push:
    branches:
      - master

permissions:
  actions: write
  contents: read

concurrency:
  group: agent-exact-master-recertification-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch canonical exact-master Agent certification
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch incumbent canonical 46/47 certification
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json
          print(json.dumps({'ref': 'master'}))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/agent-automated-46-of-47-certification.yml/dispatches" \
            -d "$payload"
          echo "AGENT_EXACT_MASTER_RECERTIFICATION_DISPATCHED_FROM_PUSH_SHA=$PUSH_SHA"
