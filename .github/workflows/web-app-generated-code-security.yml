name: Web App Generated-Code Security Gate

on:
  pull_request:
    branches:
      - master
    paths:
      - 'services/web_app_generated_security_gate.py'
      - 'tests/test_web_app_generated_security_gate.py'
      - '.github/workflows/web-app-generated-code-security.yml'
  push:
    branches:
      - master
    paths:
      - 'services/web_app_generated_security_gate.py'
      - 'tests/test_web_app_generated_security_gate.py'
      - '.github/workflows/web-app-generated-code-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-app-generated-code-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-code-security:
    name: hostile generated product corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "WEB_APP_GENERATED_SECURITY_EXACT_HEAD=$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt
      - name: Install locked validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check
      - name: Run generated-code adversarial corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_web_app_generated_security_gate.py
      - name: Run strict static validation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check services/web_app_generated_security_gate.py tests/test_web_app_generated_security_gate.py
          python -m mypy --strict services/web_app_generated_security_gate.py tests/test_web_app_generated_security_gate.py
      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '## ILAIOS Web App Generated-Code Security Gate' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact head: \`${SOURCE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Verdict semantics: `PASS / FAIL / NOT_VERIFIED`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Covered hostile classes: XSS/script injection, SSRF, remote scripts, secrets, redirects, browser token storage, unsafe templates, path traversal, tenant escape, governance-bypass markers, package install hooks, CSP.' >> "$GITHUB_STEP_SUMMARY"
          echo '- This gate grants no runtime, credential, deployment, publish, Policy, Approval, Tool Gateway, tenant or Evidence authority.' >> "$GITHUB_STEP_SUMMARY"
