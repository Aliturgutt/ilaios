name: Documentation canonical status truth sync (temporary)

on:
  push:
    branches:
      - docs/canonical-status-truth-sync-20260903

permissions:
  contents: write

jobs:
  truth-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: docs/canonical-status-truth-sync-20260903
          fetch-depth: 0

      - name: Apply guarded documentation-only replacements
        shell: python
        run: |
          from pathlib import Path

          old_status = "**Status:** Canonical Baseline v1.0 — Pending Repository Publication"
          new_status = "**Status:** Canonical Baseline v1.0 — Published in Repository"

          status_files = []
          status_count = 0
          for path in sorted(Path(".").rglob("*.md")):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              count = text.count(old_status)
              if count:
                  status_count += count
                  status_files.append(str(path))
                  path.write_text(text.replace(old_status, new_status), encoding="utf-8")

          if status_count != 15:
              raise SystemExit(f"Expected exactly 15 canonical status replacements, observed {status_count}: {status_files}")

          anchor_old = "Current truth-sync audit anchor: 3 September 2026, `master` HEAD `b93f20b36ac7c8d611e54023d38ffe78b22b14f4`"
          anchor_new = "Truth-sync audit anchor (3 September 2026): `master` HEAD `b93f20b36ac7c8d611e54023d38ffe78b22b14f4`"
          anchor_paths = [Path("PROJECT_STATUS.md"), Path("docs/governance/CAPABILITY_MATRIX.md")]

          anchor_count = 0
          for path in anchor_paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(anchor_old)
              anchor_count += count
              if count:
                  path.write_text(text.replace(anchor_old, anchor_new), encoding="utf-8")

          # The two anchor files may already have been corrected by earlier bounded commits.
          if anchor_count not in (0, 2):
              raise SystemExit(f"Expected 0 or 2 remaining anchor replacements, observed {anchor_count}")

          pending = []
          for path in sorted(Path(".").rglob("*.md")):
              if ".git" in path.parts:
                  continue
              if old_status in path.read_text(encoding="utf-8"):
                  pending.append(str(path))
          if pending:
              raise SystemExit(f"Stale Pending Repository Publication labels remain: {pending}")

          print(f"status replacements: {status_count}")
          print(f"status files: {status_files}")
          print(f"anchor replacements in this run: {anchor_count}")

      - name: Remove temporary workflow from final branch diff
        run: git rm .github/workflows/docs-canonical-status-truth-sync-temp.yml

      - name: Verify only intended documentation paths changed
        shell: python
        run: |
          import subprocess
          allowed = {
              "PROJECT_STATUS.md",
              "docs/governance/CAPABILITY_MATRIX.md",
              "docs/canonical/SYSTEM_ARCHITECTURE.md",
              "docs/canonical/API_CONTRACTS.md",
              "docs/canonical/DEPENDENCY_GRAPH.md",
              "docs/canonical/IMPLEMENTATION_SPEC.md",
              "docs/canonical/DATA_ARCHITECTURE.md",
              "docs/canonical/PRODUCT_REQUIREMENTS.md",
              "docs/canonical/SECURITY_ARCHITECTURE.md",
              "docs/canonical/TESTING_AND_EVALUATION.md",
              "docs/canonical/DEPLOYMENT_ARCHITECTURE.md",
              "docs/governance/GOVERNANCE.md",
              "docs/operations/FINOPS.md",
              "docs/operations/FAILURE_RECOVERY.md",
              "docs/security/THREAT_MODEL.md",
              "docs/operations/OBSERVABILITY.md",
              "docs/governance/ENGINEERING_STANDARDS.md",
              ".github/workflows/docs-canonical-status-truth-sync-temp.yml",
          }
          changed = set(subprocess.check_output(["git", "status", "--short"], text=True).splitlines())
          paths = {line[3:] for line in changed}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit(f"Unexpected changed paths: {unexpected}")
          print("changed paths:", sorted(paths))

      - name: Commit documentation truth sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md docs
          git commit -m "docs: publish canonical status metadata"
          git push origin HEAD:docs/canonical-status-truth-sync-20260903
