name: Agent Mypy Diagnostics

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  mypy-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install locked validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Capture exact pre-commit mypy output
        shell: bash
        run: |
          set +e
          mapfile -d '' files < <(git ls-files -z -- \
            src services packages tests docs/governance docs/migration \
            pyproject.toml .pre-commit-config.yaml .github/requirements \
            .github/workflows/platform-ci.yml .github/workflows/required-ci-gate.yml \
            .github/workflows/website-ci.yml)
          pre-commit run mypy --files "${files[@]}" > agent-mypy-output.txt 2>&1
          status=$?
          printf 'mypy_exit_code=%s\n' "$status" > agent-mypy-status.txt
          cat agent-mypy-output.txt
          exit 0

      - name: Upload mypy diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-mypy-diagnostics
          path: |
            agent-mypy-output.txt
            agent-mypy-status.txt
          if-no-files-found: error
          retention-days: 1
