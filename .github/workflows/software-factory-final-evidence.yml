name: Software Factory Final Evidence

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: software-factory-final-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  final-evidence:
    name: Observed final evidence reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconcile observed SF-0 through SF-31 evidence
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$PR_BASE_SHA"
          head="$PR_HEAD_SHA"
          if [[ -z "$base" || -z "$head" ]]; then
            head="$(git rev-parse HEAD)"
            base="$(git rev-parse HEAD^)"
          fi

          python -m services.software_factory_final_evidence_runner \
            --repository-root . \
            --manifest evidence/software_factory/final_evidence.json \
            --base-sha "$base" \
            --head-sha "$head"
