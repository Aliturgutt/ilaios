name: Desktop Approvals Bounded Repair

on:
  push:
    branches:
      - desktop/approvals-functional-closure

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop/approvals-functional-closure
          fetch-depth: 0
      - name: Apply fail-closed Approvals repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/desktop/lib/features/operations/approvals_view.dart')
          text = path.read_text()

          old = """          _TinyAction(\n            icon: Icons.shield_outlined,\n            label: _copy(context, 'Politika Kuralları', 'Policy Rules'),\n            prominent: true,\n          ),"""
          new = """          _TinyAction(\n            icon: Icons.shield_outlined,\n            label: _copy(context, 'Politika Kuralları', 'Policy Rules'),\n          ),"""
          if old not in text:
              raise SystemExit('Policy Rules prominent pattern not found')
          text = text.replace(old, new, 1)

          old = """  @override\n  Widget build(BuildContext context) => Material(\n        color: prominent\n            ? IlaiosTheme.coreBlue\n            : Theme.of(context).colorScheme.surfaceContainerLowest,\n        shape: RoundedRectangleBorder(\n          borderRadius: BorderRadius.circular(5),\n          side: BorderSide(\n            color: prominent\n                ? IlaiosTheme.coreBlue\n                : Theme.of(context).colorScheme.outlineVariant,\n          ),\n        ),\n        clipBehavior: Clip.antiAlias,\n        child: InkWell(\n          onTap: onTap,\n          child: Padding(\n            padding: const EdgeInsets.symmetric(horizontal: 10),\n            child: Row(\n              children: [\n                Icon(\n                  icon,\n                  size: 14,\n                  color: prominent\n                      ? Colors.white\n                      : Theme.of(context).colorScheme.onSurfaceVariant,\n                ),\n                const SizedBox(width: 5),\n                Text(\n                  label,\n                  style: TextStyle(\n                    fontSize: 8.5,\n                    fontWeight: FontWeight.w600,\n                    color: prominent ? Colors.white : null,\n                  ),\n                ),\n              ],\n            ),\n          ),\n        ),\n      );"""
          new = """  @override\n  Widget build(BuildContext context) {\n    final enabled = onTap != null;\n    final effectiveProminent = prominent && enabled;\n    final child = Material(\n      color: effectiveProminent\n          ? IlaiosTheme.coreBlue\n          : Theme.of(context).colorScheme.surfaceContainerLowest,\n      shape: RoundedRectangleBorder(\n        borderRadius: BorderRadius.circular(5),\n        side: BorderSide(\n          color: effectiveProminent\n              ? IlaiosTheme.coreBlue\n              : Theme.of(context).colorScheme.outlineVariant,\n        ),\n      ),\n      clipBehavior: Clip.antiAlias,\n      child: InkWell(\n        onTap: onTap,\n        child: Padding(\n          padding: const EdgeInsets.symmetric(horizontal: 10),\n          child: Row(\n            children: [\n              Icon(\n                icon,\n                size: 14,\n                color: effectiveProminent\n                    ? Colors.white\n                    : Theme.of(context).colorScheme.onSurfaceVariant,\n              ),\n              const SizedBox(width: 5),\n              Text(\n                label,\n                style: TextStyle(\n                  fontSize: 8.5,\n                  fontWeight: FontWeight.w600,\n                  color: effectiveProminent ? Colors.white : null,\n                ),\n              ),\n            ],\n          ),\n        ),\n      ),\n    );\n    return Semantics(\n      enabled: enabled,\n      button: true,\n      child: enabled ? child : Opacity(opacity: .45, child: child),\n    );\n  }"""
          if old not in text:
              raise SystemExit('TinyAction implementation pattern not found')
          text = text.replace(old, new, 1)

          old = """                child: OutlinedButton(\n                  onPressed: () {},"""
          new = """                child: OutlinedButton(\n                  onPressed: null,"""
          if old not in text:
              raise SystemExit('View Details no-op pattern not found')
          text = text.replace(old, new, 1)

          old = """              const SizedBox(\n                width: 18,\n                child: Icon(Icons.more_vert, size: 13),\n              ),"""
          new = """              const SizedBox(width: 18),"""
          if old not in text:
              raise SystemExit('Row menu affordance pattern not found')
          text = text.replace(old, new, 1)

          old = """                const Spacer(),\n                const Icon(Icons.ios_share_outlined, size: 14),\n                const SizedBox(width: 12),\n                const Icon(Icons.keyboard_arrow_up_rounded, size: 16),"""
          new = """                const Spacer(),"""
          if old not in text:
              raise SystemExit('Selected-request icon affordance pattern not found')
          text = text.replace(old, new, 1)

          old = """    this.icon = Icons.keyboard_arrow_down_rounded,"""
          new = """    this.icon = Icons.block_outlined,"""
          if old not in text:
              raise SystemExit('Static filter affordance pattern not found')
          text = text.replace(old, new, 1)

          path.write_text(text)

          test = Path('apps/desktop/test/approvals_unavailable_controls_test.dart')
          test.write_text("""import 'package:flutter/material.dart';\nimport 'package:flutter_test/flutter_test.dart';\nimport 'package:ilaios_desktop/app/ilaios_theme.dart';\nimport 'package:ilaios_desktop/main.dart';\n\nvoid main() {\n  testWidgets('Approvals presentation-only controls fail closed', (tester) async {\n    await tester.binding.setSurfaceSize(const Size(1648, 928));\n    addTearDown(() => tester.binding.setSurfaceSize(null));\n\n    await tester.pumpWidget(const IlaiosDesktopApp());\n    await tester.pumpAndSettle();\n    await tester.tap(find.byKey(const ValueKey('nav-approvals')));\n    await tester.pumpAndSettle();\n\n    for (final label in <String>['Export', 'Policy Rules']) {\n      final textFinder = find.text(label);\n      expect(textFinder, findsOneWidget);\n      final inkFinder = find.ancestor(of: textFinder, matching: find.byType(InkWell));\n      expect(inkFinder, findsOneWidget);\n      expect(tester.widget<InkWell>(inkFinder).onTap, isNull);\n      final materialFinder = find.ancestor(of: textFinder, matching: find.byType(Material));\n      expect(materialFinder, findsOneWidget);\n      expect(tester.widget<Material>(materialFinder).color, isNot(IlaiosTheme.coreBlue));\n    }\n\n    final details = find.widgetWithText(OutlinedButton, 'View Details');\n    expect(details, findsOneWidget);\n    expect(tester.widget<OutlinedButton>(details).onPressed, isNull);\n    expect(find.byIcon(Icons.more_vert), findsNothing);\n    expect(tester.takeException(), isNull);\n  });\n}\n""")
      - name: Remove temporary repair workflow from candidate
        run: git rm .github/workflows/desktop-approvals-bounded-repair.yml
      - name: Commit bounded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/lib/features/operations/approvals_view.dart apps/desktop/test/approvals_unavailable_controls_test.dart
          git diff --cached --check
          git commit -m "desktop: fail closed Approvals no-op controls"
          git push origin HEAD:desktop/approvals-functional-closure
