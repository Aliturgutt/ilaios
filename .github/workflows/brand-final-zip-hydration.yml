name: Brand Final ZIP Hydration

on:
  push:
    branches:
      - brand/canonical-neutral-palette-20260902
    paths:
      - 'brand/source/ilaios-full-logo.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brand-final-zip-hydration
  cancel-in-progress: false

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: brand/canonical-neutral-palette-20260902
          fetch-depth: 0

      - name: Verify final archive and hydrate canonical assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import re
          import zipfile
          from pathlib import Path

          archive = Path('brand/source/ilaios-full-logo.zip')
          expected_file = Path('.brand-hydration/expected.sha256')
          manifest = Path('brand/manifest.yaml')

          if not archive.is_file():
              raise SystemExit('final source archive missing')

          expected: dict[str, str] = {}
          for raw in expected_file.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              digest, name = line.split(maxsplit=1)
              expected[name] = digest

          archive_expected = expected.get('ilaios-full-logo.zip')
          archive_actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if archive_actual != archive_expected:
              raise SystemExit(
                  f'final source archive SHA-256 mismatch: {archive_actual} != {archive_expected}'
              )

          targets = {
              '01': ('brand/assets/01-ilaios-brand-color-system.png', '.png', '1536x1024'),
              '02': ('brand/assets/02-ilaios-primary-horizontal-dark.jpg', '.jpg', '1536x1024'),
              '03': ('brand/assets/03-ilaios-symbol-dark.jpg', '.jpg', '1536x1024'),
              '04': ('brand/assets/04-ilaios-symbol-light.jpg', '.jpg', '1024x1024'),
              '05': ('brand/assets/05-ilaios-app-icon.jpg', '.jpg', '1024x1024'),
              '06': ('brand/assets/06-ilaios-favicon-master.jpg', '.jpg', '1024x1024'),
              '07': ('brand/assets/07-ilaios-linkedin-company-logo.jpg', '.jpg', '400x400'),
              '08': ('brand/assets/08-ilaios-linkedin-company-cover.jpg', '.jpg', '2048x341'),
              '09': ('brand/assets/09-ilaios-linkedin-personal-cover.jpg', '.jpg', '1584x396'),
              '10': ('brand/assets/10-ilaios-github-social-preview.jpg', '.jpg', '1280x640'),
              '11': ('brand/assets/11-ilaios-website-hero.jpg', '.jpg', '1920x1080'),
              '12': ('brand/assets/12-ilaios-official-brand-board.jpg', '.jpg', '1920x1280'),
              '13': ('brand/assets/13-ilaios-primary-horizontal-light.jpg', '.jpg', '2048x682'),
          }

          outer_bytes = archive.read_bytes()
          with zipfile.ZipFile(io.BytesIO(outer_bytes)) as outer:
              outer_zip_members = [n for n in outer.namelist() if n.lower().endswith('.zip')]
              for index, (target_path, extension, _dimensions) in targets.items():
                  matches = [
                      n for n in outer_zip_members
                      if Path(n).name.startswith(f'{index}-ilaios-')
                  ]
                  if len(matches) != 1:
                      raise SystemExit(
                          f'expected exactly one outer ZIP for {index}, found {matches}'
                      )
                  nested_bytes = outer.read(matches[0])
                  with zipfile.ZipFile(io.BytesIO(nested_bytes)) as nested:
                      image_members = [
                          n for n in nested.namelist()
                          if not n.endswith('/') and Path(n).suffix.lower() == extension
                      ]
                      if len(image_members) != 1:
                          raise SystemExit(
                              f'expected exactly one {extension} in {matches[0]}, found {image_members}'
                          )
                      payload = nested.read(image_members[0])

                  expected_name = Path(target_path).name
                  wanted = expected.get(expected_name)
                  if wanted is None:
                      raise SystemExit(f'missing expected SHA-256 for {expected_name}')
                  actual = hashlib.sha256(payload).hexdigest()
                  if actual != wanted:
                      raise SystemExit(
                          f'asset SHA-256 mismatch for {expected_name}: {actual} != {wanted}'
                      )
                  Path(target_path).write_bytes(payload)

          # Re-verify the bytes after writing to the repository worktree.
          for target_path, _extension, _dimensions in targets.values():
              path = Path(target_path)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              wanted = expected[path.name]
              if actual != wanted:
                  raise SystemExit(f'post-write SHA-256 mismatch for {path}')

          text = manifest.read_text(encoding='utf-8')
          dimension_updates = {
              'BRAND.COLOR_SYSTEM': '1536x1024',
              'BRAND.PRIMARY_HORIZONTAL_DARK': '1536x1024',
              'BRAND.SYMBOL_DARK': '1536x1024',
              'BRAND.SYMBOL_LIGHT': '1024x1024',
              'BRAND.APP_ICON': '1024x1024',
              'BRAND.FAVICON_MASTER': '1024x1024',
              'BRAND.LINKEDIN_COMPANY_LOGO': '400x400',
              'BRAND.LINKEDIN_COMPANY_COVER': '2048x341',
              'BRAND.LINKEDIN_PERSONAL_COVER': '1584x396',
              'BRAND.GITHUB_SOCIAL_PREVIEW': '1280x640',
              'BRAND.WEBSITE_HERO': '1920x1080',
              'BRAND.OFFICIAL_BRAND_BOARD': '1920x1280',
              'BRAND.PRIMARY_HORIZONTAL_LIGHT': '2048x682',
          }
          for asset_id, dimensions in dimension_updates.items():
              pattern = re.compile(
                  rf'(  - id: {re.escape(asset_id)}\n(?:    .*\n)*?    dimensions: )[^\n]+'
              )
              text, count = pattern.subn(rf'\g<1>{dimensions}', text, count=1)
              if count != 1:
                  raise SystemExit(f'could not update exactly one dimensions field for {asset_id}')
          manifest.write_text(text, encoding='utf-8')

          print('BRAND_FINAL_ZIP_HYDRATION_VALIDATION=PASS')
          PY

      - name: Commit only verified hydrated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand/assets brand/manifest.yaml
          git diff --cached --check

          changed="$(git diff --cached --name-only)"
          if [ -z "$changed" ]; then
            echo 'No hydration changes detected.' >&2
            exit 20
          fi
          while IFS= read -r path; do
            case "$path" in
              brand/assets/01-ilaios-brand-color-system.png|\
              brand/assets/02-ilaios-primary-horizontal-dark.jpg|\
              brand/assets/03-ilaios-symbol-dark.jpg|\
              brand/assets/04-ilaios-symbol-light.jpg|\
              brand/assets/05-ilaios-app-icon.jpg|\
              brand/assets/06-ilaios-favicon-master.jpg|\
              brand/assets/07-ilaios-linkedin-company-logo.jpg|\
              brand/assets/08-ilaios-linkedin-company-cover.jpg|\
              brand/assets/09-ilaios-linkedin-personal-cover.jpg|\
              brand/assets/10-ilaios-github-social-preview.jpg|\
              brand/assets/11-ilaios-website-hero.jpg|\
              brand/assets/12-ilaios-official-brand-board.jpg|\
              brand/assets/13-ilaios-primary-horizontal-light.jpg|\
              brand/manifest.yaml) ;;
              *) echo "Unexpected hydrated path: $path" >&2; exit 21 ;;
            esac
          done <<< "$changed"

          git diff --cached --name-only | grep -Fx 'brand/assets/05-ilaios-app-icon.jpg' >/dev/null
          git diff --cached --name-only | grep -Fx 'brand/assets/13-ilaios-primary-horizontal-light.jpg' >/dev/null

          git commit -m 'fix(brand): hydrate final canonical package bytes'
          git push origin HEAD:brand/canonical-neutral-palette-20260902
