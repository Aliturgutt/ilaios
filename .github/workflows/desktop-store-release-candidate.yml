name: ILAIOS Desktop Store Release Candidate

on:
  workflow_dispatch:
    inputs:
      expected_master_sha:
        description: Exact current master SHA approved for the Store release candidate
        required: true
        type: string
      identity_name:
        description: Partner Center Package/Identity/Name value
        required: true
        default: 'ILAIOS.ILAIOS'
        type: string
      publisher:
        description: Partner Center Package/Identity/Publisher value
        required: true
        default: 'CN=3BC70952-5109-4720-9A71-8B812EBCB255'
        type: string
      version:
        description: Four-part Store package version
        required: true
        default: '0.1.0.1'
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-store-release-candidate
  cancel-in-progress: false

jobs:
  store-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      EXPECTED_MASTER_SHA: ${{ inputs.expected_master_sha }}
      STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
      STORE_PUBLISHER: ${{ inputs.publisher }}
      STORE_PUBLISHER_DISPLAY_NAME: ILAIOS
      STORE_PACKAGE_FAMILY_NAME: ILAIOS.ILAIOS_h6qnrfjyv0cv4
      STORE_ID: 9P7787G6ZC5G
      STORE_VERSION: ${{ inputs.version }}

    steps:
      - name: Require exact current master dispatch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/master') {
            throw "Store release candidate must be dispatched from master; got $env:GITHUB_REF"
          }
          if ($env:EXPECTED_MASTER_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'expected_master_sha must be a lowercase 40-character commit SHA.'
          }
          if ($env:GITHUB_SHA -ne $env:EXPECTED_MASTER_SHA) {
            throw "Dispatched SHA $env:GITHUB_SHA does not match approved SHA $env:EXPECTED_MASTER_SHA"
          }
          if ($env:STORE_IDENTITY_NAME -ne 'ILAIOS.ILAIOS') {
            throw "Store identity mismatch. Expected ILAIOS.ILAIOS, got $env:STORE_IDENTITY_NAME"
          }
          if ($env:STORE_PUBLISHER -ne 'CN=3BC70952-5109-4720-9A71-8B812EBCB255') {
            throw "Store publisher mismatch. Partner Center authority value is required."
          }
          if ($env:STORE_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw 'version must contain four numeric components.'
          }

      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_master_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify approved SHA is still current master
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin master --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch origin/master.' }
          $masterSha = (git rev-parse origin/master).Trim()
          $headSha = (git rev-parse HEAD).Trim()
          if ($headSha -ne $env:EXPECTED_MASTER_SHA) {
            throw "Checked out SHA $headSha does not match approved SHA $env:EXPECTED_MASTER_SHA"
          }
          if ($masterSha -ne $env:EXPECTED_MASTER_SHA) {
            throw "master moved to $masterSha after approval; re-run release qualification on the new master."
          }
          Write-Host "ILAIOS_DESKTOP_STORE_SOURCE_SHA=$headSha"

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve locked dependencies
        working-directory: apps/desktop
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        working-directory: apps/desktop
        run: flutter analyze

      - name: Desktop tests
        working-directory: apps/desktop
        run: flutter test

      - name: Build Windows release
        working-directory: apps/desktop
        run: flutter build windows --release

      - name: Build bundled control plane
        working-directory: apps/desktop
        shell: pwsh
        run: ./tool/build_control_plane_sidecar.ps1

      - name: Build fail-closed Store MSIX
        working-directory: apps/desktop
        shell: pwsh
        run: |
          ./tool/build_store_msix.ps1 `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER `
            -Version $env:STORE_VERSION

      - name: Bind source and Partner Center identity into release evidence
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'build\msix\store-release-evidence.json'
          if (-not (Test-Path $path)) { throw 'Store release evidence is missing.' }
          $evidence = Get-Content $path -Raw | ConvertFrom-Json
          $evidence | Add-Member -NotePropertyName source_sha -NotePropertyValue $env:EXPECTED_MASTER_SHA -Force
          $evidence | Add-Member -NotePropertyName github_run_id -NotePropertyValue $env:GITHUB_RUN_ID -Force
          $evidence | Add-Member -NotePropertyName publisher_display_name -NotePropertyValue $env:STORE_PUBLISHER_DISPLAY_NAME -Force
          $evidence | Add-Member -NotePropertyName package_family_name -NotePropertyValue $env:STORE_PACKAGE_FAMILY_NAME -Force
          $evidence | Add-Member -NotePropertyName store_id -NotePropertyValue $env:STORE_ID -Force
          $evidence | Add-Member -NotePropertyName submission_authority -NotePropertyValue 'human.owner via Partner Center' -Force
          $evidence | Add-Member -NotePropertyName submission_state -NotePropertyValue 'BLOCKED_EXTERNAL' -Force
          $evidence | Add-Member -NotePropertyName publication_state -NotePropertyValue 'BLOCKED_EXTERNAL' -Force
          $evidence | Add-Member -NotePropertyName lifecycle_acceptance -NotePropertyValue ([ordered]@{
            store_install = 'BLOCKED_EXTERNAL'
            update = 'BLOCKED_EXTERNAL'
            rollback = 'BLOCKED_EXTERNAL'
            uninstall = 'BLOCKED_EXTERNAL'
            human_device_acceptance_required = $true
          }) -Force
          $evidence | ConvertTo-Json -Depth 6 | Set-Content -Path $path -Encoding utf8
          Get-Content $path

      - name: Validate Store lifecycle acceptance boundary
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'build\msix\store-release-evidence.json'
          $evidence = Get-Content $path -Raw | ConvertFrom-Json
          if ($evidence.source_sha -ne $env:EXPECTED_MASTER_SHA) { throw 'Store source SHA evidence drifted.' }
          if ($evidence.submission_authority -ne 'human.owner via Partner Center') { throw 'Store submission authority drifted.' }
          if ($evidence.submission_state -ne 'BLOCKED_EXTERNAL') { throw 'Store submission must remain externally blocked before human action.' }
          if ($evidence.publication_state -ne 'BLOCKED_EXTERNAL') { throw 'Store publication must remain externally blocked before Microsoft certification.' }
          foreach ($field in @('store_install', 'update', 'rollback', 'uninstall')) {
            if ($evidence.lifecycle_acceptance.$field -ne 'BLOCKED_EXTERNAL') {
              throw "Store lifecycle acceptance field '$field' must remain BLOCKED_EXTERNAL before real Store/device evidence."
            }
          }
          if ($evidence.lifecycle_acceptance.human_device_acceptance_required -ne $true) {
            throw 'Store lifecycle contract must require genuine human/device acceptance.'
          }
          Write-Host 'ILAIOS_DESKTOP_STORE_LIFECYCLE_CONTRACT=PASS'

      - name: Upload Store release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ilaios-desktop-store-rc-${{ inputs.version }}-${{ inputs.expected_master_sha }}
          path: |
            apps/desktop/build/msix/*-store.msix
            apps/desktop/build/msix/store-release-evidence.json
          if-no-files-found: error
          retention-days: 30
