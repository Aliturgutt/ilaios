name: REDTEAM IndependentVerifier Diagnostic

on:
  pull_request:
    branches:
      - master
    paths:
      - 'services/independent_verifier_execution.py'
      - 'tests/test_independent_verifier_tool_evidence.py'
      - '.github/workflows/_redteam-independent-verifier-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: redteam-independent-verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Run exact governed-tool verifier test with JUnit output
        id: pytest
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p artifacts/redteam-independent-verifier
          python -m pytest -vv --tb=long \
            --junitxml=artifacts/redteam-independent-verifier/junit.xml \
            tests/test_independent_verifier_tool_evidence.py

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redteam-independent-verifier-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: artifacts/redteam-independent-verifier/junit.xml
          if-no-files-found: error
          retention-days: 7

      - name: Fail if verifier test failed
        if: steps.pytest.outcome != 'success'
        run: exit 1
