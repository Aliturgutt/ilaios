name: Security Lifecycle Continuous Operations

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/security-lifecycle-operations.yml'
      - 'security/semgrep-security.yml'
      - 'services/security_*.py'
      - 'tests/test_security_*.py'

permissions:
  contents: read

concurrency:
  group: security-lifecycle-continuous-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-vulnerability-reverification:
    name: S5 dependency vulnerability re-verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan supported locked dependency ecosystems
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --recursive
            --format=json
            --output=osv-results.json
            ./

      - name: Upload dependency vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-lifecycle-dependencies-${{ github.sha }}-${{ github.run_id }}
          path: osv-results.json
          if-no-files-found: warn
          retention-days: 30

  full-history-secret-scan:
    name: S5 full repository history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete immutable history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Scan complete repository history without disclosing values
        run: |
          set -euo pipefail
          python -m services.software_factory_secret_scanning \\
            --repository-root "$GITHUB_WORKSPACE" \\
            --history \\
            --head-sha "$GITHUB_SHA"

  provider-neutral-recovery-drills:
    name: S5 provider-neutral recovery and security drills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Execute bounded provider-neutral operational drills
        env:
          ILAIOS_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m services.operational_drills \
            --repository "$GITHUB_WORKSPACE" \
            --workspace artifacts/security-lifecycle-continuous
          test -f artifacts/security-lifecycle-continuous/operational-drills.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = json.loads(Path("artifacts/security-lifecycle-continuous/operational-drills.json").read_text())
          assert artifact["release_state"] == "NOT_DEPLOYED"
          assert all(item["passed"] is True for item in artifact["drills"].values())
          print(f"S5_PROVIDER_NEUTRAL_DRILLS=PASS source_sha={os.environ['ILAIOS_SOURCE_SHA']}")
          PY

      - name: Upload continuous-operation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-lifecycle-continuous-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/security-lifecycle-continuous
          if-no-files-found: warn
          retention-days: 30

  free-digital-security-suite:
    name: Free digital pentest suite (local-only)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SEMGREP_VERSION: "1.172.0"
      TRIVY_VERSION: "0.74.0"
      NUCLEI_VERSION: "3.11.1"
      ZAP_VERSION: "2.17.0"
      LOCAL_TARGET: "http://127.0.0.1:8765"
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prepare evidence workspace and local-only target
        run: |
          set -euo pipefail
          mkdir -p artifacts/security-free-digital local-security-target
          printf '<!doctype html><html><body><h1>ILAIOS local security probe</h1></body></html>\n' > local-security-target/index.html
          python -m http.server 8765 --bind 127.0.0.1 --directory local-security-target > artifacts/security-free-digital/local-server.log 2>&1 &
          echo $! > artifacts/security-free-digital/local-server.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$LOCAL_TARGET" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'local test target failed to start' >&2
          exit 1

      - name: Install pinned Semgrep
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "semgrep==$SEMGREP_VERSION"
          semgrep --version | tee artifacts/security-free-digital/semgrep-version.txt

      - name: Run Semgrep fail-closed repository scan
        run: |
          set -euo pipefail
          semgrep scan \
            --config security/semgrep-security.yml \
            --error \
            --json \
            --output artifacts/security-free-digital/semgrep.json \
            services src apps scripts

      - name: Install checksum-verified Trivy
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --location --retry 3 --output "$asset" "$base/$asset"
          curl --fail --location --retry 3 --output trivy-checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "  $asset$" trivy-checksums.txt | sha256sum --check
          tar -xzf "$asset" trivy
          ./trivy --version | tee artifacts/security-free-digital/trivy-version.txt

      - name: Run Trivy high-critical repository scan
        run: |
          set -euo pipefail
          ./trivy fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output artifacts/security-free-digital/trivy.json \
            .

      - name: Install checksum-verified Nuclei
        run: |
          set -euo pipefail
          asset="nuclei_${NUCLEI_VERSION}_linux_amd64.zip"
          base="https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}"
          curl --fail --location --retry 3 --output "$asset" "$base/$asset"
          curl --fail --location --retry 3 --output nuclei-checksums.txt "$base/nuclei_${NUCLEI_VERSION}_checksums.txt"
          grep "  $asset$" nuclei-checksums.txt | sha256sum --check
          unzip -q "$asset" nuclei
          chmod +x nuclei
          ./nuclei -version 2>&1 | tee artifacts/security-free-digital/nuclei-version.txt

      - name: Run Nuclei high-critical localhost scan
        run: |
          set -euo pipefail
          test "$LOCAL_TARGET" = "http://127.0.0.1:8765"
          : > artifacts/security-free-digital/nuclei.jsonl
          ./nuclei \
            -u "$LOCAL_TARGET" \
            -severity high,critical \
            -jsonl-export artifacts/security-free-digital/nuclei.jsonl \
            -disable-update-check

      - name: Run OWASP ZAP baseline against localhost only
        run: |
          set -euo pipefail
          test "$LOCAL_TARGET" = "http://127.0.0.1:8765"
          docker pull "ghcr.io/zaproxy/zaproxy:${ZAP_VERSION}"
          docker image inspect "ghcr.io/zaproxy/zaproxy:${ZAP_VERSION}" --format '{{json .RepoDigests}}' > artifacts/security-free-digital/zap-image-digest.json
          docker run --rm --network host \
            -v "$PWD/artifacts/security-free-digital:/zap/wrk/:rw" \
            "ghcr.io/zaproxy/zaproxy:${ZAP_VERSION}" \
            zap-baseline.py -t "$LOCAL_TARGET" -J zap.json -r zap.html -I

      - name: Retest local-only scope and evidence completeness
        run: |
          set -euo pipefail
          test "$LOCAL_TARGET" = "http://127.0.0.1:8765"
          curl --fail --silent --show-error "$LOCAL_TARGET" >/dev/null
          test -s artifacts/security-free-digital/semgrep.json
          test -s artifacts/security-free-digital/trivy.json
          test -f artifacts/security-free-digital/nuclei.jsonl
          test -s artifacts/security-free-digital/zap.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('artifacts/security-free-digital')
          receipt = {
              'source_sha': os.environ['GITHUB_SHA'],
              'scope': 'local-only',
              'target': os.environ['LOCAL_TARGET'],
              'provider_cost_usd': 0,
              'tools': {
                  'semgrep': os.environ['SEMGREP_VERSION'],
                  'trivy': os.environ['TRIVY_VERSION'],
                  'nuclei': os.environ['NUCLEI_VERSION'],
                  'zap': os.environ['ZAP_VERSION'],
              },
              'retest': 'PASS',
              'external_independent_pentest': 'UNVERIFIED',
          }
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print('FREE_DIGITAL_SECURITY_SUITE=PASS')
          PY

      - name: Upload free digital security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-free-digital-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/security-free-digital
          if-no-files-found: error
          retention-days: 30
