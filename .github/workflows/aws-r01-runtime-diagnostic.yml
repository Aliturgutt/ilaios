name: AWS R01 runtime diagnostic

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aws-r01-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1
      - name: Snapshot R01 runtime
        run: |
          set -uo pipefail
          echo '=== SERVICE ==='
          aws ecs describe-services --cluster ilaios-r01-canary --services ilaios-r01-canary --region eu-central-1 --query 'services[0].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,taskDefinition:taskDefinition,deployments:deployments[*].{id:id,status:status,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,taskDefinition:taskDefinition,desired:desiredCount,running:runningCount,pending:pendingCount,failed:failedTasks},events:events[0:15].message}' --output json || true
          echo '=== RUNNING TASKS ==='
          RUNNING="$(aws ecs list-tasks --cluster ilaios-r01-canary --service-name ilaios-r01-canary --desired-status RUNNING --region eu-central-1 --query 'taskArns' --output text 2>/dev/null || true)"
          if [ -n "$RUNNING" ]; then aws ecs describe-tasks --cluster ilaios-r01-canary --tasks $RUNNING --region eu-central-1 --query 'tasks[*].{task:taskArn,lastStatus:lastStatus,health:healthStatus,connectivity:connectivity,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[*].{name:name,status:lastStatus,health:healthStatus,exit:exitCode,reason:reason}}' --output json || true; fi
          echo '=== STOPPED TASKS ==='
          STOPPED="$(aws ecs list-tasks --cluster ilaios-r01-canary --service-name ilaios-r01-canary --desired-status STOPPED --region eu-central-1 --query 'taskArns[0:10]' --output text 2>/dev/null || true)"
          if [ -n "$STOPPED" ]; then aws ecs describe-tasks --cluster ilaios-r01-canary --tasks $STOPPED --region eu-central-1 --query 'tasks[*].{task:taskArn,taskDefinition:taskDefinition,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[*].{name:name,status:lastStatus,health:healthStatus,exit:exitCode,reason:reason}}' --output json || true; fi
          echo '=== TARGET HEALTH ==='
          TG="$(aws elbv2 describe-target-groups --names ilaios-r01-canary --region eu-central-1 --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)"
          if [ -n "$TG" ] && [ "$TG" != "None" ]; then aws elbv2 describe-target-health --target-group-arn "$TG" --region eu-central-1 --output json || true; fi
          echo '=== LOGS ==='
          aws logs tail '/ilaios/r01/canary/runtime' --since 20m --region eu-central-1 || true
          echo 'R01_DIAGNOSTIC_COMPLETE'
