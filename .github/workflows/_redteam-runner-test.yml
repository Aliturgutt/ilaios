name: Red-team Runner Test

on:
  push:
    branches:
      - redteam/ci-final-hardening
    paths:
      - '.github/workflows/_redteam-runner-test.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify runner
        run: echo ILAIOS_PUBLIC_STANDARD_RUNNER_OK
