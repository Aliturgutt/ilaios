name: AWS R01 discovery

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aws-r01-discovery.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1
      - name: Read-only R01 discovery
        run: |
          set -euo pipefail
          echo '=== CALLER ==='
          aws sts get-caller-identity
          echo '=== ACM ==='
          aws acm list-certificates --region eu-central-1 --certificate-statuses ISSUED || true
          echo '=== SECRETS ==='
          aws secretsmanager list-secrets --region eu-central-1 --query 'SecretList[].{Name:Name,ARN:ARN}' || true
          echo '=== ECR REPOSITORIES ==='
          aws ecr describe-repositories --region eu-central-1 --query 'repositories[].{Name:repositoryName,URI:repositoryUri}' || true
          echo '=== ECR IMAGES ==='
          aws ecr describe-images --region eu-central-1 --repository-name ilaios-r01-canary --query 'imageDetails[].{Digest:imageDigest,Tags:imageTags,Pushed:imagePushedAt}' || true
