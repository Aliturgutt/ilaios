name: ILAIOS Desktop Windows Gate

on:
  pull_request:
    branches:
      - master
    paths:
      - 'apps/desktop/**'
      - 'services/desktop_identity_server.py'
      - 'services/desktop_oidc.py'
      - 'services/desktop_oidc_threaded.py'
      - 'services/identity.py'
      - 'services/execution_coordinator.py'
      - 'services/governance/**'
      - 'services/integrations/**'
      - 'services/software_factory_runtime.py'
      - 'services/software_factory_secret_scanning.py'
      - 'src/video_automation/**'
      - 'brand/assets/05-ilaios-app-icon.jpg'
      - 'brand/assets/13-ilaios-primary-horizontal-light.jpg'
      - '.github/workflows/desktop-windows-release.yml'
  push:
    branches:
      - master
    paths:
      - 'apps/desktop/**'
      - 'services/desktop_identity_server.py'
      - 'services/desktop_oidc.py'
      - 'services/desktop_oidc_threaded.py'
      - 'services/identity.py'
      - 'services/execution_coordinator.py'
      - 'services/governance/**'
      - 'services/integrations/**'
      - 'services/software_factory_runtime.py'
      - 'services/software_factory_secret_scanning.py'
      - 'src/video_automation/**'
      - 'brand/assets/05-ilaios-app-icon.jpg'
      - 'brand/assets/13-ilaios-primary-horizontal-light.jpg'
      - '.github/workflows/desktop-windows-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    name: Flutter analyze, test, Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Flutter SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flutter = Join-Path $env:RUNNER_TEMP 'flutter'
          git init $flutter
          git -C $flutter remote add origin https://github.com/flutter/flutter.git
          git -C $flutter fetch --depth 1 origin refs/tags/3.44.9:refs/tags/3.44.9
          git -C $flutter checkout --detach 3.44.9
          $resolved = (git -C $flutter rev-parse HEAD).Trim()
          if ($resolved -ne '6b182d2c7585eba26d4edce0f97630effd256c33') {
            throw "Flutter 3.44.9 resolved to unexpected revision: $resolved"
          }
          (Join-Path $flutter 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install pinned FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg --version=7.1.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned FFmpeg install failed with exit code $LASTEXITCODE"
          }
          $ffmpeg = Get-Command ffmpeg -ErrorAction Stop
          $ffprobe = Get-Command ffprobe -ErrorAction Stop
          Write-Host "FFMPEG_PATH=$($ffmpeg.Source)"
          Write-Host "FFPROBE_PATH=$($ffprobe.Source)"

      - name: Verify toolchains
        shell: pwsh
        run: |
          flutter --version
          dart --version
          python --version
          ffmpeg -version
          ffprobe -version

      - name: Resolve locked dependencies
        working-directory: apps/desktop
        shell: pwsh
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        working-directory: apps/desktop
        shell: pwsh
        run: flutter analyze

      - name: Desktop tests
        working-directory: apps/desktop
        shell: pwsh
        run: flutter test

      - name: Windows release build
        working-directory: apps/desktop
        shell: pwsh
        run: flutter build windows --release

      - name: Verify canonical light and dark runtime branding
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path (Get-Location) 'build\windows\x64\runner\Release'
          $required = @(
            'brand\assets\05-ilaios-app-icon.jpg',
            'brand\assets\13-ilaios-primary-horizontal-light.jpg'
          )
          foreach ($relative in $required) {
            $path = Join-Path $release $relative
            if (-not (Test-Path $path)) {
              throw "Runtime brand asset missing: $relative"
            }
          }
          Write-Host 'ILAIOS_DESKTOP_CANONICAL_LIGHT_DARK_BRANDING=PASS'

      - name: Build bundled control plane
        working-directory: apps/desktop
        shell: pwsh
        run: ./tool/build_control_plane_sidecar.ps1

      - name: Prove terminal-independent packaged Desktop lifetime
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path (Get-Location) 'build\windows\x64\runner\Release'
          $exe = Join-Path $release 'ilaios_desktop.exe'
          $pidFile = Join-Path $env:RUNNER_TEMP 'ilaios-desktop-child.pid'
          $launcherScript = Join-Path $env:RUNNER_TEMP 'launch-ilaios-child.ps1'
          @"
          `$ErrorActionPreference = 'Stop'
          `$child = Start-Process -FilePath '$exe' -WorkingDirectory '$release' -PassThru
          Set-Content -Path '$pidFile' -Value `$child.Id -NoNewline
          "@ | Set-Content -Path $launcherScript -Encoding utf8

          $launcher = Start-Process -FilePath 'powershell.exe' -ArgumentList @(
            '-NoProfile',
            '-NonInteractive',
            '-ExecutionPolicy', 'Bypass',
            '-File', $launcherScript
          ) -PassThru
          $launcher.WaitForExit()
          if ($launcher.ExitCode -ne 0) {
            throw "Launch-parent PowerShell exited with $($launcher.ExitCode)"
          }
          if (-not (Test-Path $pidFile)) {
            throw 'Launch-parent did not publish Desktop PID'
          }

          $desktopPid = [int](Get-Content $pidFile -Raw)
          Start-Sleep -Seconds 8
          $desktop = Get-Process -Id $desktopPid -ErrorAction SilentlyContinue
          if ($null -eq $desktop -or $desktop.HasExited) {
            throw 'ILAIOS Desktop did not survive launch-parent PowerShell exit for 8 seconds'
          }
          $sidecars = Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq 'ilaios_control_plane.exe' -and
            $_.ExecutablePath -eq (Join-Path $release 'ilaios_control_plane.exe')
          }
          if (@($sidecars).Count -lt 1) {
            throw 'Bundled control plane did not remain healthy after launch-parent exit'
          }
          Write-Host 'ILAIOS_DESKTOP_SHELL_INDEPENDENCE=PASS'

          # GitHub-hosted Windows runners do not guarantee an interactive
          # window station, so CloseMainWindow can be unavailable even for a
          # healthy Flutter process. Attempt the real WM_CLOSE path when the
          # runner exposes it; otherwise (or if it cannot be delivered) prove
          # the independent crash/EOF cleanup path deterministically. The
          # Flutter test suite separately locks DesktopBootstrap.dispose() ->
          # DesktopRuntime.dispose() -> authenticated /v1/runtime/shutdown.
          # A real normal-window-close/no-orphan check remains mandatory in
          # final user-machine Windows acceptance.
          $desktop.Refresh()
          $normalCloseObserved = $false
          if ($desktop.MainWindowHandle -ne [IntPtr]::Zero) {
            [void]$desktop.CloseMainWindow()
            $normalCloseObserved = $desktop.WaitForExit(10000)
          }
          if ($normalCloseObserved) {
            Write-Host 'ILAIOS_DESKTOP_HOSTED_RUNNER_NORMAL_CLOSE=PASS'
          } else {
            Write-Host 'ILAIOS_DESKTOP_HOSTED_RUNNER_NORMAL_CLOSE=UNAVAILABLE'
            Stop-Process -Id $desktopPid -Force -ErrorAction Stop
            Start-Sleep -Milliseconds 250
            if (Get-Process -Id $desktopPid -ErrorAction SilentlyContinue) {
              throw 'ILAIOS Desktop could not be terminated for parent-pipe cleanup verification'
            }
          }

          $deadline = (Get-Date).AddSeconds(8)
          do {
            $remaining = @(Get-CimInstance Win32_Process | Where-Object {
              $_.Name -eq 'ilaios_control_plane.exe' -and
              $_.ExecutablePath -eq (Join-Path $release 'ilaios_control_plane.exe')
            })
            if ($remaining.Count -eq 0) { break }
            Start-Sleep -Milliseconds 250
          } while ((Get-Date) -lt $deadline)
          if ($remaining.Count -ne 0) {
            throw 'Bundled control plane remained orphaned after Desktop process exit'
          }
          if ($normalCloseObserved) {
            Write-Host 'ILAIOS_DESKTOP_BOUNDED_SIDECAR_SHUTDOWN=PASS'
          } else {
            Write-Host 'ILAIOS_DESKTOP_PARENT_PIPE_EXIT_CLEANUP=PASS'
          }

      - name: Packaged Desktop to control-plane E2E
        working-directory: apps/desktop
        shell: pwsh
        env:
          ILAIOS_E2E_SIDECAR_PATH: ${{ github.workspace }}\apps\desktop\build\windows\x64\runner\Release\ilaios_control_plane.exe
          ILAIOS_E2E_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: flutter test e2e/control_plane_e2e_test.dart

      - name: Real 20s finished-product video E2E with persisted evidence
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
          ILAIOS_VIDEO_E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/video-local-finished-product
          ILAIOS_VIDEO_E2E_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python apps/desktop/e2e/video_finished_product_artifact_e2e.py

      - name: Upload exact finished-product evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: video-local-finished-product-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: artifacts/video-local-finished-product
          if-no-files-found: error
          retention-days: 30

      - name: Real Software Factory finished-product E2E through canonical Coordinator
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
          ILAIOS_SOFTWARE_E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/software-local-finished-product
        run: python apps/desktop/e2e/software_finished_product_e2e.py

      - name: Upload exact Software finished-product evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: software-local-finished-product-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: artifacts/software-local-finished-product
          if-no-files-found: error
          retention-days: 30

      - name: Real App Factory Windows finished-product E2E through canonical Coordinator
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
          ILAIOS_APP_E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/app-windows-finished-product
          ILAIOS_APP_E2E_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python apps/desktop/e2e/app_finished_product_e2e.py

      - name: Upload exact App Windows finished-product evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-windows-finished-product-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: artifacts/app-windows-finished-product
          if-no-files-found: error
          retention-days: 30

      - name: Verify release executable metadata and sidecar
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path (Get-Location) 'build\windows\x64\runner\Release'
          $exe = Join-Path $release 'ilaios_desktop.exe'
          $sidecar = Join-Path $release 'ilaios_control_plane.exe'
          if (-not (Test-Path $exe)) { throw "Release executable not found: $exe" }
          if (-not (Test-Path $sidecar)) { throw "Bundled control plane not found: $sidecar" }
          $item = Get-Item $exe
          if ($item.Length -le 0) { throw 'Release executable is empty' }
          if ((Get-Item $sidecar).Length -le 0) { throw 'Bundled control plane is empty' }
          $version = $item.VersionInfo
          if ($version.ProductName -ne 'ILAIOS Desktop') {
            throw "Unexpected ProductName: $($version.ProductName)"
          }
          if ($version.CompanyName -ne 'ILAIOS') {
            throw "Unexpected CompanyName: $($version.CompanyName)"
          }
          Write-Host "ILAIOS_DESKTOP_WINDOWS_VALIDATION=PASS"

      - name: Upload exact portable Windows runtime
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ilaios-desktop-portable-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: apps/desktop/build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 30
