name: Web Generation Provenance Gate

on:
  pull_request:
    paths:
      - "services/web_generation_provenance_gate.py"
      - "tests/test_web_generation_provenance_gate.py"
      - ".github/workflows/web-generation-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run provenance regressions
        run: python -m pytest -q tests/test_web_generation_provenance_gate.py

      - name: Ruff
        run: python -m ruff check services/web_generation_provenance_gate.py tests/test_web_generation_provenance_gate.py

      - name: Strict mypy
        run: python -m mypy --strict services/web_generation_provenance_gate.py tests/test_web_generation_provenance_gate.py
