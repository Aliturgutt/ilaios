name: Web Generation Provenance Gate

on:
  pull_request:
    paths:
      - "services/web_generation_provenance_gate.py"
      - "tests/test_web_generation_provenance_gate.py"
      - ".github/workflows/web-generation-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked validation tools
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Run provenance regressions
        run: python -m pytest -q tests/test_web_generation_provenance_gate.py

      - name: Ruff
        run: python -m ruff check services/web_generation_provenance_gate.py tests/test_web_generation_provenance_gate.py

      - name: Strict mypy
        run: python -m mypy --strict services/web_generation_provenance_gate.py tests/test_web_generation_provenance_gate.py
