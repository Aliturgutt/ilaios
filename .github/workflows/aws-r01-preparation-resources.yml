name: AWS R01 preparation resources

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1
          audience: sts.amazonaws.com
      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity
      - name: Ensure ECR repository
        run: |
          set -euo pipefail
          if aws ecr describe-repositories --repository-names ilaios-r01-canary --region eu-central-1 >/dev/null 2>&1; then
            echo 'ECR_EXISTS'
          else
            aws ecr create-repository \
              --repository-name ilaios-r01-canary \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --region eu-central-1 \
              --query 'repository.{repositoryArn:repositoryArn,repositoryUri:repositoryUri}'
          fi
      - name: Ensure control-plane secret
        shell: bash
        run: |
          set -euo pipefail
          SECRET_NAME='ilaios/r01/canary/control-plane-token'
          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --region eu-central-1 >/dev/null 2>&1; then
            echo 'SECRET_EXISTS'
          else
            TOKEN="$(openssl rand -hex 32)"
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description 'ILAIOS RELEASE.R01 Canary control-plane bearer token' \
              --secret-string "$TOKEN" \
              --region eu-central-1 \
              --query '{ARN:ARN,Name:Name}'
            unset TOKEN
          fi
      - name: Ensure ACM certificate request
        run: |
          set -euo pipefail
          DOMAIN='canary.ilaios.com'
          CERT_ARN="$(aws acm list-certificates --region eu-central-1 --query "CertificateSummaryList[?DomainName=='$DOMAIN']|[0].CertificateArn" --output text)"
          if [ -z "$CERT_ARN" ] || [ "$CERT_ARN" = "None" ]; then
            CERT_ARN="$(aws acm request-certificate \
              --domain-name "$DOMAIN" \
              --validation-method DNS \
              --region eu-central-1 \
              --query CertificateArn \
              --output text)"
            echo "ACM_REQUESTED=$CERT_ARN"
          else
            echo "ACM_EXISTS=$CERT_ARN"
          fi
          for i in 1 2 3 4 5 6; do
            NAME="$(aws acm describe-certificate --certificate-arn "$CERT_ARN" --region eu-central-1 --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Name' --output text 2>/dev/null || true)"
            VALUE="$(aws acm describe-certificate --certificate-arn "$CERT_ARN" --region eu-central-1 --query 'Certificate.DomainValidationOptions[0].ResourceRecord.Value' --output text 2>/dev/null || true)"
            STATUS="$(aws acm describe-certificate --certificate-arn "$CERT_ARN" --region eu-central-1 --query 'Certificate.Status' --output text)"
            if [ "$NAME" != "None" ] && [ -n "$NAME" ]; then
              echo "ACM_CERTIFICATE_ARN=$CERT_ARN"
              echo "ACM_STATUS=$STATUS"
              echo "DNS_VALIDATION_NAME=$NAME"
              echo "DNS_VALIDATION_VALUE=$VALUE"
              exit 0
            fi
            sleep 5
          done
          echo "ACM_CERTIFICATE_ARN=$CERT_ARN"
          echo "ACM_STATUS=$STATUS"
          echo 'DNS validation record not yet available; rerun discovery.'
