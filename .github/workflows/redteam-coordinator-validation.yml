name: Redteam Coordinator Validation

on:
  push:
    branches:
      - redteam/execution-coordinator-final-current-master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: redteam/execution-coordinator-final-current-master
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt
      - name: Install locked validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check
      - name: Ruff coordinator scope
        run: |
          ruff check services/execution_coordinator.py services/execution_adapters.py services/integrations/web_product_runtime.py tests/test_execution_coordinator.py tests/test_execution_coordinator_hardening.py tests/test_execution_coordinator_multicap.py tests/test_web_execution_coordinator_current.py
      - name: Mypy coordinator scope
        run: |
          mypy --strict services/execution_coordinator.py services/execution_adapters.py services/integrations/web_product_runtime.py tests/test_execution_coordinator.py tests/test_execution_coordinator_hardening.py tests/test_execution_coordinator_multicap.py tests/test_web_execution_coordinator_current.py
      - name: Coordinator pytest scope
        run: |
          python -m pytest -q tests/test_execution_coordinator.py tests/test_execution_coordinator_hardening.py tests/test_execution_coordinator_multicap.py tests/test_web_execution_coordinator_current.py
