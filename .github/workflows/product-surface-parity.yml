name: Product Surface Parity Gate

on:
  pull_request:
    paths:
      - 'contracts/product_surface_contract.json'
      - 'scripts/validate_product_surface_contract.py'
      - 'tests/test_product_surface_contract.py'
      - 'skills/ilaios-product-surface-integration/**'
      - 'services/agent_readiness.py'
      - 'services/agent_registry.py'
      - 'apps/website/app/**'
      - 'apps/desktop/**'
      - 'docs/canonical/SYSTEM_ARCHITECTURE.md'
  push:
    branches: [master]
    paths:
      - 'contracts/product_surface_contract.json'
      - 'scripts/validate_product_surface_contract.py'
      - 'tests/test_product_surface_contract.py'
      - 'skills/ilaios-product-surface-integration/**'
      - 'services/agent_readiness.py'
      - 'services/agent_registry.py'
      - 'apps/website/app/**'
      - 'apps/desktop/**'
      - 'docs/canonical/SYSTEM_ARCHITECTURE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Contract and authority parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt
      - name: Install locked project test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check
      - name: Validate product surface contract
        run: python scripts/validate_product_surface_contract.py
      - name: Run product surface parity tests
        run: python -m pytest -q tests/test_product_surface_contract.py
