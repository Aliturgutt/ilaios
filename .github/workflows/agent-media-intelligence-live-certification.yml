name: ILAIOS Agent Media Intelligence Live Certification
# Publish exact-SHA certification status so trusted-master evidence remains discoverable.

on:
  push:
    branches:
      - master
    paths:
      - 'services/agent_provider_capabilities.py'
      - 'services/independent_verifier_execution.py'
      - 'services/media_intelligence_agent_execution.py'
      - 'services/media_intelligence_agent_live_certification.py'
      - 'services/media_intelligence_agent_runtime.py'
      - 'services/media_intelligence_agent_skill_catalog.py'
      - 'services/openrouter_agent_catalog.py'
      - '.github/workflows/agent-media-intelligence-live-certification.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: agent-media-intelligence-live-certification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  certify:
    name: Trusted master Media 8 + Intelligence 4 certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    env:
      SOURCE_SHA: ${{ github.sha }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout exact trusted master SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert trusted master source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git switch -c ilaios-media-intelligence-cert-ci
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git branch --show-current)" = 'ilaios-media-intelligence-cert-ci'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Run Media and Intelligence certification regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_media_intelligence_agent_live_certification.py \
            tests/test_media_intelligence_agent_execution.py \
            tests/test_media_intelligence_agent_runtime.py \
            tests/test_media_intelligence_agent_skill_catalog.py \
            tests/test_openrouter_media_intelligence_capabilities.py \
            tests/test_agent_provider_capabilities.py

      - name: Run Media and Intelligence certification static quality
        run: |
          python -m ruff check \
            services/media_intelligence_agent_live_certification.py \
            tests/test_media_intelligence_agent_live_certification.py
          python -m mypy --strict \
            services/media_intelligence_agent_live_certification.py \
            tests/test_media_intelligence_agent_live_certification.py

      - name: Execute twelve governed zero-cost Media and Intelligence agents
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
          MEDIA_INTELLIGENCE_AGENT_PROOF_DIR: ${{ github.workspace }}/artifacts/media-intelligence-agent-live-proof
        run: python -m services.media_intelligence_agent_live_certification

      - name: Validate immutable Media and Intelligence 12/12 receipt
        env:
          RECEIPT: ${{ github.workspace }}/artifacts/media-intelligence-agent-live-proof/media-intelligence-agent-live-receipt.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["RECEIPT"]).read_text(encoding="utf-8"))
          expected = os.environ["SOURCE_SHA"]
          if receipt.get("status") != "VERIFIED":
              raise SystemExit("Media/Intelligence receipt status is not VERIFIED")
          if receipt.get("revision_sha") != expected:
              raise SystemExit("Media/Intelligence receipt SHA drifted")
          if receipt.get("target_agent_count") != 12 or receipt.get("verified_agent_count") != 12:
              raise SystemExit("Media/Intelligence receipt is not 12/12")
          if receipt.get("media_agent_count") != 8 or receipt.get("intelligence_agent_count") != 4:
              raise SystemExit("Media/Intelligence population drifted")
          if receipt.get("governed_ai_agent_count") != 12:
              raise SystemExit("Media/Intelligence governed-AI count drifted")
          if receipt.get("governed_ai_zero_cost_openrouter_only") is not True:
              raise SystemExit("Media/Intelligence zero-cost proof failed")
          if any(
              receipt.get(key) is not False
              for key in (
                  "direct_network_authority",
                  "direct_media_side_effect_authority",
                  "direct_publish_authority",
              )
          ):
              raise SystemExit("Media/Intelligence side-effect authority widened")
          agents = receipt.get("agents")
          if not isinstance(agents, list) or len(agents) != 12:
              raise SystemExit("Media/Intelligence agent receipt population drifted")
          if any(item.get("readiness") != "verified" for item in agents):
              raise SystemExit("Media/Intelligence readiness proof failed")
          if any(item.get("execution_mode") != "governed-ai" for item in agents):
              raise SystemExit("Media/Intelligence execution mode drifted")
          if any(item.get("actual_cost_usd") != "0" for item in agents):
              raise SystemExit("Media/Intelligence provider cost is non-zero")
          if any(not item.get("producer_evidence_digest") for item in agents):
              raise SystemExit("Media/Intelligence producer evidence is missing")
          if any(not item.get("verifier_evidence_digest") for item in agents):
              raise SystemExit("Media/Intelligence verifier evidence is missing")
          print("ILAIOS_MEDIA_INTELLIGENCE_AGENT_LIVE_CERTIFICATION=PASS")
          PY

      - name: Upload immutable Media and Intelligence certification evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ilaios-media-intelligence-agent-live-proof-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/media-intelligence-agent-live-proof
          if-no-files-found: error
          retention-days: 90

      - name: Publish Media Intelligence exact-master status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description="run ${RUN_ID} certification failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="run ${RUN_ID} VERIFIED 12/12"
          fi
          payload=$(STATE="$state" DESCRIPTION="$description" python - <<'PY'
          import json
          import os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "ilaios/agent-media-intelligence-live-certification",
              "description": os.environ["DESCRIPTION"],
              "target_url": f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$CURRENT_SHA" \
            -d "$payload" >/dev/null
