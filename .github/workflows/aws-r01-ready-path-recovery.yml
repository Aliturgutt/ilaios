name: AWS R01 ready path recovery

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aws-r01-ready-path-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: eu-central-1
      CLUSTER: ilaios-r01-canary
      SERVICE: ilaios-r01-canary
      IMAGE_DIGEST: sha256:4534f8af614aa4fd890785e19f27e2ede7ce59435def93069884156261b86931
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit approval
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('.github/r01-canary-apply-approval.json'))
          assert d['approval']=='RELEASE.R01 CANARY APPLY APPROVED'
          assert d['external_spend_approval'] is True
          assert d['canary_ipv4_cidr']=='176.217.181.22/32'
          assert d['canary_tenant_id']=='ilaios-r01-canary'
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1
      - name: Verify clean image still approved
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "101180464425"
          read -r STATUS CRITICAL HIGH < <(aws ecr describe-image-scan-findings --repository-name ilaios-r01-canary --image-id imageDigest="$IMAGE_DIGEST" --region "$AWS_REGION" --query '[imageScanStatus.status, to_string(imageScanFindings.findingSeverityCounts.CRITICAL || `0`), to_string(imageScanFindings.findingSeverityCounts.HIGH || `0`)]' --output text)
          test "$STATUS" = COMPLETE
          test "$CRITICAL" = 0
          test "$HIGH" = 0
      - name: Register readiness-path fixed task revision
        id: task
        run: |
          set -euo pipefail
          CURRENT_TD="$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION" --query 'services[0].taskDefinition' --output text)"
          aws ecs describe-task-definition --task-definition "$CURRENT_TD" --region "$AWS_REGION" --query taskDefinition --output json > /tmp/current-task.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          td=json.loads(Path('/tmp/current-task.json').read_text())
          keep={'family','taskRoleArn','executionRoleArn','networkMode','containerDefinitions','volumes','placementConstraints','requiresCompatibilities','cpu','memory','runtimePlatform','ipcMode','pidMode','proxyConfiguration','inferenceAccelerators','ephemeralStorage'}
          out={k:v for k,v in td.items() if k in keep and v not in (None,[],{})}
          runtime=next(c for c in out['containerDefinitions'] if c['name']=='runtime')
          runtime['image']=f"101180464425.dkr.ecr.eu-central-1.amazonaws.com/ilaios-r01-canary@{os.environ['IMAGE_DIGEST']}"
          runtime['user']='1000:1000'
          runtime['readonlyRootFilesystem']=True
          for env in runtime.get('environment',[]):
              if env.get('name')=='ILAIOS_READY_FILE':
                  env['value']='/var/lib/ilaios/ready.json'
          if not any(e.get('name')=='ILAIOS_READY_FILE' for e in runtime.get('environment',[])):
              runtime.setdefault('environment',[]).append({'name':'ILAIOS_READY_FILE','value':'/var/lib/ilaios/ready.json'})
          runtime['mountPoints']=[m for m in runtime.get('mountPoints',[]) if m.get('sourceVolume')!='tmp']
          out['volumes']=[v for v in out.get('volumes',[]) if v.get('name')!='tmp']
          runtime['healthCheck']={'command':['CMD-SHELL',"python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready',timeout=2)\""],'interval':30,'timeout':5,'retries':3,'startPeriod':30}
          Path('/tmp/new-task.json').write_text(json.dumps(out,separators=(',',':')))
          PY
          NEW_TD="$(aws ecs register-task-definition --cli-input-json file:///tmp/new-task.json --region "$AWS_REGION" --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "task_definition=$NEW_TD" >> "$GITHUB_OUTPUT"
          echo "NEW_TASK_DEFINITION=$NEW_TD"
      - name: Deploy fixed revision
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "${{ steps.task.outputs.task_definition }}" --force-new-deployment --region "$AWS_REGION" >/dev/null
      - name: Verify runtime and target health
        run: |
          set -uo pipefail
          TG="$(aws elbv2 describe-target-groups --names "$SERVICE" --region "$AWS_REGION" --query 'TargetGroups[0].TargetGroupArn' --output text)"
          PASS=0
          for i in $(seq 1 60); do
            SERVICE_JSON="$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION" --output json)"
            RUNNING="$(python -c 'import json,sys; s=json.load(sys.stdin)["services"][0]; print(s["runningCount"])' <<<"$SERVICE_JSON")"
            PENDING="$(python -c 'import json,sys; s=json.load(sys.stdin)["services"][0]; print(s["pendingCount"])' <<<"$SERVICE_JSON")"
            ROLLOUT="$(python -c 'import json,sys; s=json.load(sys.stdin)["services"][0]; print(s["deployments"][0].get("rolloutState",""))' <<<"$SERVICE_JSON")"
            HEALTH="$(aws elbv2 describe-target-health --target-group-arn "$TG" --region "$AWS_REGION" --query 'TargetHealthDescriptions[?TargetHealth.State==`healthy`] | length(@)' --output text 2>/dev/null || echo 0)"
            echo "RUNNING=$RUNNING PENDING=$PENDING ROLLOUT=$ROLLOUT HEALTHY_TARGETS=$HEALTH"
            if [ "$RUNNING" = 1 ] && [ "$PENDING" = 0 ] && [ "$ROLLOUT" = COMPLETED ] && [ "$HEALTH" -ge 1 ]; then PASS=1; break; fi
            sleep 10
          done
          if [ "$PASS" -eq 1 ]; then
            TASKS="$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" --desired-status RUNNING --region "$AWS_REGION" --query taskArns --output text)"
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks $TASKS --region "$AWS_REGION" --query 'tasks[*].{task:taskArn,health:healthStatus,lastStatus:lastStatus,taskDefinition:taskDefinition,containers:containers[*].{name:name,health:healthStatus,status:lastStatus,exit:exitCode}}' --output json
            aws logs tail '/ilaios/r01/canary/runtime' --since 10m --region "$AWS_REGION" || true
            echo 'R01_READY_PATH_RECOVERY_PASS'
            exit 0
          fi
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION" --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,deployments:deployments,events:events[0:15].message}' --output json || true
          STOPPED="$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" --desired-status STOPPED --region "$AWS_REGION" --query 'taskArns[0:10]' --output text 2>/dev/null || true)"
          if [ -n "$STOPPED" ]; then aws ecs describe-tasks --cluster "$CLUSTER" --tasks $STOPPED --region "$AWS_REGION" --query 'tasks[*].{task:taskArn,taskDefinition:taskDefinition,stopCode:stopCode,reason:stoppedReason,containers:containers[*].{name:name,exit:exitCode,reason:reason}}' --output json || true; fi
          aws logs tail '/ilaios/r01/canary/runtime' --since 20m --region "$AWS_REGION" || true
          exit 1
