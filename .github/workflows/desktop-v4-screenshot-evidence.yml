name: Desktop V4 Screenshot Evidence

on:
  pull_request:
    branches:
      - master
    paths:
      - 'apps/desktop/**'
      - 'docs/platform/desktop/Desktop_7_Page_References/**'
      - 'docs/platform/desktop/DESKTOP_7_PAGE_REFERENCE_MANIFEST.md'
      - 'tools/desktop/collect_v4_screenshot_evidence.ps1'
      - '.github/workflows/desktop-v4-screenshot-evidence.yml'

permissions:
  contents: read

concurrency:
  group: desktop-v4-screenshot-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flutter-render-evidence:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned Flutter SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flutter = Join-Path $env:RUNNER_TEMP 'flutter'
          git init $flutter
          git -C $flutter remote add origin https://github.com/flutter/flutter.git
          git -C $flutter fetch --depth 1 origin refs/tags/3.44.9:refs/tags/3.44.9
          git -C $flutter checkout --detach 3.44.9
          $resolved = (git -C $flutter rev-parse HEAD).Trim()
          if ($resolved -ne '6b182d2c7585eba26d4edce0f97630effd256c33') {
            throw "Unexpected Flutter revision: $resolved"
          }
          (Join-Path $flutter 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve locked dependencies
        working-directory: apps/desktop
        shell: pwsh
        run: flutter pub get --enforce-lockfile

      - name: Render canonical 7-page 1536x1024 evidence
        working-directory: apps/desktop
        shell: pwsh
        run: flutter test test/desktop_7_page_screenshot_evidence_test.dart

      - name: Verify 7 canonical PNGs and exact-head SHA manifest
        shell: pwsh
        run: |
          ./tools/desktop/collect_v4_screenshot_evidence.ps1 `
            -SourceSha '${{ github.event.pull_request.head.sha }}' `
            -RunId '${{ github.run_id }}'

      - name: Upload exact-head canonical 7-page screenshot evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-7-page-screenshot-evidence-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: artifacts/desktop-7-page-visual-evidence/**
          if-no-files-found: error
          retention-days: 30
