name: Brand Video Runtime Owner Fix

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/brand-video-runtime-owner-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'brand/canonical-neutral-palette-20260902'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: brand/canonical-neutral-palette-20260902
          fetch-depth: 0

      - name: Align packaged Video runtime with canonical dark owner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('services/integrations/desktop_video_composition.py')
          test = Path('tests/test_governed_stock_desktop_composition.py')
          s = source.read_text(encoding='utf-8')
          t = test.read_text(encoding='utf-8')

          old_source = 'logo = base / "brand" / "assets" / "03-ilaios-symbol-dark.jpg"'
          new_source = 'logo = base / "brand" / "assets" / "05-ilaios-app-icon.jpg"'
          old_test = 'assert logo.name == "03-ilaios-symbol-dark.jpg"'
          new_test = 'assert logo.name == "05-ilaios-app-icon.jpg"'

          if s.count(old_source) != 1:
              raise SystemExit(f'unexpected desktop_video_composition old-owner count: {s.count(old_source)}')
          if t.count(old_test) != 1:
              raise SystemExit(f'unexpected governed-stock test old-owner count: {t.count(old_test)}')
          if new_source in s or new_test in t:
              raise SystemExit('target owner already partially present; refusing ambiguous rewrite')

          source.write_text(s.replace(old_source, new_source, 1), encoding='utf-8')
          test.write_text(t.replace(old_test, new_test, 1), encoding='utf-8')
          PY

          grep -Fq '05-ilaios-app-icon.jpg' services/integrations/desktop_video_composition.py
          ! grep -Fq '03-ilaios-symbol-dark.jpg' services/integrations/desktop_video_composition.py
          python3 -m pytest tests/test_governed_stock_desktop_composition.py -q
          git diff --check

      - name: Commit bounded runtime-owner fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/integrations/desktop_video_composition.py tests/test_governed_stock_desktop_composition.py
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'services/integrations/desktop_video_composition.py'
          printf '%s\n' "${changed[@]}" | grep -Fx 'tests/test_governed_stock_desktop_composition.py'
          git commit -m 'fix(brand): align packaged video runtime with canonical dark owner'
          git push origin HEAD:brand/canonical-neutral-palette-20260902
