name: Brand Legacy CSS Cleanup

on:
  push:
    branches:
      - brand/canonical-neutral-palette-20260902
    paths:
      - .github/workflows/brand-legacy-css-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: brand/canonical-neutral-palette-20260902
          fetch-depth: 0

      - name: Remove legacy website palette physically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/website/app/website-v2.css')
          text = path.read_text()
          original = text

          replacements = {
              '--v2-carbon: #0B0F14;': '--v2-carbon: #0A0A0A;',
              '--v2-panel: #0F1620;': '--v2-panel: #141414;',
              '--v2-panel-2: #111827;': '--v2-panel-2: #1E1E1E;',
              '--v2-panel-3: #151F2B;': '--v2-panel-3: #242424;',
              '--v2-line: #263344;': '--v2-line: #2A2A2A;',
              '--v2-line-strong: #34465A;': '--v2-line-strong: #2F2F2F;',
              '--v2-soft: #B8C6D6;': '--v2-soft: #E6E6E6;',
              '--v2-muted: #899CAF;': '--v2-muted: #B3B3B3;',
              '--v2-cyan: #00C2D1;\n': '',
              '--v2-blue: #146BFF;\n': '',
              'var(--v2-cyan)': 'var(--v2-white)',
              'var(--v2-blue)': 'var(--v2-white)',
              '#AAB9C8': '#B3B3B3',
              '#10252C': '#1E1E1E',
              'rgba(0,194,209,.55)': 'rgba(255,255,255,.24)',
              '#0C131B': '#141414',
              '#B3C1CF': '#B3B3B3',
              '#18D0DD': '#E6E6E6',
              '#4A6077': '#2F2F2F',
              '#080D13': '#0A0A0A',
              '#0B1219': '#141414',
              '#121D29': '#1E1E1E',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          forbidden = [
              '#00C2D1', '#146BFF', '#0B0F14', '#0F1620', '#111827',
              '#151F2B', '#263344', '#34465A', '#B8C6D6', '#899CAF',
              '#18D0DD', '#10252C', '#4A6077', '#080D13', '#0B1219',
              '#0C131B', '#121D29', 'rgba(0,194,209',
              'var(--v2-cyan)', 'var(--v2-blue)'
          ]
          leftovers = [token for token in forbidden if token in text]
          if leftovers:
              raise SystemExit(f'legacy palette tokens remain: {leftovers}')
          if text == original:
              raise SystemExit('cleanup made no changes')
          path.write_text(text)
          PY

          grep -Fq -- '--v2-carbon: #0A0A0A;' apps/website/app/website-v2.css
          grep -Fq -- '--v2-panel: #141414;' apps/website/app/website-v2.css
          grep -Fq -- '--v2-soft: #E6E6E6;' apps/website/app/website-v2.css
          grep -Fq -- '--v2-muted: #B3B3B3;' apps/website/app/website-v2.css

          git diff --check
          git diff -- apps/website/app/website-v2.css

      - name: Commit bounded cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/website/app/website-v2.css
          test "$(git diff --cached --name-only)" = "apps/website/app/website-v2.css"
          git commit -m "fix(brand): remove legacy website palette source"
          git push origin HEAD:brand/canonical-neutral-palette-20260902
