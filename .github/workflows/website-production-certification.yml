name: Website Production Release and Certification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact current master SHA to release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: website-production-release-master
  cancel-in-progress: false

jobs:
  release-and-certify-production:
    name: Exact production release and browser certification
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verify release target is exact current master
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch origin master --no-tags
          actual="$(git rev-parse HEAD)"
          master="$(git rev-parse origin/master)"
          test "$actual" = "$EXPECTED_SHA"
          test "$master" = "$EXPECTED_SHA"

      - name: Require production Deploy Hook
        shell: bash
        env:
          HOOK_URL: ${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [[ -z "$HOOK_URL" ]]; then
            echo "VERCEL_PRODUCTION_DEPLOY_HOOK is not configured." >&2
            exit 1
          fi

      - name: Trigger exactly one Vercel production deployment
        shell: bash
        env:
          HOOK_URL: ${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST "$HOOK_URL" >/dev/null

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install browser certification runtime
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Certify exact production deployment and live browser surfaces
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BASE_URL: https://ilaios.com
          WWW_URL: https://www.ilaios.com
          CERTIFICATION_WAIT_SECONDS: "900"
          CERTIFICATION_ARTIFACT_DIR: artifacts/production-certification
        run: python apps/website/scripts/production-certification-runner.py

      - name: Rendered density, interaction and visual-composition gate
        env:
          BASE_URL: https://ilaios.com
          CERTIFICATION_ARTIFACT_DIR: artifacts/production-certification
        run: python apps/website/scripts/visual-runtime-gate.py

      - name: Publish certification summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/production-certification/summary.md ]]; then
            cat artifacts/production-certification/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# ILAIOS Production Website Certification" >> "$GITHUB_STEP_SUMMARY"
            echo "Certification summary was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f artifacts/production-certification/visual-summary.md ]]; then
            cat artifacts/production-certification/visual-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# ILAIOS Rendered Visual QA" >> "$GITHUB_STEP_SUMMARY"
            echo "Rendered visual summary was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> CI/browser certification never grants final visual approval. The live website remains **NOT FINAL** until the owner explicitly approves the rendered design." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ilaios-production-website-certification-${{ inputs.expected_sha }}
          path: artifacts/production-certification
          if-no-files-found: warn
          retention-days: 30
