name: Red-team CI Hardening Bootstrap

on:
  push:
    branches:
      - redteam/ci-final-hardening
    paths:
      - '.github/workflows/_redteam-ci-hardening-bootstrap.yml'
      - '.redteam-ci-hardening-trigger'

permissions:
  contents: write

concurrency:
  group: redteam-ci-final-hardening-bootstrap
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: redteam/ci-final-hardening
          fetch-depth: 0

      - name: Apply deterministic CI red-team hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path('.')
          workflows = root / '.github' / 'workflows'

          pins = {
              'actions/checkout@v4': 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262',
              'actions/setup-python@v5': 'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065',
              'actions/setup-node@v4': 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020',
              'actions/upload-artifact@v4': 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
              'actions/download-artifact@v4': 'actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093',
              'aws-actions/configure-aws-credentials@v4': 'aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a',
              'opentofu/setup-opentofu@v1': 'opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f',
          }

          def write(path: Path, text: str) -> None:
              path.write_text(text, encoding='utf-8')

          def replace_on_block(path: Path, body: str) -> None:
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(
                  r'(?ms)^on:\n.*?^permissions:',
                  f'on:\n{body}\npermissions:',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Unable to replace on block: {path}')
              write(path, updated)

          def harden_checkout_blocks(text: str) -> str:
              lines = text.splitlines()
              i = 0
              while i < len(lines):
                  if 'uses: actions/checkout@' not in lines[i]:
                      i += 1
                      continue
                  uses_indent = len(lines[i]) - len(lines[i].lstrip())
                  stripped = lines[i].lstrip()
                  step_indent = uses_indent if stripped.startswith('- uses:') else max(0, uses_indent - 2)
                  end = i + 1
                  while end < len(lines):
                      candidate = lines[end]
                      candidate_stripped = candidate.lstrip()
                      candidate_indent = len(candidate) - len(candidate_stripped)
                      if candidate_indent == step_indent and candidate_stripped.startswith('- '):
                          break
                      end += 1
                  block = lines[i:end]
                  with_index = next((idx for idx, line in enumerate(block) if line.strip() == 'with:'), None)
                  has_ref = any(line.strip().startswith('ref:') for line in block)
                  has_persist = any(line.strip() == 'persist-credentials: false' for line in block)
                  additions: list[str] = []
                  if not has_ref:
                      additions.append(' ' * (step_indent + 4) + 'ref: ${{ github.event.pull_request.head.sha || github.sha }}')
                  if not has_persist:
                      additions.append(' ' * (step_indent + 4) + 'persist-credentials: false')
                  if additions:
                      if with_index is None:
                          insert_at = i + 1
                          lines[insert_at:insert_at] = [' ' * (step_indent + 2) + 'with:', *additions]
                          i = insert_at + len(additions) + 1
                      else:
                          insert_at = i + with_index + 1
                          lines[insert_at:insert_at] = additions
                          i = insert_at + len(additions)
                  else:
                      i = end
              return '\n'.join(lines) + '\n'

          # Pin all known external actions and harden checkout credentials/exact source binding.
          for path in sorted(workflows.glob('*.yml')):
              if path.name == '_redteam-ci-hardening-bootstrap.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in pins.items():
                  text = text.replace(old, new)
              text = harden_checkout_blocks(text)
              write(path, text)

          # All workflows capable of external mutation/spend are manual-only.
          for name in (
              'aws-r01-canary-apply.yml',
              'aws-r01-image-scan.yml',
              'aws-r01-preparation-resources.yml',
              'aws-r02-limited-apply.yml',
              'aws-r03-production-apply.yml',
              'video-provider-production-certification.yml',
          ):
              replace_on_block(workflows / name, '  workflow_dispatch:\n\n')

          # Required CI becomes the single validation authority on PRs and canonical master.
          required = workflows / 'required-ci-gate.yml'
          text = required.read_text(encoding='utf-8')
          text = text.replace(
              'on:\n  pull_request:\n  workflow_dispatch:\n',
              'on:\n  pull_request:\n  push:\n    branches: [master]\n  workflow_dispatch:\n',
              1,
          )
          text = text.replace(
              '          python -m services.desktop_ci_supply_chain --repository-root .\n',
              '          python -m services.desktop_ci_supply_chain --repository-root .\n'
              '          python -m services.github_workflow_security_audit --repository-root .\n',
              1,
          )
          text = text.replace(
              "|.github/workflows/platform-ci.yml|.github/workflows/required-ci-gate.yml|.github/workflows/desktop-*.yml)",
              "|.github/workflows/*.yml)",
              1,
          )
          malware_job = '''  malware:\n    name: Repository malware scan\n    uses: ./.github/workflows/malware-scan.yml\n\n'''
          text = text.replace('  required-ci-gate:\n', malware_job + '  required-ci-gate:\n', 1)
          text = text.replace(
              'needs: [classify, supply-chain, secret-scan, db-migration-safety, api-contract-safety, operational-safety, assurance, final-closure-structure, platform, website]',
              'needs: [classify, supply-chain, secret-scan, db-migration-safety, api-contract-safety, operational-safety, assurance, final-closure-structure, malware, platform, website]',
              1,
          )
          text = text.replace(
              '          FINAL_CLOSURE_STRUCTURE_RESULT: ${{ needs.final-closure-structure.result }}\n',
              '          FINAL_CLOSURE_STRUCTURE_RESULT: ${{ needs.final-closure-structure.result }}\n'
              '          MALWARE_RESULT: ${{ needs.malware.result }}\n',
              1,
          )
          text = text.replace(
              '          if [[ "$PLATFORM_REQUIRED" == "true" && "$PLATFORM_RESULT" != "success" ]]; then\n',
              '          if [[ "$MALWARE_RESULT" != "success" ]]; then\n'
              '            echo "Repository malware scan failed: $MALWARE_RESULT"\n'
              '            exit 1\n'
              '          fi\n\n'
              '          if [[ "$PLATFORM_REQUIRED" == "true" && "$PLATFORM_RESULT" != "success" ]]; then\n',
              1,
          )
          write(required, text)

          # Platform and Website CI are reusable/manual only; master validation is owned by Required CI.
          replace_on_block(workflows / 'platform-ci.yml', '  workflow_call:\n  workflow_dispatch:\n\n')
          replace_on_block(workflows / 'website-ci.yml', '  workflow_call:\n  workflow_dispatch:\n\n')

          platform = workflows / 'platform-ci.yml'
          text = platform.read_text(encoding='utf-8')
          if 'concurrency:\n  group: platform-ci-' not in text:
              text = text.replace(
                  'permissions:\n  contents: read\n\njobs:',
                  'permissions:\n  contents: read\n\nconcurrency:\n  group: platform-ci-${{ github.workflow }}-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:',
                  1,
              )
          text = text.replace(
              '      - name: Diff hygiene\n        run: git diff --check\n',
              '      - name: Verify pre-commit checks did not mutate source\n'
              '        run: git diff --exit-code\n\n'
              '      - name: Diff hygiene\n'
              '        run: git diff --check\n',
              1,
          )
          write(platform, text)

          # Cancel stale Desktop PR builds when a newer commit supersedes them.
          desktop_groups = {
              'desktop-ci.yml': 'desktop-ci',
              'desktop-msix-packaging.yml': 'desktop-msix-packaging',
              'desktop-windows-release.yml': 'desktop-windows-gate',
          }
          for name, group in desktop_groups.items():
              path = workflows / name
              text = path.read_text(encoding='utf-8')
              if f'group: {group}-' not in text:
                  text = text.replace(
                      'permissions:\n  contents: read\n\njobs:',
                      'permissions:\n  contents: read\n\n'
                      f'concurrency:\n  group: {group}-${{{{ github.event.pull_request.number || github.ref }}}}\n'
                      '  cancel-in-progress: true\n\njobs:',
                      1,
                  )
              if name == 'desktop-ci.yml':
                  text = text.replace('    runs-on: ubuntu-latest\n', '    runs-on: ubuntu-latest\n    timeout-minutes: 30\n', 1)
                  text = text.replace('    runs-on: windows-latest\n', '    runs-on: windows-latest\n    timeout-minutes: 45\n', 1)
              write(path, text)

          # Production website certification must use immutable bootstrap dependencies.
          website_prod = workflows / 'website-production-certification.yml'
          text = website_prod.read_text(encoding='utf-8')
          text = text.replace('          python -m pip install --upgrade pip\n', '')
          write(website_prod, text)

          security_audit = r'''"""Repository-wide GitHub Actions security audit.

This audit is deterministic and read-only. It protects the complete workflow
surface rather than only the core validation workflows.
"""

from __future__ import annotations

import argparse
import re
from dataclasses import dataclass
from pathlib import Path

_SHA = re.compile(r"^[0-9a-f]{40}$")
_USES = re.compile(r"^\s*-?\s*uses:\s*([^#\s]+)")
_TOP_LEVEL_PUSH = re.compile(r"(?m)^  push:\s*$")
_TOP_LEVEL_PR = re.compile(r"(?m)^  pull_request:\s*$")

_MANUAL_ONLY = frozenset(
    {
        "aws-r01-canary-apply.yml",
        "aws-r01-image-publish.yml",
        "aws-r01-image-scan.yml",
        "aws-r01-preparation-resources.yml",
        "aws-r02-limited-apply.yml",
        "aws-r03-production-apply.yml",
        "desktop-msix-signed-release.yml",
        "video-provider-production-certification.yml",
    }
)
_SECRET_ALLOWED = frozenset(
    {
        "desktop-msix-signed-release.yml",
        "video-provider-production-certification.yml",
    }
)


@dataclass(frozen=True, slots=True)
class WorkflowSecurityFinding:
    path: str
    rule: str
    detail: str


def _checkout_blocks(text: str) -> tuple[str, ...]:
    lines = text.splitlines()
    blocks: list[str] = []
    for index, line in enumerate(lines):
        if "uses: actions/checkout@" not in line:
            continue
        uses_indent = len(line) - len(line.lstrip())
        step_indent = uses_indent if line.lstrip().startswith("- uses:") else max(0, uses_indent - 2)
        block = [line]
        for candidate in lines[index + 1 :]:
            stripped = candidate.lstrip()
            indent = len(candidate) - len(stripped)
            if indent == step_indent and stripped.startswith("- "):
                break
            block.append(candidate)
        blocks.append("\n".join(block))
    return tuple(blocks)


def audit_repository(repository_root: Path) -> tuple[WorkflowSecurityFinding, ...]:
    workflow_dir = repository_root / ".github" / "workflows"
    findings: list[WorkflowSecurityFinding] = []
    for path in sorted(workflow_dir.glob("*.yml")):
        relative = str(path.relative_to(repository_root)).replace("\\", "/")
        text = path.read_text(encoding="utf-8")
        if "pull_request_target:" in text:
            findings.append(WorkflowSecurityFinding(relative, "NO_PR_TARGET", "pull_request_target is forbidden"))
        if "permissions: write-all" in text or re.search(r"(?m)^  contents:\s+write\s*$", text):
            findings.append(WorkflowSecurityFinding(relative, "NO_REPO_WRITE", "permanent workflows may not grant repository write authority"))
        if "permissions:\n" not in text or not re.search(r"(?m)^  contents:\s+read\s*$", text):
            findings.append(WorkflowSecurityFinding(relative, "CONTENTS_READ", "workflow must explicitly declare contents: read"))
        if "secrets." in text and path.name not in _SECRET_ALLOWED:
            findings.append(WorkflowSecurityFinding(relative, "SECRET_BOUNDARY", "secrets are not allowed in this workflow"))
        for line in text.splitlines():
            match = _USES.match(line)
            if match is None:
                continue
            reference = match.group(1)
            if reference.startswith("./"):
                continue
            _, separator, revision = reference.partition("@")
            if not separator or _SHA.fullmatch(revision) is None:
                findings.append(WorkflowSecurityFinding(relative, "IMMUTABLE_ACTION", reference))
        for block in _checkout_blocks(text):
            if "persist-credentials: false" not in block:
                findings.append(WorkflowSecurityFinding(relative, "CHECKOUT_CREDENTIALS", "checkout credentials must not persist"))
            if "ref:" not in block:
                findings.append(WorkflowSecurityFinding(relative, "EXACT_CHECKOUT", "checkout must bind an explicit exact ref"))
        if path.name in _MANUAL_ONLY:
            if "workflow_dispatch:" not in text:
                findings.append(WorkflowSecurityFinding(relative, "MANUAL_ONLY", "external mutation workflow lacks workflow_dispatch"))
            if _TOP_LEVEL_PUSH.search(text) or _TOP_LEVEL_PR.search(text):
                findings.append(WorkflowSecurityFinding(relative, "MANUAL_ONLY", "external mutation/spend workflow must not auto-trigger"))
    return tuple(findings)


def main(argv: list[str] | None = None) -> int:
    parser = argparse.ArgumentParser(description="Audit all GitHub Actions workflows")
    parser.add_argument("--repository-root", default=".")
    args = parser.parse_args(argv)
    findings = audit_repository(Path(args.repository_root).resolve())
    if not findings:
        print("Repository-wide GitHub Actions security audit PASS")
        return 0
    for finding in findings:
        print(f"BLOCK {finding.rule} {finding.path}: {finding.detail}")
    return 1


if __name__ == "__main__":
    raise SystemExit(main())
'''
          write(root / 'services' / 'github_workflow_security_audit.py', security_audit)

