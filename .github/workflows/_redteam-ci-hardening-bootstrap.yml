name: Red-team CI Hardening Bootstrap

on:
  push:
    branches:
      - redteam/ci-final-hardening
    paths:
      - '.github/workflows/_redteam-ci-hardening-bootstrap.yml'
      - 'tools/_redteam_ci_harden.py'
      - '.redteam-ci-hardening-trigger'

permissions:
  contents: read

concurrency:
  group: redteam-ci-final-hardening-bootstrap
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: redteam/ci-final-hardening
          fetch-depth: 0
          persist-credentials: false

      - name: Apply deterministic hardening
        run: python tools/_redteam_ci_harden.py

      - name: Validate hardened policy
        shell: bash
        run: |
          set -euo pipefail
          python -m services.software_factory_ci_supply_chain --repository-root .
          python -m services.desktop_ci_supply_chain --repository-root .
          python -m services.github_workflow_security_audit --repository-root .
          git diff --check

      - name: Export validated hardening payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-redteam-hardening-payload
          path: |
            .github/workflows
            services/github_workflow_security_audit.py
            tests/test_github_workflow_security_audit.py
          if-no-files-found: error
          retention-days: 1
