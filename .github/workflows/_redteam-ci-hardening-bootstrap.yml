name: Red-team CI Hardening Bootstrap

on:
  push:
    branches:
      - redteam/ci-final-hardening
    paths:
      - '.github/workflows/_redteam-ci-hardening-bootstrap.yml'
      - 'tools/_redteam_ci_harden.py'
      - '.redteam-ci-hardening-trigger'

permissions:
  contents: write

concurrency:
  group: redteam-ci-final-hardening-bootstrap
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: redteam/ci-final-hardening
          fetch-depth: 0

      - name: Apply deterministic hardening
        run: python tools/_redteam_ci_harden.py

      - name: Validate hardened policy
        shell: bash
        run: |
          set -euo pipefail
          python -m services.software_factory_ci_supply_chain --repository-root .
          python -m services.desktop_ci_supply_chain --repository-root .
          python -m services.github_workflow_security_audit --repository-root .
          git diff --check

      - name: Commit hardened CI surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ILAIOS CI Red Team'
          git config user.email '98952443+Aliturgutt@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'ci: red-team harden and unify validation gates'
          git push origin HEAD:redteam/ci-final-hardening
