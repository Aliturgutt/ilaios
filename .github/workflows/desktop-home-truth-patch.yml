name: Desktop Home Truth Patch

on:
  push:
    branches:
      - desktop/home-motion-truth-86b7c195
    paths:
      - .github/automation/home-truth-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact fail-closed progress patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/desktop/lib/features/dashboard/reference_home_dashboard_v3.dart')
          text = path.read_text(encoding='utf-8')
          old = """                ClipRRect(
                  borderRadius: BorderRadius.circular(4),
                  child: LinearProgressIndicator(
                    value: progress ?? 0,
                    minHeight: 3,
                    backgroundColor: Theme.of(context).colorScheme.surfaceContainerHighest,
                  ),
                ),
"""
          new = """                if (progress == null)
                  Container(
                    key: const Key('focus-progress-unavailable-track'),
                    height: 3,
                    decoration: BoxDecoration(
                      color: Theme.of(context).colorScheme.surfaceContainerHighest,
                      borderRadius: BorderRadius.circular(4),
                    ),
                  )
                else
                  ClipRRect(
                    borderRadius: BorderRadius.circular(4),
                    child: LinearProgressIndicator(
                      value: progress,
                      minHeight: 3,
                      backgroundColor: Theme.of(context).colorScheme.surfaceContainerHighest,
                    ),
                  ),
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one truth anchor, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Commit bounded product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/lib/features/dashboard/reference_home_dashboard_v3.dart
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "desktop: fail closed when Home progress is unavailable"
          git push origin HEAD:desktop/home-motion-truth-86b7c195
