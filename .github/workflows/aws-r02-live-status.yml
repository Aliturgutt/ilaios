name: AWS R02 live status

# probe-trigger: 2026-08-11T06:46:00+03:00
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/aws-r02-live-status.yml'

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::101180464425:role/ILAIOS-GitHub-Deploy-Role
          aws-region: eu-central-1
      - name: Report ECS and target health read-only
        run: |
          set -euo pipefail
          aws ecs describe-services --region eu-central-1 --cluster ilaios-r01-canary --services ilaios-r01-canary \
            --query 'services[0].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,taskDefinition:taskDefinition,deployments:deployments[].{status:status,rolloutState:rolloutState,desired:desiredCount,running:runningCount,pending:pendingCount,taskDefinition:taskDefinition},events:events[0:8].[createdAt,message]}' \
            --output json
          TG_ARN="$(aws elbv2 describe-target-groups --region eu-central-1 --names ilaios-r01-canary --query 'TargetGroups[0].TargetGroupArn' --output text)"
          aws elbv2 describe-target-health --region eu-central-1 --target-group-arn "$TG_ARN" \
            --query 'TargetHealthDescriptions[].{target:Target.Id,port:Target.Port,state:TargetHealth.State,reason:TargetHealth.Reason,description:TargetHealth.Description}' --output json
