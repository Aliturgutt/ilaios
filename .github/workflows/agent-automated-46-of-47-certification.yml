name: ILAIOS Agent Automated 46 of 47 Certification

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/agent-automated-46-of-47-certification.yml'
      - 'services/agent_*.py'
      - 'services/*agent*.py'
      - 'services/p0_*.py'
      - 'services/independent_verifier_execution.py'
      - 'services/openrouter_agent_catalog.py'
      - 'services/runtime/**'
      - 'services/browser_runtime_composition.py'
      - 'tools/web-factory/browser-skills/runtime/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: agent-automated-46-of-47-${{ github.sha }}
  cancel-in-progress: false

jobs:
  certify:
    name: Same-SHA automated Agent evidence 46/47
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.sha }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AGENT_P0_PROOF_DIR: ${{ github.workspace }}/artifacts/agent-p0-live-proof
      WEB_AGENT_PROOF_DIR: ${{ github.workspace }}/artifacts/web-agent-live-proof
      MEDIA_INTELLIGENCE_AGENT_PROOF_DIR: ${{ github.workspace }}/artifacts/media-intelligence-agent-live-proof
      OPERATIONS_META_AGENT_PROOF_DIR: ${{ github.workspace }}/artifacts/operations-meta-agent-live-proof
      BROWSER_PROOF_DIR: ${{ github.workspace }}/artifacts/browser-skill-playwright-e2e
      AGGREGATE_PROOF_DIR: ${{ github.workspace }}/artifacts/agent-automated-46-of-47-proof
      BROWSER_IMAGE: ilaios-agent-46-cert:${{ github.sha }}

    steps:
      - name: Checkout exact trusted master SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert trusted master source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master" || test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "$OPENROUTER_API_KEY"
          echo 'OPENROUTER_API_KEY_PRESENT=TRUE'
          echo 'Automatic paid provider fallback is not authorized.'
          # actions/checkout intentionally pins the immutable source SHA, which
          # leaves HEAD detached. BrowserQA also records branch provenance in
          # ExecutionContext, so restore only the local symbolic master ref at
          # the already-verified exact SHA without fetching or moving source.
          git switch --force-create master "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git branch --show-current)" = "master"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Run automated Agent certification regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_p0_live_certification_bounds.py \
            tests/test_agent_readiness_integration.py \
            tests/test_agent_readiness_store_integration.py \
            tests/test_web_agent_browser_certification.py \
            tests/test_independent_verifier_tool_evidence.py \
            tests/test_media_intelligence_agent_live_certification.py \
            tests/test_operations_meta_agent_live_certification.py \
            tests/test_operations_meta_provider_boundary.py

      - name: Execute P0 Core Engineering Security 21/21
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" GITHUB_SHA="$SOURCE_SHA" \
            python -m services.p0_live_certification

      - name: Validate P0 receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['AGENT_P0_PROOF_DIR']) / 'p0-live-receipt.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'VERIFIED'
          assert receipt['revision_sha'] == os.environ['SOURCE_SHA']
          assert receipt['target_agent_count'] == 21
          assert receipt['verified_agent_count'] == 21
          assert receipt['zero_cost_openrouter_only'] is True
          assert len(receipt['agents']) == 21
          assert all(item.get('readiness') == 'verified' for item in receipt['agents'])
          assert all(item.get('actual_cost_usd') in (None, '0') for item in receipt['agents'])
          print('P0_AUTOMATED_AGENT_EVIDENCE=PASS 21/21')
          PY

      - name: Provision pinned Playwright seccomp profile
        env:
          SECCOMP_PATH: ${{ runner.temp }}/playwright-seccomp_profile.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import urllib.request
          source_commit = '5f8e7eac83052e2602faec430adf54dd55d63611'
          expected_blob = 'fddc05fb520affb145404e6f6f647ca96af8087d'
          url = f'https://raw.githubusercontent.com/microsoft/playwright/{source_commit}/utils/docker/seccomp_profile.json'
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = response.read()
          header = f'blob {len(payload)}\0'.encode('ascii')
          actual_blob = hashlib.sha1(header + payload, usedforsecurity=False).hexdigest()
          if actual_blob != expected_blob:
              raise SystemExit(f'Playwright seccomp provenance mismatch: {actual_blob}')
          destination = pathlib.Path(os.environ['SECCOMP_PATH'])
          destination.write_bytes(payload)
          destination.chmod(0o600)
          print(f'PLAYWRIGHT_SECCOMP_PROVENANCE=PASS {actual_blob}')
          PY

      - name: Build pinned BrowserQA runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --tag "$BROWSER_IMAGE" \
            --file tools/web-factory/browser-skills/runtime/Dockerfile \
            tools/web-factory/browser-skills/runtime
          docker run --rm "$BROWSER_IMAGE" playwright-cli --help >/dev/null

      - name: Execute governed BrowserQA E2E
        env:
          ILAIOS_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          ILAIOS_BROWSER_E2E_IMAGE: ${{ env.BROWSER_IMAGE }}
          ILAIOS_BROWSER_SECCOMP_PROFILE: ${{ runner.temp }}/playwright-seccomp_profile.json
          ILAIOS_BROWSER_E2E_ARTIFACT_DIR: ${{ env.BROWSER_PROOF_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python tools/web-factory/browser-skills/runtime/playwright_cli_e2e.py

      - name: Execute Web 6/6 governed evidence
        env:
          WEB_AGENT_BROWSER_SUMMARY_PATH: ${{ env.BROWSER_PROOF_DIR }}/playwright-cli-e2e-summary.json
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" GITHUB_SHA="$SOURCE_SHA" \
            python -m services.web_agent_live_certification

      - name: Validate Web receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['WEB_AGENT_PROOF_DIR']) / 'web-agent-live-receipt.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'VERIFIED'
          assert receipt['revision_sha'] == os.environ['SOURCE_SHA']
          assert receipt['target_agent_count'] == 6
          assert receipt['verified_agent_count'] == 6
          assert receipt['governed_ai_zero_cost_openrouter_only'] is True
          assert receipt['browser_agent_count'] == 1
          assert receipt['browser_governed_e2e'] is True
          assert receipt['browser_public_production_proven'] is False
          print('WEB_AUTOMATED_AGENT_EVIDENCE=PASS 6/6')
          PY

      - name: Execute Media and Intelligence 12/12
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" GITHUB_SHA="$SOURCE_SHA" \
            python -m services.media_intelligence_agent_live_certification

      - name: Validate Media Intelligence receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['MEDIA_INTELLIGENCE_AGENT_PROOF_DIR']) / 'media-intelligence-agent-live-receipt.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'VERIFIED'
          assert receipt['revision_sha'] == os.environ['SOURCE_SHA']
          assert receipt['target_agent_count'] == 12
          assert receipt['verified_agent_count'] == 12
          assert receipt['media_agent_count'] == 8
          assert receipt['intelligence_agent_count'] == 4
          assert receipt['governed_ai_zero_cost_openrouter_only'] is True
          assert all(item.get('actual_cost_usd') == '0' for item in receipt['agents'])
          print('MEDIA_INTELLIGENCE_AUTOMATED_AGENT_EVIDENCE=PASS 12/12')
          PY

      - name: Execute Operations Meta bounded 7/8
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" GITHUB_SHA="$SOURCE_SHA" \
            python -m services.operations_meta_agent_live_certification

      - name: Validate Operations Meta bounded receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['OPERATIONS_META_AGENT_PROOF_DIR']) / 'operations-meta-agent-live-receipt.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'PARTIAL'
          assert receipt['revision_sha'] == os.environ['SOURCE_SHA']
          assert receipt['target_agent_count'] == 8
          assert receipt['verified_agent_count'] == 7
          assert receipt['human_owner_verification_required'] is True
          assert receipt['overall_8_of_8_verified'] is False
          assert receipt['governed_ai_zero_cost_openrouter_only'] is True
          print('OPERATIONS_META_AUTOMATED_AGENT_EVIDENCE=PASS 7/8 HUMAN_OWNER_PENDING')
          PY

      - name: Build exact-SHA aggregate automated receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from services.agent_registry import CANONICAL_AGENT_REGISTRY, INDEPENDENT_VERIFIER_ID

          source_sha = os.environ['SOURCE_SHA']
          paths = {
              'p0': Path(os.environ['AGENT_P0_PROOF_DIR']) / 'p0-live-receipt.json',
              'web': Path(os.environ['WEB_AGENT_PROOF_DIR']) / 'web-agent-live-receipt.json',
              'media_intelligence': Path(os.environ['MEDIA_INTELLIGENCE_AGENT_PROOF_DIR']) / 'media-intelligence-agent-live-receipt.json',
              'operations_meta': Path(os.environ['OPERATIONS_META_AGENT_PROOF_DIR']) / 'operations-meta-agent-live-receipt.json',
          }
          receipts = {name: json.loads(path.read_text(encoding='utf-8')) for name, path in paths.items()}
          for receipt in receipts.values():
              if receipt.get('revision_sha') != source_sha:
                  raise SystemExit('component receipt SHA drifted')

          verified_ids = []
          for name in ('p0', 'web', 'media_intelligence', 'operations_meta'):
              agents = receipts[name].get('agents')
              if not isinstance(agents, list):
                  raise SystemExit(f'{name} agent receipt population is malformed')
              verified_ids.extend(str(item['agent_id']) for item in agents)

          canonical_ids = {item.manifest.agent_id for item in CANONICAL_AGENT_REGISTRY}
          automated_expected = canonical_ids - {INDEPENDENT_VERIFIER_ID}
          if len(verified_ids) != 46 or len(set(verified_ids)) != 46:
              raise SystemExit('automated Agent population is not unique 46/47')
          if set(verified_ids) != automated_expected:
              raise SystemExit('automated Agent identities do not match canonical 46/47 set')

          component_evidence = {}
          for name, path in paths.items():
              payload = path.read_bytes()
              component_evidence[name] = {
                  'receipt_path': str(path.relative_to(Path(os.environ['GITHUB_WORKSPACE']))),
                  'receipt_sha256': hashlib.sha256(payload).hexdigest(),
              }

          aggregate = {
              'status': 'PARTIAL',
              'scope': 'AUTOMATED_46_OF_47',
              'revision_sha': source_sha,
              'canonical_agent_count': 47,
              'automated_verified_agent_count': 46,
              'human_owner_pending_count': 1,
              'human_owner_agent_id': INDEPENDENT_VERIFIER_ID,
              'human_owner_verification_required': True,
              'overall_47_of_47_verified': False,
              'zero_cost_automatic_paid_fallback': False,
              'verified_agent_ids': sorted(verified_ids),
              'component_evidence': component_evidence,
          }
          output_dir = Path(os.environ['AGGREGATE_PROOF_DIR'])
          output_dir.mkdir(parents=True, exist_ok=True)
          output_path = output_dir / 'agent-automated-46-of-47-receipt.json'
          output_path.write_text(json.dumps(aggregate, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print('AGENT_AUTOMATED_EXACT_SHA=PASS 46/47 HUMAN_OWNER_PENDING')
          PY

      - name: Upload immutable automated Agent evidence
        id: upload_proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ilaios-agent-automated-46-of-47-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/agent-p0-live-proof
            artifacts/browser-skill-playwright-e2e
            artifacts/web-agent-live-proof
            artifacts/media-intelligence-agent-live-proof
            artifacts/operations-meta-agent-live-proof
            artifacts/agent-automated-46-of-47-proof
          if-no-files-found: error
          retention-days: 90

      - name: Publish truthful exact-master automated Agent status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="automated same-SHA Agent certification failed"
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="automated 46/47 exact-SHA; human.owner pending"
          fi
          payload=$(STATE="$state" DESCRIPTION="$description" python - <<'PY'
          import json
          import os
          print(json.dumps({
              'state': os.environ['STATE'],
              'context': 'ilaios/agent-automated-46-of-47-exact-master',
              'description': os.environ['DESCRIPTION'],
              'target_url': f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$CURRENT_SHA" \
            -d "$payload" >/dev/null

      - name: Publish durable Agent checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload_proof.outputs.artifact-id }}
          RECEIPT: ${{ env.AGGREGATE_PROOF_DIR }}/agent-automated-46-of-47-receipt.json
        shell: bash
        run: |
          set -euo pipefail
          body=$(python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          lines = [
              'Agent automated exact-master certification checkpoint',
              '',
              f"- source SHA: `{os.environ['CURRENT_SHA']}`",
              f"- workflow run: `{os.environ['RUN_ID']}` ({os.environ['RUN_URL']})",
              f"- job status: `{os.environ['JOB_STATUS']}`",
          ]
          path = Path(os.environ['RECEIPT'])
          if os.environ['JOB_STATUS'] == 'success' and path.is_file():
              payload = path.read_bytes()
              receipt = json.loads(payload)
              lines += [
                  f"- artifact ID: `{os.environ.get('ARTIFACT_ID', '')}`",
                  f"- aggregate receipt SHA256: `{hashlib.sha256(payload).hexdigest()}`",
                  f"- automated verified Agents: `{receipt['automated_verified_agent_count']}/{receipt['canonical_agent_count']}`",
                  f"- human.owner pending: `{str(receipt['human_owner_verification_required']).lower()}`",
                  '- 47/47 final closure: `NOT_VERIFIED`',
              ]
          else:
              lines.append('- automated 46/47 evidence: `NOT_VERIFIED`; inspect workflow failure before retry')
          print('\n'.join(lines))
          PY
          )
          issue_payload=$(python -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' <<<"$body")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/issues/557/comments" \
            -d "$issue_payload" >/dev/null

      - name: Clean transient BrowserQA Docker resources
        if: always()
        shell: bash
        run: |
          docker ps -aq --filter label=ilaios.browser-egress=true | xargs -r docker rm -f
          docker network ls -q --filter label=ilaios.browser-egress=true | xargs -r docker network rm || true
