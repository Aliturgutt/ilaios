name: Platform CI

on:
  pull_request:
    paths:
      - "src/**"
      - "services/**"
      - "packages/**"
      - "tests/**"
      - "docs/governance/**"
      - "docs/migration/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "services/**"
      - "packages/**"
      - "tests/**"
      - "docs/governance/**"
      - "docs/migration/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout active branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install Python validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'requests>=2.32,<3' \
            'python-dotenv>=1.0,<2' \
            PyYAML \
            pytest \
            ruff==0.1.9 \
            mypy==1.8.0 \
            pre-commit \
            types-requests \
            types-PyYAML

      - name: Pytest
        run: python -m pytest -q

      - name: Ruff
        run: ruff check src services tests

      - name: Mypy strict
        run: mypy --strict src tests

      - name: Pre-commit platform scope
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z -- \
            src services packages tests docs/governance docs/migration \
            pyproject.toml .pre-commit-config.yaml .github/workflows/platform-ci.yml)
          if ((${#files[@]})); then
            pre-commit run --files "${files[@]}"
          fi

      - name: Diff hygiene
        run: git diff --check
