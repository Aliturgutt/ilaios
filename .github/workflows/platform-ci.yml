name: Platform CI

on:
  pull_request:
    paths:
      - "src/**"
      - "services/**"
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "services/**"
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            requests \
            python-dotenv \
            PyYAML \
            pytest \
            ruff==0.1.9 \
            mypy==1.8.0 \
            pre-commit \
            types-requests \
            types-PyYAML

      - name: Pytest
        run: python -m pytest -q

      - name: Ruff
        run: ruff check .

      - name: Mypy strict
        run: mypy --strict src tests

      - name: Pre-commit
        run: pre-commit run --all-files

      - name: Diff hygiene
        run: git diff --check
