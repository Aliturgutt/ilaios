name: ILAIOS Agent Web Live Certification
# Exact-master recertification trigger for Agent 47/47 closure; no runtime or governance behavior change.
# Publish exact-SHA status and durable issue evidence so trusted-master receipts remain discoverable.

on:
  push:
    branches:
      - master
    paths:
      - 'services/independent_verifier_execution.py'
      - 'services/web_agent_browser_certification.py'
      - 'services/web_agent_execution.py'
      - 'services/web_agent_live_certification.py'
      - 'services/web_agent_runtime.py'
      - 'services/runtime/browser_tool_adapter.py'
      - 'services/runtime/browser_egress_docker.py'
      - 'services/runtime/browser_egress_playwright.py'
      - 'services/browser_runtime_composition.py'
      - 'tools/web-factory/browser-skills/runtime/**'
      - 'tools/web-factory/skills/ilaios-web-e2e/**'
      - 'tools/web-factory/skills/ilaios-web-visual-qa/**'
      - '.github/workflows/agent-web-live-certification.yml'
      - '.github/workflows/browser-skill-playwright-e2e.yml'
      - 'services/github_workflow_security_audit.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: agent-web-live-certification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  certify:
    name: Trusted master Web 6/6 certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    env:
      SOURCE_SHA: ${{ github.sha }}
      BROWSER_IMAGE: ilaios-web-agent-cert:${{ github.sha }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout exact trusted master SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert trusted master source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git switch -c ilaios-web-agent-cert-ci
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git branch --show-current)" = 'ilaios-web-agent-cert-ci'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Run Web certification regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_web_agent_browser_certification.py \
            tests/test_independent_verifier_tool_evidence.py \
            tests/test_web_agent_execution.py \
            tests/test_web_agent_runtime.py \
            tests/test_web_factory_browser_skills.py \
            tests/test_browser_cli_url_attestation.py \
            tests/test_browser_egress_docker.py \
            tests/test_browser_egress_playwright.py

      - name: Run Web certification static quality
        run: |
          python -m ruff check \
            services/independent_verifier_execution.py \
            services/web_agent_browser_certification.py \
            services/web_agent_live_certification.py \
            tools/web-factory/browser-skills/runtime/playwright_cli_e2e.py \
            tests/test_web_agent_browser_certification.py \
            tests/test_independent_verifier_tool_evidence.py
          python -m mypy --strict \
            services/independent_verifier_execution.py \
            services/web_agent_browser_certification.py \
            services/web_agent_live_certification.py \
            tools/web-factory/browser-skills/runtime/playwright_cli_e2e.py \
            tests/test_web_agent_browser_certification.py \
            tests/test_independent_verifier_tool_evidence.py

      - name: Provision pinned Playwright seccomp profile
        env:
          SECCOMP_PATH: ${{ runner.temp }}/playwright-seccomp_profile.json
        run: |
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import urllib.request

          source_commit = "5f8e7eac83052e2602faec430adf54dd55d63611"
          expected_blob = "fddc05fb520affb145404e6f6f647ca96af8087d"
          url = (
              "https://raw.githubusercontent.com/microsoft/playwright/"
              f"{source_commit}/utils/docker/seccomp_profile.json"
          )
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = response.read()
          header = f"blob {len(payload)}\0".encode("ascii")
          actual_blob = hashlib.sha1(header + payload, usedforsecurity=False).hexdigest()
          if actual_blob != expected_blob:
              raise SystemExit(f"Playwright seccomp provenance mismatch: {actual_blob}")
          destination = pathlib.Path(os.environ["SECCOMP_PATH"])
          destination.write_bytes(payload)
          destination.chmod(0o600)
          print(f"verified Playwright seccomp blob {actual_blob}")
          PY

      - name: Build pinned BrowserQA runtime image
        run: |
          docker build --pull \
            --tag "$BROWSER_IMAGE" \
            --file tools/web-factory/browser-skills/runtime/Dockerfile \
            tools/web-factory/browser-skills/runtime
          docker run --rm "$BROWSER_IMAGE" playwright-cli --help >/dev/null
          docker run --rm "$BROWSER_IMAGE" python3 --version

      - name: Execute exact-source governed BrowserQA E2E
        env:
          PYTHONPATH: ${{ github.workspace }}
          ILAIOS_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          ILAIOS_BROWSER_E2E_IMAGE: ${{ env.BROWSER_IMAGE }}
          ILAIOS_BROWSER_SECCOMP_PROFILE: ${{ runner.temp }}/playwright-seccomp_profile.json
          ILAIOS_BROWSER_E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/browser-skill-playwright-e2e
        run: python tools/web-factory/browser-skills/runtime/playwright_cli_e2e.py

      - name: Execute five governed zero-cost Web agents plus BrowserQA evidence verification
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
          WEB_AGENT_BROWSER_SUMMARY_PATH: ${{ github.workspace }}/artifacts/browser-skill-playwright-e2e/playwright-cli-e2e-summary.json
          WEB_AGENT_PROOF_DIR: ${{ github.workspace }}/artifacts/web-agent-live-proof
        run: python -m services.web_agent_live_certification

      - name: Validate immutable Web 6/6 receipt
        env:
          RECEIPT: ${{ github.workspace }}/artifacts/web-agent-live-proof/web-agent-live-receipt.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path(os.environ["RECEIPT"]).read_text(encoding="utf-8"))
          expected = os.environ["SOURCE_SHA"]
          if receipt.get("status") != "VERIFIED":
              raise SystemExit("Web receipt status is not VERIFIED")
          if receipt.get("revision_sha") != expected:
              raise SystemExit("Web receipt SHA drifted")
          if receipt.get("target_agent_count") != 6 or receipt.get("verified_agent_count") != 6:
              raise SystemExit("Web receipt is not 6/6")
          if receipt.get("governed_ai_agent_count") != 5:
              raise SystemExit("Web governed-AI count drifted")
          if receipt.get("governed_ai_zero_cost_openrouter_only") is not True:
              raise SystemExit("Web governed-AI zero-cost proof failed")
          if receipt.get("browser_agent_count") != 1 or receipt.get("browser_governed_e2e") is not True:
              raise SystemExit("BrowserQA governed E2E proof failed")
          if receipt.get("browser_public_production_proven") is not False:
              raise SystemExit("BrowserQA receipt overclaimed public production")
          agents = receipt.get("agents")
          if not isinstance(agents, list) or len(agents) != 6:
              raise SystemExit("Web agent receipt population drifted")
          provider_agents = [item for item in agents if item.get("execution_mode") == "governed-ai"]
          browser_agents = [item for item in agents if item.get("execution_mode") == "browser-tool"]
          if len(provider_agents) != 5 or any(item.get("actual_cost_usd") != "0" for item in provider_agents):
              raise SystemExit("Web provider receipt proof failed")
          if len(browser_agents) != 1 or browser_agents[0].get("provider_id") is not None:
              raise SystemExit("BrowserQA was mislabeled as provider execution")
          print("ILAIOS_WEB_AGENT_LIVE_CERTIFICATION=PASS")
          PY

      - name: Clean transient BrowserQA Docker resources
        if: always()
        run: |
          docker ps -aq --filter label=ilaios.browser-egress=true | xargs -r docker rm -f
          docker network ls -q --filter label=ilaios.browser-egress=true | xargs -r docker network rm || true

      - name: Upload immutable Web certification evidence
        id: upload_live_artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ilaios-web-agent-live-proof-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/browser-skill-playwright-e2e
            artifacts/web-agent-live-proof
          if-no-files-found: error
          retention-days: 90

      - name: Publish Web exact-master status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && format('run {0} VERIFIED 6/6', github.run_id) || format('run {0} certification failed', github.run_id) }}
        run: |
          set -euo pipefail
          payload=$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "ilaios/agent-web-live-certification",
              "description": os.environ["DESCRIPTION"],
              "target_url": f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$CURRENT_SHA" \
            -d "$payload" >/dev/null

      - name: Publish Web evidence checkpoint to issue 557
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload_live_artifact.outputs.artifact-id }}
          ARTIFACT_NAME: ilaios-web-agent-live-proof-${{ github.sha }}-${{ github.run_id }}
          RECEIPT: ${{ github.workspace }}/artifacts/web-agent-live-proof/web-agent-live-receipt.json
        run: |
          set -euo pipefail
          body=$(python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          lines = [
              "Web exact-master certification checkpoint",
              "",
              f"- source SHA: `{os.environ['CURRENT_SHA']}`",
              f"- workflow run: `{os.environ['RUN_ID']}` ({os.environ['RUN_URL']})",
              f"- job status: `{os.environ['JOB_STATUS']}`",
          ]
          if os.environ["JOB_STATUS"] == "success":
              artifact_id = os.environ.get("ARTIFACT_ID", "")
              if not artifact_id:
                  raise SystemExit("successful Web upload did not expose artifact ID")
              receipt_path = Path(os.environ["RECEIPT"])
              receipt_bytes = receipt_path.read_bytes()
              receipt = json.loads(receipt_bytes)
              lines += [
                  f"- artifact ID: `{artifact_id}`",
                  f"- artifact name: `{os.environ['ARTIFACT_NAME']}`",
                  f"- receipt SHA256: `{hashlib.sha256(receipt_bytes).hexdigest()}`",
                  f"- verified agents: `{receipt['verified_agent_count']}/{receipt['target_agent_count']}`",
                  f"- status: `{receipt['status']}`",
                  f"- BrowserQA governed E2E: `{str(receipt['browser_governed_e2e']).lower()}`",
                  f"- zero-cost OpenRouter-only: `{str(receipt['governed_ai_zero_cost_openrouter_only']).lower()}`",
                  "- exact-master Web evidence: VERIFIED 6/6",
              ]
          else:
              lines.append("- artifact: not accepted; inspect exact workflow failure before any retry")
          print("\n".join(lines))
          PY
          )
          payload=$(python -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' <<<"$body")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/issues/557/comments" \
            -d "$payload" >/dev/null
