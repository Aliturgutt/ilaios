name: Agent Web Live Certification

on:
  push:
    branches: [master]
    paths:
      - 'services/web_agent_*.py'
      - 'services/runtime/browser_evidence_adapter.py'
      - 'services/runtime/browser_tool_adapter.py'
      - 'services/browser_runtime_composition.py'
      - 'services/web_factory_skills.py'
      - 'services/integrations/web_**'
      - 'apps/desktop/e2e/web_finished_product_browser_e2e.py'
      - 'tools/web-factory/browser-skills/**'
      - '.github/workflows/agent-web-live-certification.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: agent-web-live-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-live-certification:
    name: 6-agent real Web provider/browser evidence
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      WEB_AGENT_PROOF_DIR: artifacts/web-agent-live-proof
      ILAIOS_WEB_E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/web-local-finished-product

    steps:
      - name: Checkout exact trusted source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked runtime and pinned Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m pip check
          python -m playwright install --with-deps chromium

      - name: Verify trusted secret boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          test "$GITHUB_REF" = "refs/heads/master" || test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          echo 'OPENROUTER_API_KEY_PRESENT=TRUE'
          echo 'Credential material is not printed or persisted.'

      - name: Run focused Web agent regression gates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_web_agent_runtime.py \
            tests/test_web_factory_browser_skills.py \
            tests/test_web_factory_native_skills.py

      - name: Run exact-source Web Factory Next.js + Chromium E2E
        env:
          PYTHONPATH: ${{ github.workspace }}
          ILAIOS_SOURCE_SHA: ${{ github.sha }}
        run: python apps/desktop/e2e/web_finished_product_browser_e2e.py

      - name: Run six canonical Web agent certification
        env:
          PYTHONPATH: ${{ github.workspace }}
          WEB_AGENT_BROWSER_EVIDENCE_PATH: ${{ github.workspace }}/artifacts/web-local-finished-product/${{ github.sha }}/browser-evidence.json
        run: python -m services.web_agent_live_certification

      - name: Verify accepted Web receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ['WEB_AGENT_PROOF_DIR']) / 'web-agent-live-receipt.json').read_text())
          assert receipt['status'] == 'VERIFIED'
          assert receipt['scope'] == 'P1_WEB'
          assert receipt['revision_sha'] == os.environ['GITHUB_SHA']
          assert receipt['target_agent_count'] == 6
          assert receipt['verified_agent_count'] == 6
          assert receipt['zero_cost_openrouter_only'] is True
          assert receipt['browser_e2e_real'] is True
          assert receipt['public_production_proven'] is False
          assert receipt['matrix_summary'] == {'registered': 41, 'executable': 0, 'verified': 6}
          assert len(receipt['agents']) == 6
          assert all(agent['readiness'] == 'verified' for agent in receipt['agents'])
          print('WEB_AGENT_RECEIPT_ACCEPTED=TRUE')
          PY

      - name: Upload immutable Web live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-web-live-proof-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/web-agent-live-proof
            artifacts/web-local-finished-product/${{ github.sha }}/browser-evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish sanitized Web commit status
        if: always()
        env:
          WEB_JOB_STATUS: ${{ job.status }}
          WEB_STATUS_TOKEN: ${{ github.token }}
          WEB_STATUS_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          accepted = False
          receipt_path = Path(os.environ['WEB_AGENT_PROOF_DIR']) / 'web-agent-live-receipt.json'
          if os.environ.get('WEB_JOB_STATUS') == 'success' and receipt_path.is_file():
              try:
                  receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
                  agents = receipt.get('agents')
                  accepted = (
                      receipt.get('status') == 'VERIFIED'
                      and receipt.get('revision_sha') == os.environ['GITHUB_SHA']
                      and receipt.get('target_agent_count') == 6
                      and receipt.get('verified_agent_count') == 6
                      and receipt.get('zero_cost_openrouter_only') is True
                      and receipt.get('browser_e2e_real') is True
                      and receipt.get('public_production_proven') is False
                      and receipt.get('matrix_summary') == {'registered': 41, 'executable': 0, 'verified': 6}
                      and isinstance(agents, list) and len(agents) == 6
                      and all(isinstance(agent, dict) and agent.get('readiness') == 'verified' for agent in agents)
                  )
              except (OSError, ValueError, TypeError):
                  accepted = False
          state = 'success' if accepted else 'failure'
          description = 'Web live receipt accepted: 6/6 VERIFIED' if accepted else 'Web live certification failed closed'
          document = json.dumps({
              'state': state,
              'target_url': os.environ['WEB_STATUS_TARGET_URL'],
              'description': description,
              'context': 'ILAIOS Agent Web Live Certification',
          }, separators=(',', ':')).encode('utf-8')
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=document,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['WEB_STATUS_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in {200, 201}:
                  raise RuntimeError(f'commit status publish failed: HTTP {response.status}')
          print(f'WEB_COMMIT_STATUS={state}')
          PY
