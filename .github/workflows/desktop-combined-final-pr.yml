name: Desktop Combined Final PR Verification

on:
  pull_request:
    branches:
      - master
    paths:
      - 'apps/desktop/**'
      - 'tools/desktop/**'
      - '.github/workflows/desktop-combined-final-pr.yml'

permissions:
  contents: read

concurrency:
  group: desktop-combined-final-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-verify-package:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned Flutter SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flutter = Join-Path $env:RUNNER_TEMP 'flutter'
          git init $flutter
          git -C $flutter remote add origin https://github.com/flutter/flutter.git
          git -C $flutter fetch --depth 1 origin refs/tags/3.44.9:refs/tags/3.44.9
          git -C $flutter checkout --detach 3.44.9
          $resolved = (git -C $flutter rev-parse HEAD).Trim()
          if ($resolved -ne '6b182d2c7585eba26d4edce0f97630effd256c33') {
            throw "Unexpected Flutter revision: $resolved"
          }
          (Join-Path $flutter 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify, build, and package combined Desktop runtime
        shell: pwsh
        run: |
          ./tools/desktop/verify_and_package_combined.ps1 `
            -SourceSha '${{ github.event.pull_request.head.sha }}' `
            -RunId '${{ github.run_id }}'

      - name: Upload CI-verified combined package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-combined-ci-verified-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            artifacts/ILAIOS_DESKTOP_COMBINED_CI_VERIFIED_*.zip
            artifacts/ILAIOS_DESKTOP_COMBINED_CI_VERIFIED_*.zip.sha256
          if-no-files-found: error
          retention-days: 30
