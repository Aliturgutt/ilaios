name: Mobile Store Factory Continuation Gate

on:
  pull_request:
    branches:
      - master
    paths:
      - 'services/app_factory.py'
      - 'services/app_design_quality.py'
      - 'services/software_factory*.py'
      - 'services/mobile_*.py'
      - 'services/store_*.py'
      - 'tests/test_app_factory.py'
      - 'tests/test_app_design_quality.py'
      - 'tests/test_mobile_*.py'
      - 'tests/test_store_*.py'
      - '.github/mobile-store-factory-closure.json'
      - '.github/workflows/mobile-store-factory-continuation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-store-factory-continuation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    name: exact-head Mobile Store Factory checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "MOBILE_STORE_FACTORY_EXACT_HEAD=$SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/platform-ci.txt

      - name: Install locked validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r .github/requirements/platform-ci.txt
          python -m pip check

      - name: Validate durable closure ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/mobile-store-factory-closure.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schema_version'] == 'ilaios.mobile-store-factory-closure.v1'
          assert data['tracking_issue'] == 502
          assert data['truth_rule'] == 'NO_EVIDENCE_NO_DONE'
          assert data['checkpoint_protocol'] == 'branch-pr-exact-head-ci-merge-next-master'
          assert data['store_submission_requires_explicit_approval'] is True
          assert data['external_spend_authorized'] is False
          assert data['direct_app_factory_publication_authorized'] is False
          phases = data['phases']
          assert [phase['id'] for phase in phases] == list(range(1, 11))
          allowed = {'NOT_STARTED', 'IN_PROGRESS', 'IMPLEMENTED', 'TESTED', 'VERIFIED', 'BLOCKED'}
          assert all(phase['status'] in allowed for phase in phases)
          current = data['current_phase']
          assert 1 <= current <= 10
          assert phases[current - 1]['status'] != 'NOT_STARTED'
          assert all(phase['status'] == 'NOT_STARTED' for phase in phases[current:])
          invariants = set(data['blocking_invariants'])
          required = {
              'NO_CORE_REWRITE',
              'UNKNOWN_POLICY_IS_BLOCK',
              'CERTIFIED_BINARY_IDENTITY_MUST_MATCH_SUBMITTED_BINARY',
              'NO_SECRET_EXPOSURE_TO_LLM_OR_APP_FACTORY',
              'NO_AUTONOMOUS_STORE_SUBMISSION_OR_PUBLICATION',
              'NO_AUTONOMOUS_PAID_SPEND',
              'NO_SYNTHETIC_DEVICE_STORE_OR_PUBLICATION_EVIDENCE',
          }
          assert required <= invariants
          print(f"MOBILE_STORE_FACTORY_LEDGER=PASS current_phase={current}")
          PY

      - name: Run focused Mobile Store regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_app_factory.py \
            tests/test_app_design_quality.py \
            tests/test_store_release_certification.py \
            tests/test_store_ready_guard.py \
            tests/test_mobile_android_executor.py \
            tests/test_mobile_android_release.py \
            tests/test_mobile_android_build_executor.py \
            tests/test_mobile_android_device_executor.py

      - name: Run focused Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            services/app_factory.py \
            services/app_design_quality.py \
            services/store_release_certification.py \
            services/store_ready_guard.py \
            services/mobile_android_executor.py \
            services/mobile_android_release.py \
            services/mobile_android_build_executor.py \
            services/mobile_android_device_executor.py \
            tests/test_app_factory.py \
            tests/test_app_design_quality.py \
            tests/test_store_release_certification.py \
            tests/test_store_ready_guard.py \
            tests/test_mobile_android_executor.py \
            tests/test_mobile_android_release.py \
            tests/test_mobile_android_build_executor.py \
            tests/test_mobile_android_device_executor.py

      - name: Run focused strict Mypy
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy --strict \
            services/app_factory.py \
            services/app_design_quality.py \
            services/store_release_certification.py \
            services/store_ready_guard.py \
            services/mobile_android_executor.py \
            services/mobile_android_release.py \
            services/mobile_android_build_executor.py \
            services/mobile_android_device_executor.py \
            tests/test_store_release_certification.py \
            tests/test_store_ready_guard.py \
            tests/test_mobile_android_executor.py \
            tests/test_mobile_android_release.py \
            tests/test_mobile_android_build_executor.py \
            tests/test_mobile_android_device_executor.py

      - name: Publish checkpoint summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '## ILAIOS Mobile Store Factory Continuation Gate' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact PR head: \`${SOURCE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Tracking issue: `#502`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Rule: `NO_EVIDENCE_NO_DONE`' >> "$GITHUB_STEP_SUMMARY"
          echo '- This gate proves bounded source/test checkpoint quality only; it does not claim a real APK/AAB build, real adb device execution, signing, Google Play submission/publication, STORE_READY, or live-install verification.' >> "$GITHUB_STEP_SUMMARY"
