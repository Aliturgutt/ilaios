name: Video Provider Certification Status

on:
  workflow_run:
    workflows: ["Video Provider Production Certification"]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: video-provider-certification-status-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact-SHA provider certification status
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish provider certification result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          case "$CONCLUSION" in
            success)
              state="success"
              description="Video provider certification PASS on exact SHA"
              ;;
            failure|timed_out|cancelled|action_required)
              state="failure"
              description="Video provider certification ${CONCLUSION} on exact SHA"
              ;;
            *)
              state="error"
              description="Video provider certification ${CONCLUSION:-unknown}"
              ;;
          esac

          payload="$({
            STATE="$state" DESCRIPTION="$description" python - <<'PY'
          import json
          import os

          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "ILAIOS Video Provider Certification",
              "description": os.environ["DESCRIPTION"][:140],
              "target_url": os.environ["RUN_URL"],
          }))
          PY
          })"

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --data "$payload"
