name: Website Rebuild Closure

on:
  push:
    branches: [website-v2-rebuild-57f359b7]
    paths:
      - 'apps/website/**'
      - '.github/workflows/website-rebuild-closure.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/website/**'
      - '.github/workflows/website-rebuild-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-rebuild-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  website-ci:
    name: Website build and quality gates
    uses: ./.github/workflows/website-ci.yml

  rendered-browser-qa:
    name: EN/TR dark-light desktop-tablet-mobile browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install exact website and browser QA runtime
        run: |
          npm ci --prefix apps/website --ignore-scripts --audit=false --fund=false
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run static quality gates
        working-directory: apps/website
        run: |
          npm run lint
          npm run typecheck
          npm run test:quality
          npm run build

      - name: Start production-mode website
        shell: bash
        run: |
          set -euo pipefail
          (cd apps/website && NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3100 npm run start -- -H 127.0.0.1 -p 3100) > /tmp/ilaios-website-rebuild.log 2>&1 &
          echo $! > /tmp/ilaios-website-rebuild.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ilaios-website-rebuild.log
          exit 1

      - name: Run rendered route, navigation and visual QA
        env:
          ILAIOS_V2_BASE_URL: http://127.0.0.1:3100
          ILAIOS_V2_VISUAL_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/website-rebuild-closure
        run: python apps/website/scripts/website-v2-visual-qa.py

      - name: Upload exact-head browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-rebuild-closure-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: artifacts/website-rebuild-closure
          if-no-files-found: error
          retention-days: 30

      - name: Stop production-mode website
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/ilaios-website-rebuild.pid ]; then
            kill "$(cat /tmp/ilaios-website-rebuild.pid)" || true
          fi
