name: Brand Stale Contract Fix

on:
  push:
    branches:
      - brand/canonical-neutral-palette-20260902
    paths:
      - '.github/workflows/brand-stale-contract-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: brand/canonical-neutral-palette-20260902
          fetch-depth: 0

      - name: Apply bounded stale-contract fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test = Path('tests/test_app_ilaios_login_surface.py')
          text = test.read_text(encoding='utf-8')
          old = 'assert "Sign in to continue" in document'
          new = 'assert "Sign in to ILAIOS" in document'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected login assertion count: {text.count(old)}')
          test.write_text(text.replace(old, new), encoding='utf-8')

          workflow_paths = [
              Path('.github/workflows/desktop-windows-release.yml'),
              Path('.github/workflows/desktop-msix-packaging.yml'),
          ]
          retired = (
              '02-ilaios-primary-horizontal-dark.jpg',
              '03-ilaios-symbol-dark.jpg',
          )
          for path in workflow_paths:
              source = path.read_text(encoding='utf-8')
              before = source
              lines = source.splitlines(keepends=True)
              lines = [line for line in lines if not any(name in line for name in retired)]
              source = ''.join(lines)
              if source == before:
                  raise SystemExit(f'no stale runtime references removed from {path}')
              if any(name in source for name in retired):
                  raise SystemExit(f'stale retired runtime reference remains in {path}')
              if '05-ilaios-app-icon.jpg' not in source or '13-ilaios-primary-horizontal-light.jpg' not in source:
                  raise SystemExit(f'canonical 05/13 runtime owners missing from {path}')
              path.write_text(source, encoding='utf-8')
          PY

      - name: Validate targeted contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test = Path('tests/test_app_ilaios_login_surface.py').read_text(encoding='utf-8')
          assert 'assert "Sign in to continue" in document' not in test
          assert test.count('assert "Sign in to ILAIOS" in document') == 1

          for p in (
              Path('.github/workflows/desktop-windows-release.yml'),
              Path('.github/workflows/desktop-msix-packaging.yml'),
          ):
              text = p.read_text(encoding='utf-8')
              assert '02-ilaios-primary-horizontal-dark.jpg' not in text
              assert '03-ilaios-symbol-dark.jpg' not in text
              assert '05-ilaios-app-icon.jpg' in text
              assert '13-ilaios-primary-horizontal-light.jpg' in text
          print('BRAND_STALE_CONTRACT_TARGETED_VALIDATION=PASS')
          PY

      - name: Commit bounded fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_app_ilaios_login_surface.py \
            .github/workflows/desktop-windows-release.yml \
            .github/workflows/desktop-msix-packaging.yml
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/desktop-msix-packaging.yml' '.github/workflows/desktop-windows-release.yml' 'tests/test_app_ilaios_login_surface.py' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected changed paths:' >&2
            printf '%s\n' "$changed" >&2
            exit 20
          fi
          git commit -m 'fix(brand): align CI with canonical runtime owners'
          git push origin HEAD:brand/canonical-neutral-palette-20260902
