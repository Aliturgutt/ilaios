name: Brand Final Carbon Alignment

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/brand-final-master-resync.yml'

permissions:
  contents: write

jobs:
  align-login-carbon:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'brand/canonical-neutral-palette-20260902'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact brand branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: brand/canonical-neutral-palette-20260902
          fetch-depth: 0

      - name: Replace stale dark background fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web_app_runtime/login_server.py')
          text = path.read_text(encoding='utf-8')
          old = '#0B0E13'
          new = '#0A0A0A'
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'expected exactly 4 stale dark-carbon literals, found {count}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          if old in text:
              raise SystemExit('stale dark-carbon literal remains')
          PY
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'apps/web_app_runtime/login_server.py'
          grep -Fq '_BRAND_DARK = (_BRAND_DIR / "05-ilaios-app-icon.jpg").read_bytes()' apps/web_app_runtime/login_server.py
          grep -Fq '_BRAND_LIGHT = (_BRAND_DIR / "13-ilaios-primary-horizontal-light.jpg").read_bytes()' apps/web_app_runtime/login_server.py
          grep -Fq -- '--bg:#0A0A0A;' apps/web_app_runtime/login_server.py
          ! grep -Fq '#0B0E13' apps/web_app_runtime/login_server.py
          git diff --check

      - name: Commit and push bounded correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web_app_runtime/login_server.py
          git commit -m 'fix(brand): align login dark background to canonical carbon'
          git push origin HEAD:brand/canonical-neutral-palette-20260902
