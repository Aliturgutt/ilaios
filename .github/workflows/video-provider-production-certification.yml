name: Video Provider Production Certification

on:
  workflow_dispatch:
    inputs:
      proof_mode:
        description: Video provider certification path
        required: true
        default: managed-bounded
        type: choice
        options:
          - managed-bounded
          - desktop-managed-bounded
          - desktop-one-prompt
          - free-only
  push:
    branches:
      - master
    paths:
      - .github/video-provider-production-certification.trigger

permissions:
  contents: read
  statuses: write

concurrency:
  group: video-provider-production-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provider-proof:
    name: Bounded real-provider production proof
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    env:
      CERT_PROOF_MODE: ${{ github.event_name == 'push' && 'desktop-managed-bounded' || inputs.proof_mode }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VIDEO_FREE_PROVIDER_PROOF_DIR: artifacts/video-free-provider-proof
      VIDEO_FREE_PROVIDER_MODELS: bytedance/seedance-2.0-fast:free,bytedance/seedance-2.0:free,bytedance/seedance-1-5-pro:free
      VIDEO_PROVIDER_PROOF_DIR: artifacts/video-provider-proof
      VIDEO_PROVIDER_MODEL: bytedance/seedance-2.0-fast
      VIDEO_PROVIDER_DURATION_SECONDS: "4"
      VIDEO_PROVIDER_RESOLUTION: 480p
      VIDEO_PROVIDER_ASPECT_RATIO: "16:9"
      VIDEO_PROVIDER_MAX_UNIT_PRICE_USD: "0.15"
      VIDEO_PROVIDER_MAX_TOTAL_COST_USD: "1.00"
      ILAIOS_VIDEO_MODEL_ID: bytedance/seedance-2.0-fast:free
      ILAIOS_VIDEO_MANAGED_MODEL_ID: bytedance/seedance-2.0-fast
      ILAIOS_VIDEO_MANAGED_E2E_MAX_TOTAL_USD: "1.00"
      ILAIOS_VIDEO_QA_MODEL_ID: openrouter/free
      ILAIOS_VIDEO_E2E_RESOLUTION: 480p
      VIDEO_DESKTOP_PROVIDER_PROOF_DIR: artifacts/video-desktop-provider-proof
      VIDEO_DESKTOP_MANAGED_PROVIDER_PROOF_DIR: artifacts/video-desktop-managed-provider-proof

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Desktop video runtime dependency
        if: ${{ env.CERT_PROOF_MODE == 'desktop-one-prompt' || env.CERT_PROOF_MODE == 'desktop-managed-bounded' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Verify Desktop free-route proof safety boundary
        if: ${{ env.CERT_PROOF_MODE == 'desktop-one-prompt' }}
        shell: bash
        run: |
          set -euo pipefail
          python --version
          ffmpeg -version | head -1
          ffprobe -version | head -1
          test -n "$OPENROUTER_API_KEY"
          case "$ILAIOS_VIDEO_MODEL_ID" in
            *:free) ;;
            *) echo "desktop-one-prompt is the explicit verified-free proof; use desktop-managed-bounded for the authorized paid Desktop proof" >&2; exit 1 ;;
          esac

      - name: Verify Desktop managed-bounded proof safety boundary
        if: ${{ env.CERT_PROOF_MODE == 'desktop-managed-bounded' }}
        shell: bash
        run: |
          set -euo pipefail
          python --version
          ffmpeg -version | head -1
          ffprobe -version | head -1
          test -n "$OPENROUTER_API_KEY"
          test "$ILAIOS_VIDEO_MANAGED_E2E_MAX_TOTAL_USD" = "1.00"
          case "$ILAIOS_VIDEO_MANAGED_MODEL_ID" in
            *:free) echo "desktop-managed-bounded requires the explicit managed provider model, not a free alias" >&2; exit 1 ;;
            "") echo "desktop-managed-bounded model is empty" >&2; exit 1 ;;
            *) ;;
          esac

      - name: Run real provider-backed Desktop verified-free finished-product E2E
        if: ${{ env.CERT_PROOF_MODE == 'desktop-one-prompt' }}
        shell: bash
        run: |
          set -euo pipefail
          python apps/desktop/e2e/provider_video_finished_product_e2e.py

      - name: Run real provider-backed Desktop managed-bounded finished-product E2E
        if: ${{ env.CERT_PROOF_MODE == 'desktop-managed-bounded' }}
        shell: bash
        run: |
          set -euo pipefail
          python apps/desktop/e2e/provider_video_managed_finished_product_e2e.py

      - name: Run real free-only provider certification
        if: ${{ env.CERT_PROOF_MODE == 'free-only' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m src.video_automation.free_provider_production_certification

      - name: Run bounded paid proof through canonical managed provider path
        if: ${{ env.CERT_PROOF_MODE == 'managed-bounded' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m src.video_automation.provider_production_certification

      - name: Publish Desktop verified-free provider proof summary
        if: ${{ always() && env.CERT_PROOF_MODE == 'desktop-one-prompt' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## Desktop Provider-Backed Video Factory — Verified Free Route" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$VIDEO_DESKTOP_PROVIDER_PROOF_DIR/receipt.json" ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          proof_dir = Path(os.environ["VIDEO_DESKTOP_PROVIDER_PROOF_DIR"])
          receipt = json.loads((proof_dir / "receipt.json").read_text(encoding="utf-8"))
          print(f"- Status: `{receipt.get('status')}`")
          print(f"- Execution: `{receipt.get('execution_status')}`")
          print(f"- Provider model: `{receipt.get('provider_model')}`")
          print(f"- QA model: `{receipt.get('qa_model')}`")
          print(f"- Semantic score/threshold: `{receipt.get('semantic_score')}` / `{receipt.get('semantic_threshold')}`")
          print(f"- Generated shots: `{receipt.get('generated_shot_count')}`")
          print(f"- Duration: `{receipt.get('duration_seconds')}` seconds")
          print(f"- Video/audio: `{receipt.get('video_codec')}` / `{receipt.get('audio_codec')}`")
          print(f"- Artifact SHA-256: `{receipt.get('artifact_sha256')}`")
          print(f"- Artifact bytes: `{receipt.get('artifact_bytes')}`")
          print(f"- Verified free-route cost zero: `{receipt.get('provider_cost_zero')}`")
          print("- This zero-cost assertion applies only to the explicit verified-free route.")
          PY
          else
            printf '%s\n' '- Status: NO_ACCEPTED_RECEIPT' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish Desktop managed-bounded provider proof summary
        if: ${{ always() && env.CERT_PROOF_MODE == 'desktop-managed-bounded' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## Desktop Provider-Backed Video Factory — Managed Bounded Route" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$VIDEO_DESKTOP_MANAGED_PROVIDER_PROOF_DIR/receipt.json" ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          proof_dir = Path(os.environ["VIDEO_DESKTOP_MANAGED_PROVIDER_PROOF_DIR"])
          receipt = json.loads((proof_dir / "receipt.json").read_text(encoding="utf-8"))
          print(f"- Status: `{receipt.get('status')}`")
          print(f"- Revision: `{receipt.get('revision_sha')}`")
          print(f"- Execution: `{receipt.get('execution_status')}`")
          print(f"- Provider model: `{receipt.get('provider_model')}`")
          print(f"- Provider cost mode: `{receipt.get('provider_cost_mode')}`")
          print(f"- Provider actual cost USD: `{receipt.get('provider_cost_usd')}`")
          print(f"- Authorized hard cap USD: `{receipt.get('provider_cost_hard_cap_usd')}`")
          print(f"- QA model: `{receipt.get('qa_model')}`")
          print(f"- Semantic score/threshold: `{receipt.get('semantic_score')}` / `{receipt.get('semantic_threshold')}`")
          print(f"- Generated shots: `{receipt.get('generated_shot_count')}`")
          print(f"- Duration: `{receipt.get('duration_seconds')}` seconds")
          print(f"- Video/audio: `{receipt.get('video_codec')}` / `{receipt.get('audio_codec')}`")
          print(f"- Artifact SHA-256: `{receipt.get('artifact_sha256')}`")
          print(f"- Artifact bytes: `{receipt.get('artifact_bytes')}`")
          print("- Automatic paid fallback: `FALSE`")
          PY
          else
            printf '%s\n' '- Status: NO_ACCEPTED_RECEIPT' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish free-provider proof summary
        if: ${{ always() && env.CERT_PROOF_MODE == 'free-only' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## Video Free Provider Production Certification" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$VIDEO_FREE_PROVIDER_PROOF_DIR/free-provider-receipt.json" ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          proof_dir = Path(os.environ["VIDEO_FREE_PROVIDER_PROOF_DIR"])
          receipt = json.loads(
              (proof_dir / "free-provider-receipt.json").read_text(encoding="utf-8")
          )
          artifact = receipt.get("artifact") or {}
          print(f"- Status: `{receipt.get('status')}`")
          print(f"- Revision: `{receipt.get('revision_sha')}`")
          print(f"- Model: `{receipt.get('selected_model', 'n/a')}`")
          print(f"- External job: `{receipt.get('external_job_id', 'n/a')}`")
          print(f"- Provider-reported cost USD: `{receipt.get('provider_reported_cost_usd', 'n/a')}`")
          print(f"- Artifact SHA-256: `{artifact.get('sha256', 'n/a')}`")
          print(f"- Artifact bytes: `{artifact.get('bytes', 'n/a')}`")
          print("- Paid fallback allowed: `FALSE`")
          print("- Only explicit `:free` model IDs may reach this provider POST boundary.")
          print("- Credential material is never written to evidence or logs.")
          PY
          else
            printf '%s\n' '- Status: NO_RECEIPT' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish managed paid-provider proof summary
        if: ${{ always() && env.CERT_PROOF_MODE == 'managed-bounded' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## Video Provider Production Certification — Commercial Bounded" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$VIDEO_PROVIDER_PROOF_DIR/provider-receipt.json" ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          proof_dir = Path(os.environ["VIDEO_PROVIDER_PROOF_DIR"])
          receipt = json.loads(
              (proof_dir / "provider-receipt.json").read_text(encoding="utf-8")
          )
          artifact = receipt.get("artifact") or {}
          quote = receipt.get("customer_quote") or {}
          reconciliation = receipt.get("commercial_reconciliation") or {}
          print(f"- Status: `{receipt.get('status')}`")
          print(f"- Cost mode: `{receipt.get('cost_mode')}`")
          print(f"- Revision: `{receipt.get('revision_sha')}`")
          print(f"- Provider/model: `{receipt.get('provider')}` / `{receipt.get('model')}`")
          print(f"- Request: `{receipt.get('request_id', 'n/a')}`")
          print(f"- Quote ID: `{quote.get('quote_id', 'n/a')}`")
          print(f"- Authorized workflow cap (USD): `{(receipt.get('budget_guard') or {}).get('max_total_cost_usd', 'n/a')}`")
          print(f"- Customer total before generation (microUSD): `{quote.get('gross_customer_price_microusd', 'n/a')}`")
          print(f"- Locked provider ceiling (microUSD): `{quote.get('provider_cost_ceiling_microusd', 'n/a')}`")
          print(f"- Actual provider cost (microUSD): `{reconciliation.get('actual_provider_cost_microusd', 'n/a')}`")
          print(f"- Actual margin / hard floor (bps): `{reconciliation.get('actual_margin_bps', 'n/a')}` / `{reconciliation.get('hard_min_margin_bps', 'n/a')}`")
          print(f"- Commercial cost proven: `{receipt.get('commercial_cost_proven', False)}`")
          print(f"- External job: `{receipt.get('external_job_id', 'n/a')}`")
          print(f"- Artifact SHA-256: `{artifact.get('sha256', 'n/a')}`")
          print(f"- Artifact bytes: `{artifact.get('bytes', 'n/a')}`")
          print("- Positive provider cost is valid when it remains inside the locked quote and margin floor.")
          print("- Credential material is never written to evidence or logs.")
          PY
          else
            printf '%s\n' '- Status: NO_RECEIPT' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable Desktop provider finished-product proof
        if: ${{ always() && env.CERT_PROOF_MODE == 'desktop-one-prompt' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-provider-video-proof-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/video-desktop-provider-proof
          if-no-files-found: warn
          retention-days: 30

      - name: Upload immutable Desktop managed-provider finished-product proof
        if: ${{ always() && env.CERT_PROOF_MODE == 'desktop-managed-bounded' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-managed-provider-video-proof-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/video-desktop-managed-provider-proof
          if-no-files-found: warn
          retention-days: 30

      - name: Upload immutable free-provider proof evidence
        if: ${{ always() && env.CERT_PROOF_MODE == 'free-only' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: video-free-provider-proof-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/video-free-provider-proof
          if-no-files-found: warn
          retention-days: 30

      - name: Upload immutable managed-provider proof evidence
        if: ${{ always() && env.CERT_PROOF_MODE == 'managed-bounded' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: video-provider-production-proof-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/video-provider-proof
          if-no-files-found: warn
          retention-days: 30

      - name: Publish sanitized managed Desktop certification commit status
        if: ${{ always() && env.CERT_PROOF_MODE == 'desktop-managed-bounded' }}
        shell: bash
        env:
          VIDEO_PROVIDER_JOB_STATUS: ${{ job.status }}
          VIDEO_PROVIDER_STATUS_TOKEN: ${{ github.token }}
          VIDEO_PROVIDER_STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          def is_sha256(value: object) -> bool:
              return (
                  isinstance(value, str)
                  and len(value) == 64
                  and all(character in "0123456789abcdef" for character in value)
              )

          accepted = False
          receipt_path = Path(os.environ["VIDEO_DESKTOP_MANAGED_PROVIDER_PROOF_DIR"]) / "receipt.json"
          if os.environ.get("VIDEO_PROVIDER_JOB_STATUS") == "success" and receipt_path.is_file():
              try:
                  receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
                  semantic_score = receipt.get("semantic_score")
                  semantic_threshold = receipt.get("semantic_threshold")
                  provider_cost = receipt.get("provider_cost_microusd")
                  hard_cap = receipt.get("provider_cost_hard_cap_microusd")
                  accepted = (
                      receipt.get("status") == "PASS"
                      and receipt.get("revision_sha") == os.environ["GITHUB_SHA"]
                      and receipt.get("execution_status") == "ACCEPTED"
                      and receipt.get("provider_cost_mode") == "managed-bounded"
                      and receipt.get("provider_cost_proven") is True
                      and isinstance(provider_cost, int)
                      and not isinstance(provider_cost, bool)
                      and isinstance(hard_cap, int)
                      and not isinstance(hard_cap, bool)
                      and hard_cap == 1_000_000
                      and 0 <= provider_cost <= hard_cap
                      and receipt.get("provider_cost_hard_cap_usd") == "1.00"
                      and isinstance(receipt.get("provider_model"), str)
                      and bool(receipt.get("provider_model"))
                      and isinstance(receipt.get("qa_model"), str)
                      and bool(receipt.get("qa_model"))
                      and is_sha256(receipt.get("artifact_sha256"))
                      and isinstance(receipt.get("artifact_bytes"), int)
                      and receipt.get("artifact_bytes", 0) > 100_000
                      and isinstance(receipt.get("duration_seconds"), (int, float))
                      and 7.0 <= float(receipt.get("duration_seconds")) <= 9.0
                      and receipt.get("width") == 1920
                      and receipt.get("height") == 1080
                      and receipt.get("video_codec") == "h264"
                      and receipt.get("audio_codec") == "aac"
                      and isinstance(semantic_score, (int, float))
                      and isinstance(semantic_threshold, (int, float))
                      and float(semantic_score) >= float(semantic_threshold)
                      and receipt.get("generated_shot_count") == 2
                      and receipt.get("generation_mode") == "provider-backed-cinematic-video"
                  )
              except (OSError, ValueError, TypeError):
                  accepted = False

          state = "success" if accepted else "failure"
          description = (
              "Video provider E2E accepted: exact-SHA MP4/QA/cost PASS"
              if accepted
              else "Video provider E2E failed closed"
          )
          document = json.dumps(
              {
                  "state": state,
                  "target_url": os.environ["VIDEO_PROVIDER_STATUS_TARGET_URL"],
                  "description": description,
                  "context": "ILAIOS Video Provider Production Certification",
              },
              separators=(",", ":"),
          ).encode("utf-8")
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=document,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['VIDEO_PROVIDER_STATUS_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in {200, 201}:
                  raise RuntimeError(f"commit status publish failed: HTTP {response.status}")
          print(f"VIDEO_PROVIDER_COMMIT_STATUS={state}")
          PY