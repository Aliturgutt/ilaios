name: ILAIOS Desktop MSIX Packaging

on:
  push:
    branches:
      - master
    paths:
      - 'apps/desktop/**'
      - 'brand/assets/05-ilaios-app-icon.jpg'
      - '.github/workflows/desktop-msix-packaging.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'apps/desktop/**'
      - 'brand/assets/05-ilaios-app-icon.jpg'
      - '.github/workflows/desktop-msix-packaging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-msix-packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-msix:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        working-directory: apps/desktop
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        working-directory: apps/desktop
        run: flutter analyze

      - name: Test
        working-directory: apps/desktop
        run: flutter test

      - name: Build Windows release
        working-directory: apps/desktop
        run: flutter build windows --release

      - name: Build bundled control plane
        working-directory: apps/desktop
        shell: pwsh
        run: ./tool/build_control_plane_sidecar.ps1

      - name: Build unsigned MSIX
        working-directory: apps/desktop
        shell: pwsh
        run: ./tool/build_msix.ps1

      - name: Inspect package
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem build\msix\*.msix | Select-Object -First 1
          if ($null -eq $msix) { throw 'MSIX artifact not found.' }
          $makeAppx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $makeAppx) { throw 'MakeAppx.exe not found.' }
          $unpack = Join-Path $env:RUNNER_TEMP 'ilaios-msix-unpacked'
          Remove-Item $unpack -Recurse -Force -ErrorAction SilentlyContinue
          & $makeAppx.FullName unpack /p $msix.FullName /d $unpack /o
          if ($LASTEXITCODE -ne 0) { throw 'MSIX unpack validation failed.' }
          if (-not (Test-Path (Join-Path $unpack 'ilaios_desktop.exe'))) { throw 'Packaged executable missing.' }
          if (-not (Test-Path (Join-Path $unpack 'ilaios_control_plane.exe'))) { throw 'Packaged control-plane sidecar missing.' }
          if (-not (Test-Path (Join-Path $unpack 'AppxManifest.xml'))) { throw 'Packaged manifest missing.' }
          Write-Host 'ILAIOS_DESKTOP_MSIX_INSPECTION=PASS'

      - name: Upload unsigned CI package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ilaios-desktop-msix-unsigned-ci
          path: apps/desktop/build/msix/*.msix
          if-no-files-found: error
          retention-days: 7
