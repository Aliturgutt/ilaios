name: Phase16 Governed Web Factory Wiring

on:
  push:
    branches:
      - web/phase16-3d-runtime-foundation-20260820
    paths:
      - .github/workflows/phase16-governed-web-factory-wiring.yml

permissions:
  contents: write

concurrency:
  group: phase16-governed-web-factory-wiring
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Phase 16 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: web/phase16-3d-runtime-foundation-20260820
          fetch-depth: 0

      - name: Verify expected branch head lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1c31f02d9d25b56889bb731bde48d959b0db4dcd HEAD

      - name: Apply bounded GovernedWebFactory wiring
        shell: bash
        run: |
          set -euo pipefail
          python tools/web-factory/apply_phase16_governed_web_factory_wiring.py
          python -m py_compile services/integrations/web_factory.py

      - name: Commit source wiring
        shell: bash
        run: |
          set -euo pipefail
          git diff -- services/integrations/web_factory.py
          git add services/integrations/web_factory.py
          git diff --cached --quiet && exit 0
          git config user.name "ILAIOS Phase16 Wiring"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat(web): wire optional 3D runtime into GovernedWebFactory"
          git push origin HEAD:web/phase16-3d-runtime-foundation-20260820
