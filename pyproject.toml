[project]
name = "ILAIOS"
dynamic = ["version"]
dependencies = [
    "requests",
    "python-dotenv",
]

[tool.mypy]
mypy_path = "."
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jwt", "jwt.*"]
ignore_missing_imports = true
