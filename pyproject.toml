[project]
name = "ILAIOS"
dynamic = ["version"]
dependencies = [
    "requests",
    "python-dotenv",
]

[tool.mypy]
mypy_path = "."
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jwt", "jwt.*"]
ignore_missing_imports = true

# These standalone E2E entrypoints deliberately bootstrap the repository root
# onto sys.path before importing ILAIOS packages. Keep the E402 exception
# narrowly scoped to those executable scripts; the rest of the repository
# remains covered by `ruff check .`.
[tool.ruff.per-file-ignores]
"apps/desktop/e2e/provider_video_finished_product_e2e.py" = ["E402"]
"apps/desktop/e2e/provider_video_reference_finished_product_e2e.py" = ["E402"]
"apps/desktop/e2e/provider_video_native_reference_finished_product_e2e.py" = ["E402"]
