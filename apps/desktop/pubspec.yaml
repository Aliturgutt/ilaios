publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - ../../brand/assets/02-ilaios-primary-horizontal-dark.jpg
    - ../../brand/assets/04-ilaios-symbol-light.jpg
    - ../../brand/assets/05-ilaios-app-icon.jpg
    - ../../brand/assets/13-ilaios-primary-horizontal-light.jpg
