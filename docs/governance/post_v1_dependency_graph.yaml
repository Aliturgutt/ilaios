schema_version: "1.2"
status: "ADOPTED_CANONICAL"
name: "ILAIOS Post-v1 Dependency Graph"
authority: "governed_post_v1_execution"
adopted_from: "docs/governance/post_v1_dependency_graph.draft.yaml"
adopted_direction: "RAG_KNOWLEDGE"

safety:
  repository_evidence_is_truth: true
  deterministic_first: true
  no_dependency_bypass: true
  no_test_weakening: true
  no_architecture_redefinition: true
  no_autonomous_production_promotion: true
  website_scope_excluded: true
  desktop_scope_excluded: true
  production_mutation_requires_explicit_human_authorization: true

nodes:
  GOV_BASELINE:
    purpose: "Synchronize repository truth and governance after v1 production release."
    dependencies: ["RELEASE.R03"]
    state: "VERIFIED"
    evidence:
      - "GOVERNANCE.md"
      - "SECURITY.md"
      - "docs/governance/CAPABILITY_MATRIX.md"
      - ".github/workflows/platform-ci.yml"

  CAPABILITY_REVALIDATION:
    purpose: "Revalidate implemented capabilities before rewrite or expansion."
    dependencies: ["GOV_BASELINE"]
    state: "VERIFIED"
    evidence:
      - "PR #24"
      - "PR #25"
    targets:
      - "code_intelligence"
      - "knowledge_graph"
      - "project_manager"
      - "web_factory_foundation"
      - "software_factory_foundation"
      - "privacy_boundary"
      - "cryptography_boundary"
      - "security_factory_foundation"

  PRODUCT_SELECTION:
    purpose: "Select exactly one primary post-v1 workstream."
    dependencies: ["CAPABILITY_REVALIDATION"]
    state: "SELECTED"
    selected: "RAG_KNOWLEDGE"
    selection_basis: "Owner-directed roadmap continuation after VERIFIED Existing Factory Promotion; RAG/Knowledge is the next single primary workstream. Website and Desktop remain separate workstreams."

  EXISTING_FACTORY_PROMOTION:
    purpose: "Promote existing and planned ILAIOS factory capabilities through bounded implementation and fresh end-to-end evidence."
    dependencies: ["CAPABILITY_REVALIDATION"]
    state: "VERIFIED"
    order:
      - "AGENT_EXECUTOR_E2E"
      - "RESEARCH_DATA_FACTORY"
      - "CREATIVE_DOCUMENT_FACTORY"
      - "COMMERCE_GROWTH_FACTORY"
      - "PERSONAL_OPERATIONS_FACTORY"
      - "APP_FACTORY_PLATFORM_BOUNDARY"
      - "ENTERPRISE_HARDENING"
      - "FINAL_LINEAGE_REDTEAM"

  AGENT_EXECUTOR_E2E:
    purpose: "Prove named ILAIOS agents can execute bounded governed work through stable machine IDs and independent verification."
    dependencies: ["EXISTING_FACTORY_PROMOTION"]
    state: "VERIFIED"

  RESEARCH_DATA_FACTORY:
    purpose: "Create a bounded research/data factory on existing knowledge, privacy and evidence foundations."
    dependencies: ["AGENT_EXECUTOR_E2E"]
    state: "VERIFIED"

  CREATIVE_DOCUMENT_FACTORY:
    purpose: "Create a bounded creative/document factory on workflow, evidence and policy foundations."
    dependencies: ["RESEARCH_DATA_FACTORY"]
    state: "VERIFIED"

  COMMERCE_GROWTH_FACTORY:
    purpose: "Create a bounded commerce/growth factory without billing or paid-provider mutation."
    dependencies: ["CREATIVE_DOCUMENT_FACTORY"]
    state: "VERIFIED"

  PERSONAL_OPERATIONS_FACTORY:
    purpose: "Create a bounded personal-operations automation factory using governed workflow/runtime primitives."
    dependencies: ["COMMERCE_GROWTH_FACTORY"]
    state: "VERIFIED"

  APP_FACTORY_PLATFORM_BOUNDARY:
    purpose: "Define and prove the platform-side App Factory boundary without modifying Desktop, Website or mobile client implementations."
    dependencies: ["PERSONAL_OPERATIONS_FACTORY"]
    state: "VERIFIED"

  ENTERPRISE_HARDENING:
    purpose: "Apply cross-cutting recovery, isolation, provenance, observability, security and cost gates to promoted factories."
    dependencies: ["APP_FACTORY_PLATFORM_BOUNDARY"]
    state: "VERIFIED"

  FINAL_LINEAGE_REDTEAM:
    purpose: "Run final Hermes -> ILAKOS -> ILATEN -> ILAIOS capability, identity, security and regression audit."
    dependencies: ["ENTERPRISE_HARDENING"]
    state: "VERIFIED"

  RAG_KNOWLEDGE:
    purpose: "Build bounded tenant-isolated retrieval-augmented knowledge on existing Research/Data, Knowledge Graph, Privacy/DLP, evidence and governed-runtime foundations."
    dependencies: ["FINAL_LINEAGE_REDTEAM", "RESEARCH_DATA_FACTORY", "ENTERPRISE_HARDENING"]
    state: "VERIFIED"
    verified_scope: "BOUNDED_REFERENCE_IMPLEMENTATION"
    production_state: "NO_GO_PENDING_RAG14_RUNTIME_EVIDENCE"
    required_gates:
      - "tenant_isolation"
      - "authorization_aware_retrieval"
      - "source_provenance"
      - "privacy_dlp"
      - "deterministic_evidence"
      - "full_platform_ci"
    evidence:
      - "PR #111"
      - "merge cb0fde61ba0fd74add11c227bf827cb62c01ff48"
      - "Required CI Gate #185 PASS on head 38476e8a23313baf6206b37183693fbad5d29dab"
      - "services/knowledge_rag.py"
      - "tests/test_knowledge_rag.py"
      - "tests/test_knowledge_rag_redteam.py"
      - "tests/test_knowledge_rag_registry.py"
      - "docs/governance/RAG_KNOWLEDGE_IMPLEMENTATION.md"
    production_blockers:
      - "approved production embedding provider/model evidence"
      - "durable production index/vector persistence evidence"
      - "production tenant-isolation and authorization-policy exercise"
      - "production DLP/injection/leakage red-team evidence"
      - "production backup/restore and deletion/revocation reconciliation evidence"
      - "production SLO/observability/alert evidence"
      - "exact release/deployment and rollback evidence"

inactive_alternatives:
  MOBILE:
    state: "DORMANT_NOT_SELECTED"
  COMMERCIAL_SAAS:
    state: "DORMANT_NOT_SELECTED"

external_owner_gates:
  - "master branch protection policy"
  - "repository license decision"
  - "store/developer-account actions for client distribution"
  - "payment/provider/account actions for commercial billing"
