schema_version: "0.1-draft"
status: "NON_CANONICAL_PROPOSAL"
name: "ILAIOS Post-v1 Dependency Graph"
authority: "planning_only"
canonical_amendment_required_before_execution: true

safety:
  repository_evidence_is_truth: true
  deterministic_first: true
  no_dependency_bypass: true
  no_test_weakening: true
  no_architecture_redefinition: true
  no_autonomous_production_promotion: true
  website_scope_excluded: true
  desktop_scope_excluded: true

nodes:
  GOV_BASELINE:
    purpose: "Synchronize repository truth and governance after v1 production release."
    dependencies: ["RELEASE.R03"]
    state: "IN_PROGRESS_ON_GOVERNANCE_BRANCH"
    exit:
      - "status and historical roadmap no longer contradict repository evidence"
      - "security/governance/contribution policy exists"
      - "CI/workflow audit exists"
      - "capability matrix exists"

  CAPABILITY_REVALIDATION:
    purpose: "Revalidate implemented capabilities before rewrite or expansion."
    dependencies: ["GOV_BASELINE"]
    state: "PROPOSED"
    targets:
      - "code_intelligence"
      - "knowledge_graph"
      - "project_manager"
      - "web_factory_foundation"
      - "software_factory_foundation"
      - "privacy_boundary"
      - "cryptography_boundary"

  PRODUCT_SELECTION:
    purpose: "Select exactly one primary net-new post-v1 workstream."
    dependencies: ["CAPABILITY_REVALIDATION"]
    state: "PROPOSED_HUMAN_DECISION"
    candidates:
      - "MOBILE"
      - "COMMERCIAL_SAAS"
      - "RAG_KNOWLEDGE"
      - "EXISTING_FACTORY_PROMOTION"

  MOBILE:
    purpose: "Enable Android then iOS as backend-authoritative ILAIOS clients."
    dependencies: ["PRODUCT_SELECTION", "IDENTITY_TENANT_VERIFIED", "CONTROL_PLANE_CONTRACTS_STABLE"]
    activation_condition: "PRODUCT_SELECTION == MOBILE"
    state: "DORMANT_PROPOSAL"

  COMMERCIAL_SAAS:
    purpose: "Introduce entitlement, usage/quota and billing-provider integration."
    dependencies: ["PRODUCT_SELECTION", "IDENTITY_TENANT_VERIFIED"]
    activation_condition: "PRODUCT_SELECTION == COMMERCIAL_SAAS"
    state: "DORMANT_PROPOSAL"

  RAG_KNOWLEDGE:
    purpose: "Introduce tenant-safe retrieval and knowledge ingestion."
    dependencies: ["PRODUCT_SELECTION", "PRIVACY_BOUNDARY_VERIFIED"]
    activation_condition: "PRODUCT_SELECTION == RAG_KNOWLEDGE"
    state: "DORMANT_PROPOSAL"

  EXISTING_FACTORY_PROMOTION:
    purpose: "Promote existing factory foundations through fresh end-to-end evidence."
    dependencies: ["PRODUCT_SELECTION", "CAPABILITY_REVALIDATION"]
    activation_condition: "PRODUCT_SELECTION == EXISTING_FACTORY_PROMOTION"
    state: "DORMANT_PROPOSAL"

  ENTERPRISE_HARDENING:
    purpose: "Apply cross-cutting recovery, isolation, provenance, observability and cost gates."
    dependencies: ["SELECTED_POSTV1_CAPABILITY_VERIFIED"]
    state: "PROPOSED"

external_owner_gates:
  - "master branch protection policy"
  - "repository license decision"
  - "version/tag/release policy"
  - "store/developer-account actions when Mobile is selected"
  - "payment/provider/account actions when Commercial SaaS is selected"
