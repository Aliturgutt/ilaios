schema_version: "1.0"
profile: provider_neutral_local_baseline
release_state: NOT_DEPLOYED
deployment_performed: false
composition_command: python -m services.deployment.runtime
adapters:
  relational_store: sqlite
  durable_queue: sqlite_outbox_inbox
  artifact_store: content_addressed_filesystem
  evidence_store: sqlite_hash_chain
secret_references:
  control_plane_token: env://ILAIOS_CONTROL_PLANE_TOKEN
  state_root: env://ILAIOS_STATE_ROOT
resources:
  cpu_request_millicores: 250
  cpu_limit_millicores: 1000
  memory_request_mebibytes: 256
  memory_limit_mebibytes: 1024
  ephemeral_storage_mebibytes: 2048
capacity:
  baseline_concurrent_workers: 4
  hard_cap_minor: 100
  request_body_max_bytes: 1048576
health:
  liveness_path: /health/live
  readiness_path: /health/ready
backup:
  format: ILAIOS_RUNTIME_BACKUP_V1
  restore_requires_empty_target: true
oci:
  format: OCI_IMAGE_LAYOUT_V1
  immutable_digest_required: true
