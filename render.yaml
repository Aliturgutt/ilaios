version: "1"

services:
  - type: web
    name: ilaios-web-app
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    branch: master
    buildCommand: pip install --disable-pip-version-check -r apps/web_app_runtime/requirements.txt
    startCommand: python -m apps.web_app_runtime.server
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    numInstances: 1
    domains:
      - app.ilaios.com
    disk:
      name: ilaios-identity
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ILAIOS_IDENTITY_DATABASE_PATH
        value: /var/data/ilaios_identity.db
      - key: ILAIOS_APP_HTTP_HOST
        value: 0.0.0.0
      - key: ILAIOS_WEB_SESSION_LIFETIME_SECONDS
        value: "3600"
      - key: ILAIOS_GOOGLE_PRODUCTION_WEB_REDIRECTS
        value: https://app.ilaios.com/auth/google/callback
      - key: ILAIOS_GOOGLE_PRODUCTION_WEB_CLIENT_ID
        sync: false
      - key: ILAIOS_GOOGLE_DEVELOPMENT_WEB_CLIENT_ID
        sync: false
      - key: ILAIOS_GOOGLE_DESKTOP_CLIENT_ID
        sync: false
      - key: ILAIOS_GOOGLE_PRODUCTION_WEB_CLIENT_SECRET
        sync: false
      - key: ILAIOS_GOOGLE_WEB_OAUTH_STATE_SECRET
        generateValue: true
      # Existing Blueprint: set all three Li values together in Render Dashboard.
      # ILAIOS_LI_DATABASE_PATH must use the attached persistent disk, e.g.
      # /var/data/ilaios_li.db. Partial Li configuration fails closed.
      - key: ILAIOS_LI_DATABASE_PATH
        sync: false
      - key: ILAIOS_LI_FOUNDER_USER_ID
        sync: false
      - key: ILAIOS_LI_FOUNDER_TENANT_ID
        sync: false
