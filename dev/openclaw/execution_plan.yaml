common_actions: &common_actions
  - id: "A01"
    type: "shell"
    command: "git status --porcelain=v1 --branch && git rev-parse HEAD && git rev-parse origin/master"
    read_only: true
  - id: "A02"
    type: "bounded_agent_audit_and_implementation"
    instruction: "Execute only the active package scope_intent and exit_intent using current repository evidence and established project patterns. Prefer proven existing code. Make only minimum bounded changes inside allowed_paths. Do not alter canonical authorities, dependency rules, security semantics, approval semantics, or release semantics. If exact completion cannot be proven, record FAIL/BLOCKED evidence and do not fake PASS."
  - id: "A03"
    type: "shell"
    command: "python -m pytest -q"
  - id: "A04"
    type: "shell"
    command: "ruff check ."
  - id: "A05"
    type: "shell"
    command: "mypy --strict src tests"
  - id: "A06"
    type: "shell"
    command: "pre-commit run --all-files"
  - id: "A07"
    type: "shell"
    command: "git diff --check && git status --porcelain=v1 --branch"
  - id: "A08"
    type: "controller_finalize"
    instruction: "Persist exact evidence. On PASS, stage only allowed changes, create one atomic commit if required, push to origin/master, verify HEAD == origin/master and clean worktree. On FAIL/BLOCKED, do not commit defective partial work; restore only active-package mutations when the declared rollback allows it, persist failure evidence, recompute the READY set, and continue only with milestones whose declared dependencies are proven PASS."


