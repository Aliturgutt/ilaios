schema_version: "1.0"
plan_id: "ILAIOS_OPENCLAW_EXECUTION_PLAN_v1_0"
controller: "dev/openclaw/MASTER_OPENCLAW.md"

canonical_authorities:
  - "ILAIOS_Master_Implementation_Specification_v1_0_CANONICAL_FINAL.docx"
  - "ILAIOS_Canonical_Milestone_Manifest_v1_0.docx"

execution:
  mode: "fail_closed"
  initial_milestone: "PRE.S00"
  auto_advance: true
  advance_requires_status: "READY"
  dependency_evidence_required: true
  prose_inference: false
  unknown_milestone: "STOP"
  missing_required_field: "STOP"
  architecture_changes: false
  release_auto_promotion: false

package_activation:
  rule: "Only a package explicitly present below with status READY may execute."
  missing_package: "STOP"
  blocked_package: "STOP"
  future_package_policy: "Future milestone packages are created only from repository evidence plus canonical requirements; OpenClaw must never invent missing actions, paths, validations, approvals, rollback, or release transitions."

evidence:
  normal_root: "dev/openclaw/evidence"
  pre_s00_root: "${HOME}/.openclaw/evidence/HermesEnterpriseOS/PRE.S00"
  claim_without_evidence: "STOP"

canonical_dependency_graph:
  PRE.S00: []
  VIDEO.V01: [PRE.S00]
  VIDEO.V02: [VIDEO.V01]
  VIDEO.V03: [VIDEO.V02]
