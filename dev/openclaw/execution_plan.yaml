  - {id: "V04", rule: "Required targeted and repository regression tests pass."}
  - {id: "V05", rule: "ruff, mypy --strict, pre-commit, and git diff --check pass."}
  - {id: "V06", rule: "No forbidden or unrelated file is modified."}
