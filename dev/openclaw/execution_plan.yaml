    actions: *video_actions
    validations: *video_validations
    requirements: *video_requirements
    evidence_requirements: ["dev/openclaw/evidence/VIDEO.V01/commands.log", "dev/openclaw/evidence/VIDEO.V01/tests.log", "dev/openclaw/evidence/VIDEO.V01/quality.log", "dev/openclaw/evidence/VIDEO.V01/git_before.txt", "dev/openclaw/evidence/VIDEO.V01/git_after.txt", "dev/openclaw/evidence/VIDEO.V01/decision.yaml"]
