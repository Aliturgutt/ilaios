# Shared VIDEO package values. Every VIDEO package below still declares every
# MASTER_OPENCLAW-required field explicitly; YAML anchors only deduplicate values.
video_allowed_paths: &video_allowed_paths
  - "src/video_automation/**"
  - "tests/test_video_automation_*.py"
  - "dev/openclaw/evidence/**"
video_forbidden_paths: &video_forbidden_paths
  - "src/core/**"
  - "src/code_intelligence/**"
  - "src/knowledge_graph/**"
  - "src/project_manager/**"
  - ".github/**"
  - "ILAIOS_*"
video_actions: &video_actions
  - id: "A01"
    type: "shell"
    command: "git status --porcelain=v1 --branch && git rev-parse HEAD && git rev-parse origin/master"
    read_only: true
  - id: "A02"
    type: "bounded_agent_audit"
    instruction: "For the active VIDEO package, use its legacy_traceability value only as repository traceability metadata. Determine the existing implementation/test evidence for that legacy milestone from tracked repository code, tests, and Git history. Documentation claims alone are not proof. Do not redesign, rename, or broaden scope."
  - id: "A03"
    type: "bounded_agent_repair_if_required"
    instruction: "If and only if A02 or required validation proves the active VIDEO milestone incomplete or defective, make the minimum repair needed inside allowed_paths. Preserve accepted earlier behavior. Do not edit forbidden_paths. Do not weaken/delete tests, bypass validation, add paid-provider calls, change architecture, or infer new product requirements. If an exact bounded repair cannot be proven from repository evidence, STOP."
  - id: "A04"
    type: "shell"
    command: "python -m pytest -q tests/test_video_automation_*.py"
  - id: "A05"
    type: "shell"
    command: "python -m pytest -q"
  - id: "A06"
    type: "shell"
    command: "ruff check ."
  - id: "A07"
    type: "shell"
    command: "mypy --strict src tests"
  - id: "A08"
    type: "shell"
    command: "pre-commit run --all-files"
  - id: "A09"
    type: "shell"
    command: "git diff --check && git status --porcelain=v1 --branch"
  - id: "A10"
    type: "controller_finalize"
    instruction: "Persist the active package's required durable evidence. If there were repository changes and all gates PASS, stage only allowed changed files, create one atomic milestone commit, push to origin/master, verify HEAD == origin/master and clean worktree. If no code change was required, do not create an empty commit; persist evidence and mark PASS only when every gate is proven."
video_validations: &video_validations
  - id: "V01"
    rule: "Every declared dependency has durable PASS evidence."
  - id: "V02"
    rule: "Repository branch is master and pre-state is captured before mutation."
  - id: "V03"
    rule: "The active legacy milestone traceability is proven from actual tracked implementation/tests/history, not prose alone."
  - id: "V04"
    rule: "All Video Automation tests pass."
  - id: "V05"
    rule: "Full repository pytest regression passes."
  - id: "V06"
    rule: "ruff, mypy --strict, pre-commit, and git diff --check pass."
  - id: "V07"
    rule: "No forbidden or unrelated file was modified."
  - id: "V08"
    rule: "If a commit was required, push succeeds, HEAD equals origin/master, and worktree is clean."
video_requirements: &video_requirements
  - "VIDEO_CHAIN_EXISTING_BEHAVIOR"
  - "DETERMINISTIC_VALIDATION"
  - "REPOSITORY_EVIDENCE_IS_TRUTH"
  - "MINIMUM_BOUNDED_CHANGE"
  - "NO_RENAME"
  - "NO_PLATFORM_REFACTOR"
  - "NO_TEST_WEAKENING"
  - "NO_PAID_PROVIDER_CALLS"
video_approvals: &video_approvals []
video_budget_policy: &video_budget_policy
  paid_provider_calls: false
  external_spend: false
video_rollback: &video_rollback
  - "Before commit, restore only files changed by the active package to the captured pre-state if validation fails; never reset or discard unrelated work."
  - "After a pushed commit, do not rewrite Git history. If rollback becomes necessary, STOP and require an explicit governed recovery package."
video_stop_conditions: &video_stop_conditions
  - "dependency_not_proven_pass"
  - "branch_is_not_master"
  - "unrelated_or_forbidden_change_required"
  - "canonical_or_repository_evidence_conflict"
  - "bounded_repair_not_provable"
  - "required_test_failed"
  - "full_regression_failed"
  - "ruff_failed"
  - "mypy_failed"
  - "pre_commit_failed"
  - "git_diff_check_failed"
  - "push_failed"
  - "head_not_equal_origin_master"
  - "worktree_not_clean_after_finalize"
video_expected_post_state: &video_expected_post_state
  branch: "master"
  decision: "PASS|FAIL|BLOCKED"
  forbidden_paths_modified: false
  tests: "PASS"
  quality_gates: "PASS"
  head_equals_origin_master_on_pass: true
  worktree_clean_on_pass: true
video_commit_policy: &video_commit_policy
  allow_commit: true
  allow_push: true
  force_push: false
  empty_commit: false
  one_atomic_commit_per_repair: true

packages:
  - milestone_id: "PRE.S00"
    package_id: "PRE.S00.v1"
    dependencies: []
    allowed_paths: ["."]
    forbidden_paths: []
    actions:
      - {id: "A01", type: "shell", command: "git rev-parse --show-toplevel", read_only: true}
      - {id: "A02", type: "shell", command: "git rev-parse HEAD", read_only: true}
      - {id: "A03", type: "shell", command: "git branch --show-current", read_only: true}
      - {id: "A04", type: "shell", command: "git status --porcelain=v1 --branch", read_only: true}
      - {id: "A05", type: "shell", command: "git remote -v", read_only: true}
      - {id: "A06", type: "shell", command: "git ls-files", read_only: true}
      - {id: "A07", type: "shell", command: "git log -1 --decorate --oneline", read_only: true}
      - {id: "A08", type: "shell", command: "python --version", read_only: true}
      - {id: "A09", type: "shell", command: "python -m pytest --version", read_only: true}
      - {id: "A10", type: "shell", command: "ruff --version", read_only: true}
      - {id: "A11", type: "shell", command: "mypy --version", read_only: true}
      - {id: "A12", type: "shell", command: "pre-commit --version", read_only: true}
      - {id: "A13", type: "shell", command: "git ls-files '.github/workflows/*'", read_only: true}
      - {id: "A14", type: "shell", command: "git ls-files 'tests/*'", read_only: true}
      - {id: "A15", type: "shell", command: "git grep -n -E 'HermesEnterpriseOS|ILAIOS|ILATEN|ILAKOS' -- . ':!dev/openclaw/evidence/*' || true", read_only: true}
      - {id: "A16", type: "shell", command: "git status --porcelain=v1 --branch", read_only: true}
    validations:
      - {id: "V01", rule: "A02 returns a valid Git commit SHA."}
      - {id: "V02", rule: "A03 returns master."}
      - {id: "V03", rule: "A04 pre-state and A16 post-state are identical."}
      - {id: "V04", rule: "No repository file is created, modified, renamed, deleted, staged, committed, or pushed during PRE.S00."}
      - {id: "V05", rule: "All required tool-version commands complete successfully."}
      - {id: "V06", rule: "Repository, test, CI, identifier, and existing evidence inventories are captured."}
    requirements: ["READ_ONLY", "FAIL_CLOSED", "NO_INFERENCE", "REPOSITORY_EVIDENCE_IS_TRUTH"]
    evidence_requirements:
      - "${HOME}/.openclaw/evidence/HermesEnterpriseOS/PRE.S00/commands.log"
      - "${HOME}/.openclaw/evidence/HermesEnterpriseOS/PRE.S00/pre_state.txt"
      - "${HOME}/.openclaw/evidence/HermesEnterpriseOS/PRE.S00/post_state.txt"
      - "${HOME}/.openclaw/evidence/HermesEnterpriseOS/PRE.S00/repository_inventory.txt"
      - "${HOME}/.openclaw/evidence/HermesEnterpriseOS/PRE.S00/toolchain.txt"
      - "${HOME}/.openclaw/evidence/HermesEnterpriseOS/PRE.S00/test_inventory.txt"
      - "${HOME}/.openclaw/evidence/HermesEnterpriseOS/PRE.S00/ci_inventory.txt"
      - "${HOME}/.openclaw/evidence/HermesEnterpriseOS/PRE.S00/identifier_inventory.txt"
      - "${HOME}/.openclaw/evidence/HermesEnterpriseOS/PRE.S00/decision.yaml"
    approvals: []
    budget_policy: null
    rollback: ["No rollback action is permitted or required because PRE.S00 is read-only."]
    stop_conditions: ["git_repository_not_detected", "branch_is_not_master", "repository_mutation_detected", "required_tool_missing", "required_field_missing_or_conflicting", "required_validation_failed_or_missing", "repository_evidence_contradicts_claimed_state"]
    expected_post_state: {repository_mutated: false, branch: "master", head_unchanged: true, worktree_state_unchanged: true, decision: "PASS|FAIL|BLOCKED"}
    commit_policy: {allow_commit: false, allow_push: false, force_push: false}
    status: "READY"

  - milestone_id: "VIDEO.V01"
    package_id: "VIDEO.V01.v1"
    legacy_traceability: "M01"
