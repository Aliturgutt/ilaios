schema_version: "1.0"
plan_id: "ILAIOS_OPENCLAW_CONTINUATION_v1_0"
controller: "dev/openclaw/MASTER_OPENCLAW.md"

canonical_authorities:
  - "ILAIOS_Master_Implementation_Specification_v1_0_CANONICAL_FINAL.docx"
  - "ILAIOS_Canonical_Milestone_Manifest_v1_0.docx"

execution:
  mode: "fail_closed_per_milestone"
  initial_milestone: "PRE.S01"
  auto_advance: true
  continue_after_nonpass: true
  dependency_evidence_required: true
  independent_ready_work_after_nonpass: true
  never_bypass_dependencies: true
  prose_inference: false
  architecture_changes: false
  release_auto_promotion: false

completed_context:
  PRE.S00: "Previously PASS under governed read-only evidence."
  VIDEO.V01_VIDEO.V30: "Durable PASS evidence exists under dev/openclaw/evidence; VIDEO.V30 is the predecessor for PRE.S01."

canonical_dependency_graph:
  PRE.S01: ["VIDEO.V30"]
  PLATFORM.P00: ["PRE.S01"]
  PLATFORM.P01: ["PLATFORM.P00"]
  PLATFORM.P02: ["PLATFORM.P01"]
  PLATFORM.P03: ["PLATFORM.P02"]
  PLATFORM.P04: ["PLATFORM.P02"]
  PLATFORM.P05: ["PLATFORM.P03", "PLATFORM.P04"]
  PLATFORM.P06: ["PLATFORM.P05"]
  PLATFORM.P07: ["PLATFORM.P06"]
  PLATFORM.P08: ["PLATFORM.P07"]
  PLATFORM.P09: ["PLATFORM.P08"]
  PLATFORM.P10: ["PLATFORM.P09"]
  PLATFORM.P11: ["PLATFORM.P10"]
  PLATFORM.P12: ["PLATFORM.P11"]
  PLATFORM.P13: ["PLATFORM.P12"]
  PLATFORM.P14: ["PLATFORM.P13"]
  PLATFORM.P15: ["PLATFORM.P14"]
  PLATFORM.P16: ["PLATFORM.P15"]
  PLATFORM.P17: ["PLATFORM.P16"]
  PLATFORM.P18: ["PLATFORM.P17"]
  PLATFORM.P19: ["PLATFORM.P18"]
  PLATFORM.P20: ["PLATFORM.P19"]
  RELEASE.R00: ["PLATFORM.P20"]
  RELEASE.R01: ["RELEASE.R00"]
  RELEASE.R02: ["RELEASE.R01"]
  RELEASE.R03: ["RELEASE.R02"]

package_activation:
  rule: "Only explicit READY packages below may execute."
  missing_package: "STOP"
  blocked_package: "SKIP_AND_RECOMPUTE_READY_SET"

evidence:
  root: "dev/openclaw/evidence"
  claim_without_evidence: "NOT_PASS"

common_allowed_paths: &common_allowed_paths
  - "src/**"
  - "tests/**"
  - "apps/**"
  - "services/**"
  - "packages/**"
  - "infra/**"
  - "docs/**"
  - ".github/**"
  - "pyproject.toml"
  - ".pre-commit-config.yaml"
  - "README.md"
  - "dev/openclaw/evidence/**"

common_forbidden_paths: &common_forbidden_paths
  - "ILAIOS_Master_Implementation_Specification_v1_0_CANONICAL_FINAL.docx"
  - "ILAIOS_Canonical_Milestone_Manifest_v1_0.docx"
  - "dev/openclaw/MASTER_OPENCLAW.md"
  - "dev/openclaw/execution_plan.yaml"

common_actions: &common_actions
  - id: "A01"
    type: "shell"
    command: "git status --porcelain=v1 --branch && git rev-parse HEAD && git rev-parse origin/master"
    read_only: true
  - id: "A02"
    type: "bounded_agent_audit_and_implementation"
    instruction: "Execute only the active package scope_intent and exit_intent using current repository evidence and established project patterns. Prefer proven existing code. Make only minimum bounded changes inside allowed_paths. Do not alter canonical authorities, dependency rules, security semantics, approval semantics, or release semantics. If exact completion cannot be proven, record FAIL/BLOCKED evidence and do not fake PASS."
  - id: "A03"
    type: "shell"
    command: "python -m pytest -q"
  - id: "A04"
    type: "shell"
    command: "ruff check ."
  - id: "A05"
    type: "shell"
    command: "mypy --strict src tests"
  - id: "A06"
    type: "shell"
    command: "pre-commit run --all-files"
  - id: "A07"
    type: "shell"
    command: "git diff --check && git status --porcelain=v1 --branch"
  - id: "A08"
    type: "controller_finalize"
    instruction: "Persist exact evidence. On PASS, stage only allowed changes, create one atomic commit if required, push to origin/master, verify HEAD == origin/master and clean worktree. On FAIL/BLOCKED, do not commit defective partial work; restore only active-package mutations when the declared rollback allows it, persist failure evidence, recompute the READY set, and continue only with milestones whose declared dependencies are proven PASS."

common_validations: &common_validations
  - {id: "V01", rule: "Every declared dependency has durable PASS evidence."}
  - {id: "V02", rule: "Repository branch is master and pre-state is captured."}
  - {id: "V03", rule: "scope_intent and exit_intent are proven by repository/runtime evidence, not file existence alone."}
  - {id: "V04", rule: "Required targeted and repository regression tests pass."}
  - {id: "V05", rule: "ruff, mypy --strict, pre-commit, and git diff --check pass."}
  - {id: "V06", rule: "No forbidden or unrelated file is modified."}
  - {id: "V07", rule: "On PASS, pushed HEAD equals origin/master and worktree is clean."}

common_requirements: &common_requirements
  - "REPOSITORY_EVIDENCE_IS_TRUTH"
  - "DETERMINISTIC_FIRST"
  - "MINIMUM_BOUNDED_CHANGE"
  - "NO_TEST_WEAKENING"
  - "NO_DEPENDENCY_BYPASS"
  - "NO_ARCHITECTURE_REDEFINITION"
  - "NO_AUTONOMOUS_RELEASE_PROMOTION"

common_budget_policy: &common_budget_policy
  paid_provider_calls: false
  external_spend: false

common_rollback: &common_rollback
  - "Before commit, restore only files changed by the active package if validation fails; never discard unrelated work."
  - "After a pushed commit, never rewrite Git history; use a governed recovery package if rollback is required."

common_stop_conditions: &common_stop_conditions
  - "branch_is_not_master"
  - "canonical_authority_conflict"
  - "scope_or_forbidden_path_conflict"
  - "missing_required_approval_or_secret_or_budget"
  - "unrecoverable_repository_state"

common_expected_post_state: &common_expected_post_state
  branch: "master"
  decision: "PASS|FAIL|BLOCKED"
  canonical_authorities_unchanged: true
  head_equals_origin_master_on_pass: true
  worktree_clean_on_pass: true

common_commit_policy: &common_commit_policy
  allow_commit: true
  allow_push: true
  force_push: false
  empty_commit: false
  one_atomic_commit_per_package: true

