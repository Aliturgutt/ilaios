recovery_actions: &recovery_actions
  - id: "A01"
    type: "shell"
    command: "git status --porcelain=v1 --branch && git rev-parse HEAD && git rev-parse origin/master"
    read_only: true
  - id: "A02"
    type: "bounded_agent_audit_and_implementation"
    instruction: "Execute only the active recovery package recovery_focus, canonical scope_intent, and exit_intent. Inspect real callers and runtime paths before editing. Implement minimum production behavior plus targeted unit, integration, negative, restart, and end-to-end tests appropriate to the scope. A reference contract, dataclass, in-process façade, asserted source label, requested boolean map, synthetic hash, or file-existence check alone can never satisfy runtime completion. Preserve accepted behavior and architecture. Make no release transition, paid provider call, external deployment, credential creation, canonical-document edit, or unrelated change. If exact completion cannot be executed and proven in the available environment, record FAIL or BLOCKED with the precise unmet condition."
  - id: "A03"
    type: "shell"
    command: "python -m pytest -q"
  - id: "A04"
    type: "shell"
    command: "ruff check ."
  - id: "A05"
    type: "shell"
    command: "mypy --strict src tests"
  - id: "A06"
    type: "shell"
    command: "pre-commit run --all-files"
  - id: "A07"
    type: "shell"
    command: "git diff --check && git status --porcelain=v1 --branch"
  - id: "A08"
    type: "controller_finalize"
    instruction: "Persist append-only recovery evidence under the exact active package evidence paths. On PASS, stage only allowed changes, create one atomic commit, push to origin/master, verify HEAD equals origin/master and the worktree is clean, then advance to the next recovery package. On FAIL or BLOCKED, do not fabricate PASS or overwrite historical evidence; preserve exact failure evidence and stop dependent recovery packages."

recovery_validations: &recovery_validations
  - {id: "V01", rule: "Every declared dependency is satisfied by the exact dependency_evidence paths in the active recovery package; historical affected PASS evidence is insufficient."}
  - {id: "V02", rule: "Repository branch is master and pre-state is captured."}
  - {id: "V03", rule: "Canonical scope_intent, exit_intent, and recovery_focus are proven by executable repository/runtime evidence."}
  - {id: "V04", rule: "Targeted unit, integration, negative, restart, and end-to-end tests required by the scope pass; direct-constructor-only tests do not prove a client/service boundary."}
  - {id: "V05", rule: "Full pytest, ruff, mypy strict, pre-commit, and git diff check pass."}
  - {id: "V06", rule: "No forbidden, unrelated, canonical-authority, or historical-evidence file is modified."}
  - {id: "V07", rule: "Runtime artifacts, process outputs, durable state, delivery outputs, or drill measurements are hashed and referenced where the scope requires them."}
  - {id: "V08", rule: "Mocks and fakes are limited to true external boundaries; they cannot replace the internal end-to-end path under acceptance."}
  - {id: "V09", rule: "Missing external provider, credential, domain, human owner, budget, or production infrastructure yields BLOCKED rather than invented evidence."}
  - {id: "V10", rule: "On PASS, pushed HEAD equals origin/master and worktree is clean."}

recovery_requirements: &recovery_requirements
  - "REPOSITORY_EVIDENCE_IS_TRUTH"
  - "DETERMINISTIC_FIRST"
  - "MINIMUM_BOUNDED_CHANGE"
  - "NO_TEST_WEAKENING"
  - "NO_DEPENDENCY_BYPASS"
  - "NO_ARCHITECTURE_REDEFINITION"
  - "NO_AUTONOMOUS_RELEASE_PROMOTION"
  - "NO_REFERENCE_CONTRACT_AS_RUNTIME_COMPLETION"
  - "NO_SYNTHETIC_BOOLEAN_AS_DRILL_EVIDENCE"
  - "NO_HASH_ONLY_ARTIFACT_ACCEPTANCE"
  - "APPEND_ONLY_RECOVERY_EVIDENCE"

common_validations: &common_validations
